<title>Piquinzada Torre de Controle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FDF6FA; --surface:#FFFFFF; --surface-2:#FBE9F4; --border:#F1D3E5; --border-soft:#F7E4EF;
  --text:#241220; --text-dim:#6B5566; --text-faint:#A0899B;
  --accent:#E01F7F; --accent-strong:#B8156A; --accent-soft:#FBDCEE; --accent-ink:#FFFFFF;
  --lime:#7C9A1A; --lime-bg:#C4E23C; --lime-soft:#EEF6D2; --gold:#C97A17; --gold-soft:#FBE9CE;
  --good:#1E8F63; --good-soft:#DCF0E6; --warn:#C1780F; --warn-soft:#FBEACC; --bad:#D6323F; --bad-soft:#FAE0E2;
  --shadow: 0 1px 2px rgba(120,10,70,.07), 0 8px 24px -12px rgba(120,10,70,.20);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1420; --surface:#271A28; --surface-2:#33213A; --border:#472C46; --border-soft:#38243A;
    --text:#F7ECF3; --text-dim:#C7A8C0; --text-faint:#8C6D89;
    --accent:#FF4FA3; --accent-strong:#FF7CBC; --accent-soft:#4A1E3C; --accent-ink:#1C0C17;
    --lime:#D2ED5C; --lime-bg:#3D4A16; --lime-soft:#2C3512; --gold:#F2A63D; --gold-soft:#3D2C14;
    --good:#3DBE87; --good-soft:#1C3A2C; --warn:#E0A234; --warn-soft:#3D2E14; --bad:#F0616D; --bad-soft:#3E1E22;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1420; --surface:#271A28; --surface-2:#33213A; --border:#472C46; --border-soft:#38243A;
  --text:#F7ECF3; --text-dim:#C7A8C0; --text-faint:#8C6D89;
  --accent:#FF4FA3; --accent-strong:#FF7CBC; --accent-soft:#4A1E3C; --accent-ink:#1C0C17;
  --lime:#D2ED5C; --lime-bg:#3D4A16; --lime-soft:#2C3512; --gold:#F2A63D; --gold-soft:#3D2C14;
  --good:#3DBE87; --good-soft:#1C3A2C; --warn:#E0A234; --warn-soft:#3D2E14; --bad:#F0616D; --bad-soft:#3E1E22;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif; text-wrap:balance;}
.mono, .num, input[type="number"], td.num, .kpi-value{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent-strong);}
::selection{background:var(--accent-soft);}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{padding:22px 20px 14px; border-bottom:1px solid var(--border-soft);}
#sidebar .brand .mark{font-family:'Fraunces',serif; font-size:20px; font-weight:600; letter-spacing:-.01em;}
#sidebar .brand .sub{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
nav.groups{padding:14px 10px 20px; flex:1;}
.navgroup{margin-bottom:16px;}
.navgroup .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); padding:0 10px 6px;}
.navitem{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  border:none; background:transparent; color:var(--text-dim); font-size:13.2px; font-family:inherit; cursor:pointer;
  margin-bottom:1px;
}
.navitem:hover{background:var(--surface-2); color:var(--text);}
.navitem.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.navitem .ic{width:16px; text-align:center; opacity:.85; font-size:13px;}
#sidebar .foot{padding:14px 20px 18px; border-top:1px solid var(--border-soft); font-size:11px; color:var(--text-faint);}
#sidebar .foot button{
  font-family:inherit; font-size:11px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border);
  border-radius:6px; padding:5px 9px; cursor:pointer; margin-top:8px;
}
#sidebar .foot button:hover{color:var(--bad);}

#main{flex:1; min-width:0; padding:28px 36px 80px; max-width:1360px;}
.topline{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.topline h1{font-size:26px; margin:0; font-weight:600;}
.topline .desc{color:var(--text-dim); font-size:13px; max-width:60ch;}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.section{margin-bottom:34px;}
.section > h2{font-size:17px; margin:0 0 3px; font-weight:600;}
.section > .sub{color:var(--text-dim); font-size:12.5px; margin-bottom:14px;}

.pillrow{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.pill{
  padding:6px 13px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text-dim);
}
.pill.active{background:var(--text); color:var(--bg); border-color:var(--text);}
.pill[data-scen="base"].active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.02em;}
.badge.good{background:var(--good-soft); color:var(--good);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.badge.bad{background:var(--bad-soft); color:var(--bad);}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-dim);}
label.field .lbl{font-weight:500; color:var(--text);}
input, select{
  font-family:inherit; font-size:13px; padding:7px 9px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); width:100%;
}
input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
input[readonly]{background:var(--surface-2); color:var(--text-dim);}
table{border-collapse:collapse; width:100%; font-size:12.6px;}
th{text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--border);}
td{padding:7px 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right;}
.tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
table input, table select{padding:5px 7px; font-size:12.4px;}
tfoot td{font-weight:700; border-top:1px solid var(--border); border-bottom:none;}

.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
.gridN{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
@media (max-width:1000px){.grid3{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;}}

.kpi{padding:14px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);}
.kpi .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
.kpi .kpi-value{font-size:20px; font-weight:600; margin-top:3px;}

.scenario-card{border-radius:14px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); overflow:hidden;}
.scenario-card .head{padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;}
.scenario-card .head .name{font-family:'Fraunces',serif; font-size:16.5px; font-weight:600;}
.scenario-card .body{padding:14px 18px 16px;}
.kv{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px dashed var(--border-soft); font-size:12.6px; gap:10px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);}
.kv .v{font-weight:600; text-align:right;}
.kv.total .k, .kv.total .v{font-weight:700; font-size:13.6px;}

.section-hdr-row{background:var(--surface-2);}
.section-hdr-row td{font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); padding-top:11px;}

.callout{border-radius:var(--radius); border:1px solid var(--border); padding:16px 18px; background:var(--surface);}
.callout.accent{border-color:var(--accent); background:var(--accent-soft);}
.recbox{display:grid; grid-template-columns:1fr 1fr; gap:14px 26px;}
.recbox .item .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
.recbox .item .val{font-size:14.5px; font-weight:600; margin-top:2px;}

.hint{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
.heatgrid{display:grid; grid-template-columns:70px repeat(5,1fr); gap:4px; max-width:520px;}
.heatcell{display:flex; align-items:center; justify-content:center; height:44px; border-radius:6px; font-weight:700; font-size:13px;}
.heataxis{display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-dim);}

button.btn{
  font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
button.btn.danger{color:var(--bad);}
button.btn.small{padding:5px 9px; font-size:11.5px;}
button.rm{border:none; background:transparent; color:var(--text-faint); cursor:pointer; font-size:15px; padding:2px 6px;}
button.rm:hover{color:var(--bad);}

.divider{height:1px; background:var(--border); margin:22px 0;}
.sticky-note{font-size:11.5px; color:var(--text-faint); font-style:italic;}
[hidden]{display:none !important;}
.chartwrap{position:relative; height:260px;}
.helptext{font-size:12.5px; color:var(--text-dim); line-height:1.6;}
.legend-dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px;}

/* info tooltip icon */
.info-ic{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-dim); font-size:10.5px; font-weight:700; font-family:'Public Sans',sans-serif; font-style:italic;
  cursor:help; vertical-align:middle; margin-left:5px; top:-1px;
}
.info-ic:hover, .info-ic:focus-visible{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); outline:none;}
.info-ic .tip{
  position:absolute; z-index:40; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) translateY(4px);
  width:min(280px, 60vw); background:var(--text); color:var(--bg); font-size:12px; font-weight:400; font-style:normal;
  line-height:1.45; padding:9px 11px; border-radius:8px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease;
}
.info-ic .tip::after{
  content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
  border:5px solid transparent; border-top-color:var(--text);
}
.info-ic:hover .tip, .info-ic:focus-visible .tip{opacity:1; transform:translateX(-50%) translateY(0);}
h1 .info-ic, h2 .info-ic{ top:-3px; }
</style>

/* ---------------- compute engine (espelha as formulas da planilha) ---------------- */
function computeVendas(scen){
  const lots = state.vendas[scen];
  const qtd = sum(lots.map(l=>l.qtd));
  const receitaBruta = sum(lots.map(l=>l.preco*l.qtd));
  const e = state.entradas[scen];
  const taxaTotal = e.taxaPlataforma + e.taxaCartao + e.tributosIngressos;
  const receitaLiquida = receitaBruta * (1 - taxaTotal);
  const ticketMedio = qtd ? receitaBruta/qtd : 0;
  return {qtd, receitaBruta, receitaLiquida, ticketMedio};
}
function computePatrocinio(scen){
  const tiers = state.patrocinios[scen];
  let nCotas=0, contratado=0, pipeline=0, esperado=0, nominal=0;
  tiers.forEach(t=>{
    const receitaAlvo = t.valorUnit*t.qtd;
    const prob = Number(t.prob)||0;
    const ponderada = receitaAlvo*prob;
    nCotas += Number(t.qtd)||0; nominal += receitaAlvo;
    if(t.estagio==='Contratado') contratado += ponderada; else pipeline += ponderada;
    esperado += ponderada;
  });
  return {nCotas, contratado, pipeline, esperado, nominal};
}
function computeCustoGroups(scen){
  const e = state.entradas[scen];
  const subAtracoes = sumObj(e.atracoes), subEstrutura = sumObj(e.estrutura), subOperacao = sumObj(e.operacao),
        subMarketing = sumObj(e.marketing), subLogistica = sumObj(e.logistica);
  // custo direto "fixo": nao inclui taxa sobre ingressos nem open bar (ver computeScenario)
  const custoDiretos = subAtracoes+subEstrutura+subOperacao+subMarketing+subLogistica+e.outros.despesasAdm;
  return {subAtracoes, subEstrutura, subOperacao, subMarketing, subLogistica, custoDiretos};
}
function computeScenario(scen, overrides){
  const e = state.entradas[scen];
  const ov = overrides || {};
  const v = computeVendas(scen);
  const p = computePatrocinio(scen);
  const g = computeCustoGroups(scen);

  const pagantesFactor = ov.pagantesFactor ?? 1;
  const ticketFactor = ov.ticketFactor ?? 1;
  const patroFactor = ov.patroFactor ?? 1;
  const consumoFactor = ov.consumoFactor ?? 1;
  const cacheOverride = ov.cachePrincipal ?? e.atracoes.cachePrincipal;
  const estruturaFactor = ov.estruturaFactor ?? 1;
  const custoTotalFactor = ov.custoTotalFactor ?? 1;

  // pagantes = capacidade x conversao da capacidade (igual ao modelo original: Premissas!D4*D6),
  // e nao a soma bruta dos lotes de venda — o plano de lotes define o TICKET MEDIO, a conversao define o volume
  const pagantes = e.capMax * e.conversaoPct * pagantesFactor;
  const publicoTotal = pagantes + e.cortesias;
  const ocupacao = e.capMax ? publicoTotal/e.capMax : 0;
  const taxaTotal = e.taxaPlataforma + e.taxaCartao + e.tributosIngressos;
  // receita de ingressos e reportada BRUTA (antes de taxas) — a taxa aparece como linha de custo,
  // exatamente como no modelo original do cliente (Cenarios!D5 é bruto; a taxa vira Custos!B10)
  const receitaIngressos = pagantes * v.ticketMedio * ticketFactor;
  const custoTaxaIngressos = receitaIngressos * taxaTotal;

  const margemConsumoPP = e.consumoBruto*(1-e.custoOpConsumoPct);
  const receitaConsumo = margemConsumoPP * pagantes * consumoFactor;

  const patrocinio = p.esperado * patroFactor;
  const outras = e.outrasReceitas;
  const receitaTotal = receitaIngressos + receitaConsumo + patrocinio + outras;

  const subAtracoes = g.subAtracoes - e.atracoes.cachePrincipal + cacheOverride;
  const subEstrutura = g.subEstrutura * estruturaFactor;
  const custoDiretos = subAtracoes + subEstrutura + g.subOperacao + g.subMarketing + g.subLogistica + e.outros.despesasAdm;
  const openBar = e.outros.openBarValor * e.capMax;
  const tributosValor = (e.outros.tributosReceita + e.outros.taxasBancarias + e.outros.comissoes) * receitaTotal;
  // base sujeita a contingencia: custos fixos + taxa sobre ingressos (igual ao modelo original)
  const baseConting = custoDiretos + custoTaxaIngressos + tributosValor;
  const contingenciaValor = baseConting * e.outros.contingenciaPct;
  // open bar fica FORA da contingencia (mesma estrutura da planilha do cliente)
  let custoTotal = (baseConting + contingenciaValor + openBar) * custoTotalFactor;

  const resultado = receitaTotal - custoTotal;
  const margem = receitaTotal ? resultado/receitaTotal : 0;
  const receitaPP = pagantes ? receitaTotal/pagantes : 0;
  const custoPP = pagantes ? custoTotal/pagantes : 0;
  const contribPP = v.ticketMedio*ticketFactor*(1-taxaTotal) + margemConsumoPP*consumoFactor;
  // break-even usa a mesma simplificacao do modelo original: exclui taxa de ingressos e open bar da base
  const beBase = custoDiretos * (1 + e.outros.contingenciaPct);
  const beSem = contribPP ? beBase/contribPP : 0;
  const beCom = contribPP ? Math.max(0,(beBase - patrocinio - outras)/contribPP) : 0;
  const pctCapBe = e.capMax ? beCom/e.capMax : 0;
  const mseg = pagantes ? (pagantes-beCom)/pagantes : 0;
  const patroMin = e.atracoes.cachePrincipal;
  const cobertura = e.atracoes.cachePrincipal ? patrocinio/e.atracoes.cachePrincipal : 0;

  const status = (margem>=state.params.margemVerde && mseg>=state.params.msegVerde) ? 'VERDE'
    : (margem<state.params.margemVermelho || mseg<0) ? 'VERMELHO' : 'AMARELO';
  const classif = status==='VERDE' ? 'GO' : status==='VERMELHO' ? 'NO-GO' : 'GO COM RESSALVAS';

  return {
    scen, pagantes, publicoTotal, ocupacao, ticketMedio: v.ticketMedio*ticketFactor,
    receitaIngressos, receitaConsumo, patrocinio, outras, receitaTotal,
    custoTotal, resultado, margem, receitaPP, custoPP, contribPP, beSem, beCom, pctCapBe, mseg,
    patroMin, cobertura, status, classif,
    patroContratado: p.contratado, patroPipeline: p.pipeline, patroNominal: p.nominal, nCotas: p.nCotas,
    custoDiretos, subAtracoes, subEstrutura, subOperacao: g.subOperacao, subMarketing: g.subMarketing,
    subLogistica: g.subLogistica, tributosValor, contingenciaValor, despesasAdm: e.outros.despesasAdm,
    custoTaxaIngressos, openBar, beBase, cachePrincipal: e.atracoes.cachePrincipal, capMax: e.capMax,
  };
}

function computeCustosSummary(){
  const rows = state.custos.map(c=>{
    const orcInicial = c.computed ? computedCostValue(c) : getPath(state.entradas.base, c.path);
    const orcAprovado = (c.orcamentoAprovado==null) ? orcInicial : Number(c.orcamentoAprovado);
    const contratado = Number(c.valorContratado)||0;
    const pago = Number(c.valorPago)||0;
    const eac = Math.max(orcAprovado, contratado);
    return Object.assign({}, c, {orcInicial, orcAprovado, contratado, pago, saldo: contratado-pago, eac});
  });
  const bac = sum(rows.map(r=>r.orcAprovado));
  const ac = sum(rows.map(r=>r.pago));
  const committed = sum(rows.map(r=>r.contratado));
  const eac = sum(rows.map(r=>r.eac));
  const etc = eac-ac; const vac = bac-eac;
  return {rows, bac, ac, committed, eac, etc, vac, pctComprom: bac?committed/bac:0, pctPago: bac?ac/bac:0};
}
function computedCostValue(c){
  const base = computeScenario('base');
  if(c.path[1]==='tributosValor') return base.tributosValor;
  if(c.path[1]==='contingencia') return base.contingenciaValor;
  if(c.path[1]==='custoTaxaIngressos') return base.custoTaxaIngressos;
  if(c.path[1]==='openBar') return base.openBar;
  return 0;
}
function computeOxR(){
  const cs = computeCustosSummary();
  return OXR_CATS.map(cat=>{
    const rows = cs.rows.filter(r=> OXR_GROUP[r.path.join('.')] === cat);
    const orcInicial = sum(rows.map(r=>r.orcInicial));
    const orcRevisado = sum(rows.map(r=>r.orcAprovado));
    const contratado = sum(rows.map(r=>r.contratado));
    const realizado = sum(rows.map(r=>r.pago));
    const projFinal = sum(rows.map(r=>r.eac));
    const saldo = orcRevisado-realizado;
    const desvio = projFinal-orcRevisado;
    const desvioPct = orcRevisado ? desvio/orcRevisado : 0;
    const classif = desvioPct<=0 ? 'Dentro do orçamento' : desvioPct<=0.05 ? 'Atenção' : 'Estourado';
    return {cat, orcInicial, orcRevisado, contratado, realizado, saldo, desvio, desvioPct, projFinal, classif};
  });
}

function computeVendaTracking(){
  const v = state.venda;
  const cs = computeScenario('base');
  const hoje = todayISO();
  const diasDecorridos = Math.max(1, daysBetween(v.dataInicio, hoje));
  const diasRestantes = Math.max(0, daysBetween(hoje, v.dataEvento));
  const vendidos = Number(v.vendidosHoje)||0;
  const metaVendas = cs.pagantes;
  const gap = metaVendas - vendidos;
  const velocidade = vendidos/diasDecorridos;
  const vendaDiariaNecessaria = diasRestantes>0 ? Math.max(0,gap)/diasRestantes : 0;
  const projecaoFinal = vendidos + velocidade*diasRestantes;
  const pctVendido = cs.capMax ? vendidos/cs.capMax : 0;
  const receitaRealizada = vendidos * cs.ticketMedio;
  return {diasDecorridos, diasRestantes, vendidos, metaVendas, gap, velocidade, vendaDiariaNecessaria, projecaoFinal, pctVendido, receitaRealizada, ingressosDisponiveis: cs.capMax-vendidos};
}

function computeBreakEven(scen){
  const cs = computeScenario(scen);
  const e = state.entradas[scen];
  const taxaTotal = e.taxaPlataforma+e.taxaCartao+e.tributosIngressos;
  const ticketMinimo = cs.pagantes ? (cs.beBase - cs.patrocinio - cs.receitaConsumo - cs.outras)/cs.pagantes/(1-taxaTotal) : 0;
  return Object.assign({}, cs, {ticketMinimo});
}
function simulador1(scen, patrocinioHipotetico){
  const cs = computeScenario(scen);
  return Math.max(0, (cs.beBase - patrocinioHipotetico - cs.outras)/cs.contribPP);
}
function simulador2(scen, ingressosHipoteticos){
  const cs = computeScenario(scen);
  return Math.max(0, cs.beBase - ingressosHipoteticos*cs.contribPP - cs.outras);
}
function simulador3(scen, novoCache){
  const cs = computeScenario(scen, {cachePrincipal: novoCache});
  return {novoCustoTotal: cs.custoTotal, novoBreakEven: cs.beCom};
}
function simulador4(scen, margemAlvo){
  const cs = computeScenario(scen);
  const e = state.entradas[scen];
  const taxaTotal = e.taxaPlataforma+e.taxaCartao+e.tributosIngressos;
  if(margemAlvo>=1 || !cs.pagantes) return 0;
  const receitaNecessaria = cs.custoTotal/(1-margemAlvo);
  return Math.max(0,(receitaNecessaria - cs.patrocinio - cs.receitaConsumo - cs.outras)/cs.pagantes/(1-taxaTotal));
}

function computeFluxoCaixa(){
  const scen = state.fluxo.scen;
  const cs = computeScenario(scen);
  const entAnnual = {receitaIngressos:cs.receitaIngressos, patrocinio:cs.patrocinio, receitaConsumo:cs.receitaConsumo, outras:cs.outras};
  const saiAnnual = {subAtracoes:cs.subAtracoes, subEstrutura:cs.subEstrutura, subOperacao:cs.subOperacao, subMarketing:cs.subMarketing,
    subLogistica:cs.subLogistica, despesasAdm:cs.despesasAdm, custoTaxaIngressos:cs.custoTaxaIngressos, openBar:cs.openBar, contingenciaValor:cs.contingenciaValor};
  const entMonthly = FC_ENT_KEYS.map(k=> state.fluxo.pctEnt[k].map(p=>p*entAnnual[k]));
  const saiMonthly = FC_SAI_KEYS.map(k=> state.fluxo.pctSai[k].map(p=>p*saiAnnual[k]));
  const totalEnt = MESES.map((_,m)=> sum(entMonthly.map(row=>row[m])));
  const totalSai = MESES.map((_,m)=> sum(saiMonthly.map(row=>row[m])));
  const periodo = MESES.map((_,m)=> totalEnt[m]-totalSai[m]);
  const acumulado = []; let acc = state.fluxo.saldoInicial;
  periodo.forEach(p=>{ acc += p; acumulado.push(acc); });
  const capGiro = Math.max(0, -Math.min(...acumulado));
  const resultadoFinal = sum(totalEnt)-sum(totalSai);
  const alerta = resultadoFinal>0 && Math.min(...acumulado)<0 ? 'risco'
    : Math.min(...acumulado)<0 ? 'risco2' : 'ok';
  return {entMonthly, saiMonthly, totalEnt, totalSai, periodo, acumulado, capGiro, resultadoFinal, alerta};
}
function capGiroFor(scen){
  const cs = computeScenario(scen);
  const entAnnual = {receitaIngressos:cs.receitaIngressos, patrocinio:cs.patrocinio, receitaConsumo:cs.receitaConsumo, outras:cs.outras};
  const saiAnnual = {subAtracoes:cs.subAtracoes, subEstrutura:cs.subEstrutura, subOperacao:cs.subOperacao, subMarketing:cs.subMarketing,
    subLogistica:cs.subLogistica, despesasAdm:cs.despesasAdm, custoTaxaIngressos:cs.custoTaxaIngressos, openBar:cs.openBar, contingenciaValor:cs.contingenciaValor};
  const entMonthly = FC_ENT_KEYS.map(k=> state.fluxo.pctEnt[k].map(p=>p*entAnnual[k]));
  const saiMonthly = FC_SAI_KEYS.map(k=> state.fluxo.pctSai[k].map(p=>p*saiAnnual[k]));
  const totalEnt = MESES.map((_,m)=> sum(entMonthly.map(row=>row[m])));
  const totalSai = MESES.map((_,m)=> sum(saiMonthly.map(row=>row[m])));
  let acc = state.fluxo.saldoInicial; const acumulado=[];
  MESES.forEach((_,m)=>{ acc += totalEnt[m]-totalSai[m]; acumulado.push(acc); });
  return Math.max(0, -Math.min(...acumulado));
}

function riskScore(r){ return r.prob*r.impacto; }
function riskLevel(score){ if(score>=16) return 'Crítico'; if(score>=10) return 'Alto'; if(score>=5) return 'Moderado'; return 'Baixo'; }
function riscosCriticosAbertos(){ return state.riscos.filter(r=> riskScore(r)>=16 && r.status!=='Encerrado').length; }
function maiorRiscoAtual(){
  const abertos = state.riscos.filter(r=>r.status!=='Encerrado');
  if(!abertos.length) return null;
  return abertos.reduce((best,r)=> riskScore(r)>riskScore(best)?r:best, abertos[0]);
}

function computeScore(){
  const scen = state.score.scen;
  const cs = computeScenario(scen);
  const cust = computeCustosSummary();
  const w = state.score.weights, m = state.score.metas;
  const sub = v => clamp(v,0,1)*100;
  const factors = [
    {label:'Margem esperada', weight:w.margem, meta:m.margem, valor:cs.margem, fmt:fmtPct, sub:sub(cs.margem/m.margem)},
    {label:'Margem de segurança (distância do break-even)', weight:w.mseg, meta:m.mseg, valor:cs.mseg, fmt:fmtPct, sub:sub(cs.mseg/m.mseg)},
    {label:'Patrocínio contratado / esperado', weight:w.patro, meta:1, valor: cs.patrocinio? cs.patroContratado/cs.patrocinio : 1, fmt:fmtPct, sub:0},
    {label:'Exposição financeira (invertida)', weight:w.exposicao, meta:1, valor: 1-((cust.bac-cs.patroContratado)/(cust.bac||1)), fmt:fmtPct, sub:0},
    {label:'% de custos já contratados (BAC)', weight:w.contratado, meta:1, valor: cust.pctComprom, fmt:fmtPct, sub:0},
    {label:'Contingência ainda disponível', weight:w.contingencia, meta:1, valor: 1, fmt:fmtPct, sub:0},
    {label:'Riscos críticos abertos (invertido)', weight:w.riscos, meta:0, valor: riscosCriticosAbertos(), fmt:v=>String(v), sub: Math.max(0,100-riscosCriticosAbertos()*25)},
    {label:'Necessidade de capital de giro (invertida)', weight:w.capgiro, meta:1, valor: 1-(capGiroFor(scen)/(cs.custoTotal||1)), fmt:fmtPct, sub:0},
  ];
  factors.forEach(f=>{ if(!f.sub) f.sub = clamp(f.valor/f.meta,0,1)*100; });
  const contingRow = state.custos.find(c=>c.path[1]==='contingencia');
  if(contingRow){
    const cs2 = computeCustosSummary();
    const row = cs2.rows.find(r=>r.path[1]==='contingencia');
    if(row){ factors[5].valor = row.orcAprovado? clamp(1-row.pago/row.orcAprovado,0,1):1; factors[5].sub = factors[5].valor*100; }
  }
  const totalWeight = sum(factors.map(f=>f.weight));
  const score = sum(factors.map(f=>f.weight*f.sub));
  const band = state.score.bands.find(b=> score>=b[0] && score<=b[1]) || state.score.bands[state.score.bands.length-1];
  return {factors, totalWeight, score, classif: band[2]};
}

/* liga inputs genericos via data-bind="a.b.c" (aceita indices numericos p/ arrays) */
function coerceType(el){
  if(el.dataset.kind==='pct') return 'pct';
  if(el.type==='number') return 'number';
  return 'text';
}
function wireGenericInputs(){
  // commita no "change" (perder o foco / Enter / Tab), nunca em cada tecla digitada —
  // recalcular e redesenhar a tela inteira a cada tecla destruía o campo no meio da digitação
  // e fazia parecer que "aparecia outro valor sozinho".
  $$('#view [data-bind]').forEach(el=>{
    el.addEventListener('change', onGenericBind);
    if(el.tagName==='INPUT' && (el.type==='text' || el.type==='number')) el.addEventListener('keydown', onEnterCommit);
  });
  $$('#view [data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  $$('#view [data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [group,val] = el.dataset.tab.split(':');
      setPath(state, group.split('.'), val);
      saveState(); render();
    });
  });
}
function onGenericBind(e){
  const el = e.target;
  const path = el.dataset.bind.split('.');
  let val = el.value;
  const kind = coerceType(el);
  if(kind==='number') val = val===''?0:Number(val);
  else if(kind==='pct') val = val===''?0:Number(val)/100;
  setPath(state, path, val);
  saveState();
  if(el.dataset.norerender) return;
  const preserveFocus = el.id || null;
  render();
  if(preserveFocus){ const again = document.getElementById(preserveFocus); if(again){ again.focus(); if(again.setSelectionRange && again.type==='text') { try{ again.setSelectionRange(again.value.length, again.value.length);}catch(_){} } } }
}
function onEnterCommit(e){
  if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); }
}
function onAction(e){
  const el = e.currentTarget || e.target.closest('[data-action]');
  const [action, ...args] = el.dataset.action.split(':');
  ACTIONS[action] && ACTIONS[action](...args);
}

/* ---------------- graficos SVG nativos (sem dependencia externa) ---------------- */
function niceMax(v){
  if(v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const step = n<=1?1:n<=2?2:n<=5?5:10;
  return step*p;
}
function svgBarChart(items, opts){
  opts = opts||{};
  const W = opts.width||320, H = opts.height||220;
  const padT=26, padB=32, padL=8, padR=8;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const vals = items.map(i=>i.value);
  const rawMax = Math.max(0, ...vals), rawMin = Math.min(0, ...vals);
  const domMax = rawMax>0 ? niceMax(rawMax) : 0;
  const domMin = rawMin<0 ? -niceMax(-rawMin) : 0;
  const span = (domMax-domMin)||1;
  const zeroY = padT + plotH*(domMax/span);
  const n = items.length;
  const gap = plotW*0.12/n;
  const bw = (plotW - gap*(n+1))/n;
  const fmt = opts.fmt || (v=>fmtCur(v));
  let bars='', labels='';
  items.forEach((it,i)=>{
    const x = padL + gap + i*(bw+gap);
    const valY = padT + plotH*((domMax-it.value)/span);
    const y = Math.min(valY, zeroY), h = Math.max(1,Math.abs(valY-zeroY));
    const labelY = it.value>=0 ? valY-6 : valY+14;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" style="fill:${it.color}"></rect>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--text)" font-family="IBM Plex Mono, monospace">${fmt(it.value)}</text>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${(H-10).toFixed(1)}" text-anchor="middle" font-size="11" style="fill:var(--text-dim)" font-family="Public Sans, sans-serif">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="gráfico de barras">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--border)" stroke-width="1"></line>
    ${bars}${labels}
  </svg>`;
}
function svgHBarChart(items, opts){
  opts = opts||{};
  const W = opts.width||600, rowH = opts.rowH||30;
  const H = items.length*rowH + 10;
  const labelW = opts.labelW||190, padR=70;
  const plotW = W-labelW-padR;
  const maxV = niceMax(Math.max(1,...items.map(i=>i.value)));
  const fmt = opts.fmt || (v=>fmtCur(v));
  let rows='';
  items.forEach((it,i)=>{

    rows += `<rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${rowH-12}" rx="4" style="fill:${it.color}"></rect>`;
    rows += `<text x="${(labelW+w+8).toFixed(1)}" y="${y+rowH*0.42}" font-size="11" font-weight="700" style="fill:var(--text)" font-family="IBM Plex Mono, monospace">${fmt(it.value)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="ranking de impacto">${rows}</svg>`;
}
function svgLineAreaChart(labels, series, opts){
  opts = opts||{};

  const allVals = series.flatMap(s=>s.data);
  const rawMax = Math.max(0,...allVals), rawMin = Math.min(0,...allVals);
  const domMax = niceMax(rawMax||1), domMin = rawMin<0 ? -niceMax(-rawMin) : 0;
  const span=(domMax-domMin)||1;
  const n = labels.length;
  const x = i => padL + plotW*(i/(n-1||1));
  const y = v => padT + plotH*((domMax-v)/span);
  const zeroY = y(0);
  let grid='';

  for(let t=0;t<=ticks;t++){

  let paths='';
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if(s.area){
      const areaPts = [`${x(0).toFixed(1)},${zeroY.toFixed(1)}`, ...pts, `${x(n-1).toFixed(1)},${zeroY.toFixed(1)}`];
      paths += `<polygon points="${areaPts.join(' ')}" style="fill:${s.color}" opacity="0.16"></polygon>`;
    }
    const dash = s.dash ? `stroke-dasharray="5,4"` : '';
    paths += `<polyline points="${pts.join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2.2" ${dash} stroke-linejoin="round" stroke-linecap="round"></polyline>`;
    if(!s.dash) s.data.forEach((v,i)=>{ paths += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" style="fill:${s.color}"></circle>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="fluxo de caixa">${grid}${paths}${xlabels}</svg>`;
}
function fmtCur0k(v){
  if(Math.abs(v)>=1000) return (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+'k';
  return fmtInt(v);
}
function chartLegend(items){
  return `<div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:8px;">${items.map(it=>
    `<span style="font-size:11.5px; color:var(--text-dim); display:inline-flex; align-items:center;"><span class="legend-dot" style="background:${it.color}"></span>${it.label}</span>`).join('')}</div>`;
}

  const tiers = state.patrocinios[scen];
  const p = computePatrocinio(scen);

  const stageRows = STAGE_LIST.map(s=>`<div class="kv"><span class="k">${s}</span><span class="v"><input id="${mkId('stageProb.'+s)}" type="number" step="1" style="width:70px; display:inline-block;" data-bind="stageProb.${s}" data-kind="pct" value="${Math.round(state.stageProb[s]*1000)/10}"> %</span></div>`).join('');

  const rows = tiers.map((t,i)=>{
    const alvo = t.valorUnit*t.qtd;
    const prob = Number(t.prob)||0;
    const ponderada = alvo*prob;
    return `<tr>
      <td>${tblInput(`patrocinios.${scen}.${i}.cota`, t.cota)}</td>
      <td class="num">${tblInput(`patrocinios.${scen}.${i}.valorUnit`, t.valorUnit, {type:'number', step:'500', cls:'num'})}</td>

      <td><select id="${mkId('patrocinios.'+scen+'.'+i+'.estagio')}" data-bind="patrocinios.${scen}.${i}.estagio">${STAGE_LIST.map(s=>`<option value="${s}" ${s===t.estagio?'selected':''}>${s}</option>`).join('')}</select></td>
      <td class="num">${tblInput(`patrocinios.${scen}.${i}.prob`, Math.round(prob*1000)/10, {type:'number', step:'1', cls:'num', kind:'pct', width:'62px'})}</td>

      <td class="num mono">${fmtCur(ponderada)}</td>

    <table>
      <thead><tr><th>Cota</th><th class="num">Valor unitário</th><th class="num">Qtd. alvo</th><th>Estágio</th><th class="num">Prob. %</th><th class="num">Receita alvo</th><th class="num">Receita ponderada</th><th></th></tr></thead>

/* ================= FLUXO DE CAIXA ================= */
function pctMonthTable(title, labels, keys, storePath){
  const rows = keys.map((k,ri)=>{
    const cells = MESES.map((_,m)=>{
      const path = `${storePath}.${k}.${m}`;
      const v = Math.round((getPath(state, path.split('.'))||0)*1000)/10;
      return `<td><input id="${mkId(path)}" type="number" step="1" data-bind="${path}" data-kind="pct" value="${v}" style="width:52px; padding:4px 5px; font-size:11.5px;"></td>`;
    }).join('');
    return `<tr><td style="white-space:nowrap;">${labels[ri]}</td>${cells}</tr>`;
  }).join('');
  return `<div class="tablewrap" style="margin-bottom:10px;"><table>
    <thead><tr><th>${title}</th>${MESES.map(m=>`<th class="num">${m}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ================= SENSIBILIDADE ================= */
VIEWS.sensibilidade = function(){
  const scen = state.sensibilidade.scen;
  const base = computeScenario(scen).resultado;
  const receitaBase = computeScenario(scen).receitaTotal;

  const matrixRows = SENS_VARS.map(v=>{
    const cells = SENS_VARIACOES.map(variacao=>{
      const r = sensResultado(scen, v.key, variacao);
      const isBase = variacao===0;
      return `<td class="num mono" style="${isBase?'font-weight:700;':''}">${fmtCur(r)}</td>`;
    }).join('');
    return `<tr><td>${v.label}</td>${cells}</tr>`;
  }).join('');

  const rankRows = SENS_VARS.map(v=>{
    const rNeg = sensResultado(scen, v.key, -0.2), rPos = sensResultado(scen, v.key, 0.2);
    const impacto = Math.max(Math.abs(rNeg-base), Math.abs(rPos-base));
    const pct = receitaBase ? impacto/receitaBase : 0;
    return {label:v.label, impacto, pct, nivel: sensLevel(pct)};
  }).sort((a,b)=>b.impacto-a.impacto);

  return `
  <div class="topline"><div><h1>Análise de sensibilidade${infoIcon('Testa o quanto o resultado financeiro muda se uma única variável (vendas, ticket, patrocínio, cachê, custos...) subir ou descer, mantendo tudo o mais igual. O ranking mostra quais variáveis pesam mais no resultado.')}</h1><div class="desc">Impacto no resultado quando cada variável muda isoladamente (demais premissas mantidas fixas).</div></div></div>
  ${scenPills('sensibilidade.scen', scen)}

  <div class="tablewrap">
    <table>
      <thead><tr><th>Variável</th>${SENS_VARIACOES.map(v=>`<th class="num">${v===0?'BASE':(v>0?'+':'')+Math.round(v*100)+'%'}</th>`).join('')}</tr></thead>
      <tbody>${matrixRows}</tbody>
    </table>
  </div>

  <div class="section" style="margin-top:26px;">
    <h2>Ranking de impacto <span class="hint">variação de referência: ±20%</span></h2>
    <div class="tablewrap" style="padding:12px 6px;">${svgHBarChart(rankRows.map(r=>({label:r.label, value:r.impacto, color:levelColor(r.nivel)})), {fmt:v=>fmtCur0k(v)})}</div>
  </div>`;
};
function levelColor(n){ return n==='Baixo'?'var(--good)':n==='Moderado'?'var(--gold)':n==='Alto'?'var(--warn)':'var(--bad)'; }

      <td>${badge(nivel)}</td>
      <td><select id="${mkId('riscos.'+i+'.resposta')}" data-bind="riscos.${i}.resposta">${RESPOSTAS.map(s=>`<option ${s===r.resposta?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><select id="${mkId('riscos.'+i+'.status')}" data-bind="riscos.${i}.status">${STATUS_RISCO.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><button class="rm" data-action="rmRisco:${i}">✕</button></td>
    </tr>`;
  }).join('');

  const heat = [5,4,3,2,1].map(prob=>{
    const cells = [1,2,3,4,5].map(imp=>{
      const count = risks.filter(r=>r.prob===prob && r.impacto===imp).length;
      const score = prob*imp;
      const bg = score>=16?'var(--bad-soft)':score>=10?'#F3D3B0':score>=5?'var(--warn-soft)':'var(--good-soft)';
      const fg = score>=16?'var(--bad)':score>=10?'#A85A1E':score>=5?'var(--warn)':'var(--good)';
      return `<div class="heatcell" style="background:${bg}; color:${fg};">${count||''}</div>`;
    }).join('');
    return `<div class="heataxis">${prob}</div>${cells}`;
  }).join('');

  return `
  <div class="topline"><div><h1>Gestão de riscos${infoIcon('Registro de riscos do projeto: cada linha tem uma Probabilidade e um Impacto de 1 a 5, cujo produto vira o Score e a classificação de severidade. O mapa de calor mostra onde os riscos estão concentrados.')}</h1><div class="desc">Risk register PMO — Probabilidade e Impacto de 1 (muito baixo) a 5 (muito alto). Score = Probabilidade × Impacto.</div></div></div>

  <div class="gridN" style="margin-bottom:18px;">
    <div class="kpi"><div class="lbl">Total de riscos</div><div class="kpi-value">${risks.length}</div></div>
    <div class="kpi"><div class="lbl">Críticos abertos (score ≥ 16)</div><div class="kpi-value" style="color:${riscosCriticosAbertos()>0?'var(--bad)':'var(--good)'}">${riscosCriticosAbertos()}</div></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Categoria</th><th>Risco</th><th class="num">Prob.</th><th class="num">Impacto</th><th class="num">Score</th><th>Nível</th><th>Resposta</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <button class="btn small" style="margin-top:10px;" data-action="addRisco">+ Adicionar risco</button>

  <div class="section" style="margin-top:26px;">
    <h2>Mapa de calor — Probabilidade × Impacto</h2>
    <div class="heatgrid">
      <div></div><div class="heataxis">1</div><div class="heataxis">2</div><div class="heataxis">3</div><div class="heataxis">4</div><div class="heataxis">5</div>
      ${heat}
    </div>
    <div class="hint" style="margin-top:8px;">Linhas = probabilidade, colunas = impacto. Número = quantidade de riscos naquela célula.</div>
  </div>`;
};
ACTIONS.addRisco = ()=>{ state.riscos.push({id:uid(), categoria:'Operação', risco:'Novo risco', causa:'', consequencia:'', prob:3, impacto:3, resposta:'Mitigar', plano:'', responsavel:'Produção', prazo:'', status:'Aberto'}); saveState(); render(); };
ACTIONS.rmRisco = (i)=>{ state.riscos.splice(Number(i),1); saveState(); render(); };

/* ================= GATES PMO ================= */
VIEWS.gates = function(){
  const gates = computeGates();
  const decisoes = ['Aprovado','Aprovado com ressalvas','Reprovado','Pendente'];
  const respKeys = {1:'g1',2:'g2',3:'g3',4:'g4',5:'g5'};

  const rows = gates.map(g=>{
    const statusTxt = g.n===3 ? (g.atingido?'Atingido':g.parcial?'Em andamento':'Não atingido')
      : (g.atingido?'Atingido':'Não atingido');
    const resultCell = g.n===3
      ? `<select id="${mkId('gates.gate3')}" data-bind="gates.gate3"><option ${state.gates.gate3==='Sim'?'selected':''}>Sim</option><option ${state.gates.gate3==='Não'?'selected':''}>Não</option><option ${state.gates.gate3==='Parcial'?'selected':''}>Parcial</option></select>`
      : `<span class="mono">${g.resultadoFmt||g.resultado}</span>`;
    const metaCell = g.n===2||g.n===4 ? `<span class="mono">${g.metaFmt}</span>` : g.meta;
    const rk = respKeys[g.n];
    return `<tr>
      <td><strong>Gate ${g.n}</strong><br><span class="hint">${g.titulo}</span></td>
      <td style="max-width:260px;">${g.criterio}</td>
      <td class="num">${metaCell}</td>
      <td class="num">${resultCell}</td>
      <td>${badge(statusTxt)}</td>
      <td>${tblInput(`gates.resp.${rk}`, state.gates.resp[rk])}</td>
      <td>${tblInput(`gates.prazo.${rk}`, state.gates.prazo[rk], {type:'date'})}</td>
      <td><select id="${mkId('gates.decisao.'+rk)}" data-bind="gates.decisao.${rk}">${decisoes.map(d=>`<option ${d===state.gates.decisao[rk]?'selected':''}>${d}</option>`).join('')}</select></td>
    </tr>`;
  }).join('');

  return `
  <div class="topline"><div><h1>Gates PMO${infoIcon('Cinco pontos de controle formais do projeto — do "podemos seguir com o evento" até a liberação final. Cada gate compara uma meta com o resultado atual e mostra se já foi Atingido.')}</h1><div class="desc">Pontos formais de decisão go/no-go ao longo do ciclo de vida do evento.</div></div></div>

  <div class="card" style="padding:14px 18px; margin-bottom:18px;">
    <div class="gridN">
      ${fld('Gate 2 · % mínimo de patrocínio/garantia exigido', 'gates.pctPatrocinioMin', {kind:'pct'})}
      ${fld('Gate 4 · % mínimo de vendas realizadas exigido', 'gates.pctVendasMin', {kind:'pct'})}
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Gate</th><th>Critério</th><th class="num">Meta</th><th class="num">Resultado atual</th><th>Status</th><th>Responsável</th><th>Prazo</th><th>Decisão</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div class="hint" style="margin-top:10px;">O Gate 2 não deve ser considerado atingido enquanto o patrocínio contratado não alcançar o % mínimo definido acima — essa é a trava antes de contratar definitivamente a atração principal.</div>`;
};

/* ================= COMPARATIVO ================= */
VIEWS.comparativo = function(){
  const cs = allScenarios();
  const rows = [
    ['Pagantes', s=>fmtInt(cs[s].pagantes)], ['% Ocupação', s=>fmtPct(cs[s].ocupacao)],
    ['Ticket médio', s=>fmtCur2(cs[s].ticketMedio)], ['Receita de ingressos', s=>fmtCur(cs[s].receitaIngressos)],
    ['Receita de consumo/ativações', s=>fmtCur(cs[s].receitaConsumo)], ['Patrocínio esperado', s=>fmtCur(cs[s].patrocinio)],
    ['RECEITA TOTAL', s=>fmtCur(cs[s].receitaTotal)], ['CUSTO TOTAL', s=>fmtCur(cs[s].custoTotal)],
    ['RESULTADO', s=>fmtCur(cs[s].resultado)], ['MARGEM', s=>fmtPct(cs[s].margem)],
    ['Break-even (ingressos)', s=>fmtInt(cs[s].beCom)],
    ['Exposição financeira', s=>fmtCur(computeCustosSummary().bac - cs[s].patroContratado)],
    ['Necessidade de capital de giro', s=>fmtCur(capGiroFor(s))],
    ['Status', s=>badge(cs[s].status)], ['Classificação', s=>badge(cs[s].classif)],
  ];
  return `
  <div class="topline"><div><h1>Comparativo dos 3 cenários${infoIcon('Coloca Conservador, Base e Agressivo lado a lado nos mesmos indicadores, com gráficos de receita, custo, resultado e margem para facilitar a comparação visual.')}</h1><div class="desc">Tudo aqui é lido diretamente do motor de cálculo.</div></div></div>
  <div class="tablewrap" style="margin-bottom:26px;">
    <table>
      <thead><tr><th>Indicador</th>${SCEN.map(s=>`<th class="num">${SCEN_LABEL[s]}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([l,fn])=>`<tr><td>${l}</td>${SCEN.map(s=>`<td class="num">${fn(s)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  </div>
  <div class="grid2">
    <div class="card" style="padding:14px 18px;"><h3 style="margin:0 0 8px; font-size:13px;">Receita total</h3><div class="chartwrap" style="height:200px;">${svgBarChart(SCEN.map(s=>({label:SCEN_LABEL[s], value:cs[s].receitaTotal, color:SCEN_HEX[s]})), {fmt:v=>fmtCur0k(v)})}</div></div>
    <div class="card" style="padding:14px 18px;"><h3 style="margin:0 0 8px; font-size:13px;">Custo total</h3><div class="chartwrap" style="height:200px;">${svgBarChart(SCEN.map(s=>({label:SCEN_LABEL[s], value:cs[s].custoTotal, color:SCEN_HEX[s]})), {fmt:v=>fmtCur0k(v)})}</div></div>
    <div class="card" style="padding:14px 18px;"><h3 style="margin:0 0 8px; font-size:13px;">Resultado</h3><div class="chartwrap" style="height:200px;">${svgBarChart(SCEN.map(s=>({label:SCEN_LABEL[s], value:cs[s].resultado, color:SCEN_HEX[s]})), {fmt:v=>fmtCur0k(v)})}</div></div>
    <div class="card" style="padding:14px 18px;"><h3 style="margin:0 0 8px; font-size:13px;">Margem</h3><div class="chartwrap" style="height:200px;">${svgBarChart(SCEN.map(s=>({label:SCEN_LABEL[s], value:cs[s].margem, color:SCEN_HEX[s]})), {fmt:v=>fmtPct(v)})}</div></div>
  </div>`;
};

/* ================= SCORE DE VIABILIDADE ================= */
VIEWS.score = function(){
  const scen = state.score.scen;
  const res = computeScore();
  const gaugeColor = res.score>=80?'var(--good)':res.score>=50?'var(--warn)':'var(--bad)';

  const factorRows = res.factors.map((f,i)=>`<tr>
    <td>${f.label}</td>
    <td class="num"><span style="display:inline-flex; align-items:center; gap:4px; justify-content:flex-end;">${tblInput(`score.weights.${Object.keys(state.score.weights)[i]}`, Math.round(f.weight*1000)/10, {type:'number', cls:'num', kind:'pct', width:'56px'})}<span class="hint">%</span></span></td>
    <td class="num mono">${f.fmt(f.valor)}</td>
    <td class="num mono">${fmtNum(f.sub,1)}</td>
  </tr>`).join('');

  return `
  <div class="topline"><div><h1>Score de viabilidade${infoIcon('Índice de 0 a 100 que combina margem, distância do break-even, patrocínio contratado, exposição financeira, riscos e capital de giro num único número, para responder rápido: o evento está viável?')}</h1><div class="desc">Índice de 0 a 100. Pesos e metas de referência são editáveis.</div></div></div>
  ${scenPills('score.scen', scen)}

  <div class="grid2">
    <div class="tablewrap">
      <table>
        <thead><tr><th>Fator</th><th class="num">Peso</th><th class="num">Valor atual</th><th class="num">Subscore</th></tr></thead>
        <tbody>${factorRows}</tbody>
        <tfoot><tr><td>Soma dos pesos</td><td class="num mono">${fmtPct(res.totalWeight)}</td><td></td><td></td></tr></tfoot>
      </table>
    </div>
    <div class="card" style="padding:22px; text-align:center;">
      <div class="hint">SCORE DE VIABILIDADE</div>
      <div style="font-family:'Fraunces',serif; font-size:56px; font-weight:600; color:${gaugeColor}; line-height:1;">${fmtNum(res.score,1)}</div>
      <div style="margin-top:10px;">${badge(res.classif)}</div>
      <div class="divider"></div>
      <div style="text-align:left;">
        ${state.score.bands.map(b=>`<div class="kv"><span class="k">${b[2]}</span><span class="v mono">${b[0]}–${b[1]===100?100:Math.floor(b[1])}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
};

  const btn = e.target.closest('[data-nav]');
  if(btn) goTo(btn.dataset.nav);

$('#resetBtn').addEventListener('click', ()=>{
  if(confirm('Isso vai apagar os dados salvos neste navegador e restaurar os valores de exemplo. Continuar?')){
    localStorage.removeItem(STORAGE_KEY);
    state = freshState();
    saveState();
    currentView = 'dashboard';
    render();
  }
});

render();
</script>
