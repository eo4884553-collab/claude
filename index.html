<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Obra — Medição, BM e Físico-Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
<style>
:root{
  --bg:#0f1420; --bg2:#161d2e; --panel:#1b2436; --panel2:#212c42;
  --border:#2c3a54; --text:#e7ecf5; --muted:#8fa0bd; --muted2:#647492;
  --accent:#4d8dff; --accent2:#2f6fe0; --good:#3ecf8e; --warn:#f0b93d; --bad:#f0563d;
  --input-bg:#111826; --radius:8px; --mono:'SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;}
body{display:flex;flex-direction:column;min-height:100vh;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:#33415c;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn.primary:hover{background:var(--accent);}
.btn.good{background:#1c3a2c;border-color:var(--good);color:var(--good);}
.btn.warn{background:#3a2f14;border-color:var(--warn);color:var(--warn);}
.btn.bad{background:#3a1c18;border-color:var(--bad);color:var(--bad);}
.btn.sm{padding:3px 8px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* header */
header.topbar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header.topbar .title{font-weight:700;font-size:14.5px;margin-right:auto;display:flex;align-items:center;gap:8px;}
header.topbar .title .sub{color:var(--muted);font-weight:400;font-size:11.5px;}
.kpi-strip{display:flex;gap:8px;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;min-width:118px;flex:0 0 auto;}
.kpi-mini .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.kpi-mini .v{font-size:13.5px;font-weight:700;margin-top:1px;}
.kpi-mini .v.bad{color:var(--bad);}
.kpi-mini .v.good{color:var(--good);}

/* tabs */
nav.tabs{display:flex;gap:2px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
nav.tabs button{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
nav.subtabs{display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap;}
nav.subtabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px 6px 0 0;font-size:12px;font-weight:600;}
nav.subtabs button.active{color:var(--text);background:var(--panel2);border-color:var(--accent);border-bottom-color:var(--panel2);}

main{flex:1;padding:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.panel h2{margin:0 0 4px;font-size:15px;}
.panel h3{margin:0 0 8px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.hint{color:var(--muted);font-size:11.5px;line-height:1.5;}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--muted2);color:var(--bg);font-size:10px;font-weight:700;font-style:normal;cursor:help;margin-left:7px;position:relative;vertical-align:middle;line-height:1;}
.info-icon:hover,.info-icon:focus{background:var(--accent);outline:none;}
.info-icon .info-tip{display:none;position:absolute;top:130%;left:0;z-index:60;width:340px;max-width:min(340px,70vw);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;font-weight:400;line-height:1.5;color:var(--text);box-shadow:0 10px 28px rgba(0,0,0,.4);text-align:left;white-space:normal;}
.info-icon:hover .info-tip,.info-icon:focus .info-tip{display:block;}
.panel h2,.panel h3{display:flex;align-items:center;flex-wrap:wrap;}
.grid{display:grid;gap:10px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;}
.kpi .v.bad{color:var(--bad);}
.kpi .v.good{color:var(--good);}
.kpi .s{font-size:10.5px;color:var(--muted2);margin-top:2px;}

.charts-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;}
@media (max-width:1000px){.charts-row{grid-template-columns:1fr;}}
.chart-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;}
.chart-box h4{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;}
canvas{max-width:100%;display:block;}

/* ---- Viz system: validated categorical / status / sequential tokens ---- */
:root{
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-4:#c98500;
  --viz-5:#d55181; --viz-6:#008300; --viz-7:#9085e9; --viz-8:#e66767;
  --viz-good:#0ca30c; --viz-warning:#fab219; --viz-serious:#ec835a; --viz-critical:#d03b3b;
  --viz-grid: rgba(255,255,255,.09); --viz-axis: rgba(255,255,255,.22);
  --viz-other:#5a6b8c;
}
.viz-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.viz-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.viz-head h4{margin:0;font-size:12px;color:var(--text);font-weight:700;}
.viz-head .viz-sub{font-size:10.5px;color:var(--muted2);margin-top:1px;}
.viz-tblbtn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:5px;font-size:10.5px;cursor:pointer;white-space:nowrap;}
.viz-tblbtn:hover{color:var(--text);border-color:var(--accent);}
.viz-legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 2px;font-size:10.8px;color:var(--muted);}
.viz-legend .lg-item{display:flex;align-items:center;gap:5px;}
.viz-legend .lg-swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
.viz-legend .lg-line{width:14px;height:2px;border-radius:1px;flex:0 0 auto;}
.viz-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.viz-table th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;}
.viz-table td{padding:5px 8px;border-bottom:1px solid #22304a;color:var(--text);}
.viz-table td.num{text-align:right;font-variant-numeric:tabular-nums;}

/* Stat tiles */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;}
.stat-tile{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;}
.stat-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.stat-value{font-size:21px;font-weight:700;margin-top:4px;color:var(--text);line-height:1.15;}
.stat-value.bad{color:var(--viz-critical);}
.stat-value.good{color:var(--viz-good);}
.stat-delta{font-size:11px;margin-top:5px;font-weight:600;display:flex;align-items:baseline;gap:5px;}
.stat-delta.good{color:var(--viz-good);}
.stat-delta.bad{color:var(--viz-critical);}
.stat-delta-sub{color:var(--muted2);font-weight:400;}
.stat-sub{font-size:10.5px;color:var(--muted2);margin-top:5px;}
.stat-spark{display:block;margin-top:8px;width:100%;height:26px;}

/* Meter */
.meter{margin-bottom:4px;}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.meter-value{font-size:12px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.meter-track{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}
.meter-fill{height:100%;border-radius:6px;transition:width .25s;}
.meter-ref{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--viz-axis);}

/* Horizontal bars */
.hbar-chart{display:flex;flex-direction:column;gap:9px;}
.hbar-row{display:flex;align-items:center;gap:9px;}
.hbar-label{flex:0 0 132px;width:132px;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
.hbar-tracks{flex:1;position:relative;}
.hbar-track{position:relative;height:12px;background:rgba(255,255,255,.05);border-radius:0 4px 4px 0;margin-bottom:2px;}
.hbar-track:last-child{margin-bottom:0;}
.hbar-fill{position:absolute;top:0;left:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px;transition:width .2s;cursor:pointer;}
.hbar-fill:hover{filter:brightness(1.18);}
.hbar-val{flex:0 0 auto;min-width:96px;font-size:11px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
.hbar-axis{display:flex;margin-left:141px;border-top:1px solid var(--viz-grid);padding-top:4px;position:relative;height:14px;}
.hbar-axis span{position:absolute;font-size:9.5px;color:var(--muted2);transform:translateX(-50%);}
.hbar-axis span:first-child{transform:translateX(0);}
.hbar-axis span:last-child{transform:translateX(-100%);}

/* Diverging bars */
.dbar-row{display:flex;align-items:center;gap:9px;}
.dbar-label{flex:0 0 132px;width:132px;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dbar-track{flex:1;position:relative;height:14px;background:rgba(255,255,255,.05);border-radius:4px;}
.dbar-mid{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--viz-axis);}
.dbar-fill{position:absolute;top:0;bottom:0;border-radius:3px;cursor:pointer;min-width:2px;}
.dbar-fill:hover{filter:brightness(1.18);}
.dbar-val{flex:0 0 auto;min-width:96px;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* Stacked part-to-whole bar */
.sbar-track{display:flex;height:22px;border-radius:6px;overflow:hidden;width:100%;background:rgba(255,255,255,.05);}
.sbar-seg{height:100%;position:relative;cursor:pointer;border-right:2px solid var(--panel2);}
.sbar-seg:last-child{border-right:none;}
.sbar-seg:hover{filter:brightness(1.18);}

/* Line chart */
.viz-line-wrap{position:relative;}
.viz-line-wrap svg{display:block;width:100%;overflow:visible;}
.viz-crosshair{stroke:var(--viz-axis);stroke-width:1;pointer-events:none;opacity:0;}

/* Shared tooltip */
#vizTooltip{position:fixed;z-index:400;background:#0d1420;border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:11.5px;color:var(--text);pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .08s;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;}
#vizTooltip.show{opacity:1;}
#vizTooltip .vt-title{color:var(--muted);font-size:10.5px;margin-bottom:3px;}
#vizTooltip .vt-row{display:flex;align-items:center;gap:6px;}
#vizTooltip .vt-key{width:10px;height:2px;border-radius:1px;flex:0 0 auto;}
#vizTooltip .vt-val{font-weight:700;}
#vizTooltip .vt-name{color:var(--muted);}

/* ---- Contratos ---- */
.contract-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.contract-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;}
.contract-card:hover{border-color:var(--accent);}
.contract-card .cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.contract-card .cc-fornecedor{font-weight:700;font-size:13.5px;color:var(--text);line-height:1.3;}
.contract-card .cc-numero{font-size:10.5px;color:var(--muted2);margin-top:2px;}
.contract-card .cc-objeto{font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.contract-card .cc-vals{display:flex;justify-content:space-between;font-size:11px;margin-top:2px;}
.contract-card .cc-vals b{color:var(--text);font-size:13px;}
.contract-card .cc-meter{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
.contract-card .cc-meter-fill{height:100%;border-radius:4px;}
.contract-card .cc-foot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted2);}
.tag.contract-ativo{background:#123524;color:var(--viz-good);}
.tag.contract-encerrado{background:#22304a;color:var(--muted);}
.tag.contract-suspenso{background:#3a2f14;color:var(--viz-warning);}
.tag.contract-vencendo{background:#3a1c18;color:var(--viz-critical);}
.contract-detail{display:flex;flex-direction:column;gap:14px;}
.contract-detail .cd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.diretrizes-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.diretrizes-list li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;}
.diretrizes-list li .dl-bullet{color:var(--accent);flex:0 0 auto;}
.diretrizes-list li .dl-text{flex:1;}
.diretrizes-list li .dl-del{flex:0 0 auto;background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:14px;line-height:1;}
.diretrizes-list li .dl-del:hover{color:var(--viz-critical);}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.info-item .il{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.info-item .iv{font-size:13px;color:var(--text);margin-top:3px;line-height:1.4;}
.info-item input,.info-item select,.info-item textarea{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:5px;font-size:12.5px;margin-top:4px;}
.info-item input:focus,.info-item select:focus,.info-item textarea:focus{border-color:var(--accent);outline:none;}
.aditivo-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.aditivo-card .ac-head{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;}
.aditivo-card .ac-body{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

.risk-banner{border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px;}
.risk-banner.bad{background:#3a1c18;border:1px solid var(--bad);color:#ffb3a3;}
.risk-banner.good{background:#123524;border:1px solid var(--good);color:#a9f0cf;}

/* filter bar */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;}
.filterbar label{font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;}
.filterbar select,.filterbar input[type=text]{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;font-size:12px;min-width:110px;}
.filterbar .count{margin-left:auto;color:var(--muted);font-size:11.5px;}

.bulkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:8px;background:#182238;border:1px dashed var(--accent2);border-radius:8px;font-size:12px;}
.bulkbar select,.bulkbar input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;font-size:12px;}
.bulkbar input[type=number]{width:110px;}

/* tables */
.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px;}
table.datatable{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;}
table.datatable thead th{position:sticky;top:0;background:#1a2338;color:var(--muted);text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.02em;padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid #22304a;white-space:nowrap;z-index:2;user-select:none;}
table.datatable thead th .resizer{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;}
table.datatable th{position:sticky;top:0;}
table.datatable td{padding:4px 8px;border-bottom:1px solid #22304a;border-right:1px solid #1e2a41;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;}
table.datatable td.wrap{white-space:normal;overflow:visible;text-overflow:clip;}
table.datatable tbody tr:hover td{background:#1d2a42;}
table.datatable td input,table.datatable td select,table.datatable td textarea{width:100%;background:var(--input-bg);border:1px solid transparent;color:var(--text);padding:3px 5px;border-radius:4px;font-size:12px;}
table.datatable td input:hover,table.datatable td select:hover{border-color:var(--border);}
table.datatable td input:focus,table.datatable td select:focus,table.datatable td textarea:focus{border-color:var(--accent);outline:none;background:#0d1420;}
table.datatable td textarea{resize:vertical;min-height:30px;}
table.datatable td.num{text-align:right;}
table.datatable td.num input{text-align:right;}
table.datatable tbody tr.risk td{background:#2a1712;}
table.datatable tbody tr.risk:hover td{background:#331b15;}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;}
.tag.ok{background:#123524;color:var(--good);}
.tag.mid{background:#3a2f14;color:var(--warn);}
.tag.no{background:#22304a;color:var(--muted);}
.tag.bad{background:#3a1c18;color:var(--bad);}
th.col-resizable{position:relative;}

/* import area */
.drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px;transition:.15s;}
.drop.drag{border-color:var(--accent);background:#152036;color:var(--text);}
.import-card{display:grid;grid-template-columns:1fr;gap:8px;}
.import-log{font-size:11.5px;color:var(--muted);margin-top:8px;}
.import-log b{color:var(--text);}
.pdf-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel2);}
.pdf-item .pdf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pdf-item pre{white-space:pre-wrap;font-size:11px;max-height:200px;overflow:auto;background:var(--input-bg);padding:8px;border-radius:6px;margin-top:6px;display:none;}
.pdf-item.open pre{display:block;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.72);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:640px;width:92%;max-height:86vh;overflow:auto;}
.modal h3{margin-top:0;}
.map-row{display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-bottom:6px;}
.map-row select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

#toasts{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:fadein .15s ease-out;max-width:320px;}
.toast.err{border-color:var(--bad);}
.toast.ok{border-color:var(--good);}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

// O navegador compartilha o localStorage entre TODOS os arquivos abertos via
// file:// (mesma origem "file://"). Para uma cópia recém-baixada não herdar
// dados antigos de outra versão do app testada antes no mesmo navegador, só
// reaproveitamos o localStorage quando seu buildId bate com o desta cópia —
// caso contrário, os dados embutidos nesta cópia (sempre atuais) prevalecem.
function loadInitialState(){
  let embeddedState = null;
  try{
    const embedded = document.getElementById('embedded-state').textContent.trim();
    if(embedded && embedded !== '__EMBEDDED' + '_STATE__' && embedded.length > 10){
      const parsed = JSON.parse(embedded);
      if(parsed && Array.isArray(parsed.medicaoItems)) embeddedState = migrateState(parsed);
    }
  }catch(e){ /* ignore, fall through */ }
  let localState = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.medicaoItems)) localState = migrateState(parsed);
    }
  }catch(e){ /* ignore */ }
  if(localState && embeddedState){
    return (localState.buildId && localState.buildId === embeddedState.buildId) ? localState : embeddedState;
  }
  return embeddedState || localState || defaultState();
}
function migrateState(s){
  const d = defaultState();
  return Object.assign(d, s, {
    buildId: s.buildId || d.buildId,
    reajustePercent: s.reajustePercent!=null ? s.reajustePercent : d.reajustePercent,
    disciplinas: s.disciplinas && s.disciplinas.length ? s.disciplinas : d.disciplinas,
    bmLabels: s.bmLabels || [],
    contratoInfo: s.contratoInfo || {},
    contratos: s.contratos || [],
    filters: s.filters || {},
    columnWidths: s.columnWidths || {},
    historico: s.historico || [],
    attachments: s.attachments || [],
    supressaoOverrides: s.supressaoOverrides || {},
  });
}

/* =========================================================================
   RECÁLCULO CENTRAL
   ========================================================================= */
function recalcItem(it){
  const bmKeys = Object.keys(it.bms||{}).map(Number).filter(n=>!isNaN(n));
  it.bmsMedidos = bmKeys.sort((a,b)=>a-b);
  let qtdAc = 0, valMed = 0;
  bmKeys.forEach(k=>{ const b = it.bms[k]; qtdAc += Number(b.qtd)||0; valMed += Number(b.valor)||0; });
  it.qtdAcumulada = +qtdAc.toFixed(4);
  it.valorMedido = +valMed.toFixed(2);
  it.saldoQtd = +((it.qtdContratada||0) - it.qtdAcumulada).toFixed(4);
  it.saldoValor = +((it.totalContrato||0) - it.valorMedido).toFixed(2);
  // Regra de negócio: o aprovado nunca pode superar o medido (pode acontecer após reimportar
  // uma medição com valor menor do que o que já estava aprovado antes).
  if((it.valorAprovado||0) > it.valorMedido) it.valorAprovado = it.valorMedido;
  if((it.qtdAprovada||0) > it.qtdAcumulada) it.qtdAprovada = it.qtdAcumulada;
  if(!it._statusManual){
    it.status = it.saldoQtd <= 0.001 && it.qtdAcumulada>0 ? 'Concluído' : (it.qtdAcumulada>0 ? 'Em andamento' : 'Não iniciado');
  }
}
function recalcAll(){
  state.medicaoItems.forEach(recalcItem);
  (state.contratos||[]).forEach(recalcContrato);

  const byDisc = {};
  const ensure = (d)=> byDisc[d] || (byDisc[d] = {disciplina:d, qtdContratada:0, qtdMedida:0, valorContratado:0, valorMedido:0, valorAprovado:0, metaCusto:0, custoRealizado:0, nItens:0});
  (state.disciplinas||[]).forEach(d=>ensure(d));
  state.medicaoItems.forEach(it=>{
    const g = ensure(it.disciplina || '(sem disciplina)');
    g.qtdContratada += it.qtdContratada||0;
    g.qtdMedida += it.qtdAcumulada||0;
    g.valorContratado += it.totalContrato||0;
    g.valorMedido += it.valorMedido||0;
    g.valorAprovado += it.valorAprovado||0;
    g.nItens++;
  });
  state.custoItems.forEach(it=>{
    const g = ensure(it.disciplina || '(sem disciplina)');
    g.metaCusto += it.metaCusto||0;
    g.custoRealizado += it.custoRealizado||0;
  });
  Object.values(byDisc).forEach(g=>{
    ['qtdContratada','qtdMedida','valorContratado','valorMedido','valorAprovado','metaCusto','custoRealizado'].forEach(k=>{ g[k] = +g[k].toFixed(2); });
  });

  const curvaS = [];
  let acc = 0, accAprov=0;
  for(let b=1; b<=state.bmCount; b++){
    let val = 0, aprov=0;
    state.medicaoItems.forEach(it=>{ if(it.bms && it.bms[b]) val += Number(it.bms[b].valor)||0; if(it.statusFaturamento==='Faturado aprovado' && it.bms && it.bms[b]) aprov += Number(it.bms[b].valor)||0; });
    acc += val; accAprov += aprov;
    curvaS.push({bm:b, valor:+val.toFixed(2), acumulado:+acc.toFixed(2), aprovAcumulado:+accAprov.toFixed(2)});
  }

  const totalContrato = sumBy(state.medicaoItems,'totalContrato');
  const totalMedidoBM = sumBy(state.medicaoItems,'valorMedido');
  const totalAprovado = sumBy(state.medicaoItems,'valorAprovado');
  const qtdContratadaTotal = sumBy(state.medicaoItems,'qtdContratada');
  const qtdMedidaTotal = sumBy(state.medicaoItems,'qtdAcumulada');
  const totalMetaCusto = sumBy(state.custoItems,'metaCusto');
  const totalCustoRealizado = sumBy(state.custoItems,'custoRealizado');
  const margemTotal = totalMedidoBM - totalCustoRealizado;
  const reajustePercent = state.reajustePercent || 0;
  const totalMedidoReajustado = totalMedidoBM * (1 + reajustePercent);
  const margemReajustada = totalMedidoReajustado - totalCustoRealizado;
  // Custo real: custo de material já lançado (custoItems) menos o saldo ainda disponível
  // (não comprometido/pago) nos contratos de fornecedores — reflete o custo já efetivamente
  // consumido, descontando o que ainda resta de saldo contratual em aberto.
  const saldoContratos = sumBy(state.contratos||[], 'saldo');
  const custoReal = totalCustoRealizado - saldoContratos;
  const margemReal = totalMedidoBM - custoReal;

  const statusCounts = {'Não faturado':0,'Em aprovação':0,'Faturado aprovado':0};
  state.medicaoItems.forEach(it=>{ statusCounts[it.statusFaturamento||'Não faturado'] = (statusCounts[it.statusFaturamento||'Não faturado']||0)+1; });

  state._agg = {
    byDisc, curvaS,
    totalContrato:+totalContrato.toFixed(2), totalMedidoBM:+totalMedidoBM.toFixed(2), totalAprovado:+totalAprovado.toFixed(2),
    reajustePercent, totalMedidoReajustado:+totalMedidoReajustado.toFixed(2),
    qtdContratadaTotal:+qtdContratadaTotal.toFixed(2), qtdMedidaTotal:+qtdMedidaTotal.toFixed(2),
    totalMetaCusto:+totalMetaCusto.toFixed(2), totalCustoRealizado:+totalCustoRealizado.toFixed(2),
    saldoContratos:+saldoContratos.toFixed(2), custoReal:+custoReal.toFixed(2), margemReal:+margemReal.toFixed(2),
    margemTotal:+margemTotal.toFixed(2), margemReajustada:+margemReajustada.toFixed(2), statusCounts,
    avancoFisico: qtdContratadaTotal>0 ? qtdMedidaTotal/qtdContratadaTotal : 0,
    avancoFinanceiro: totalContrato>0 ? totalMedidoBM/totalContrato : 0,
  };
}

function supressaoRow(disc){
  const g = state._agg.byDisc[disc] || {qtdContratada:0,qtdMedida:0,valorContratado:0,valorMedido:0};
  const ov = state.supressaoOverrides[disc] || {};
  const qtdContratada = ov.qtdContratada!=null ? ov.qtdContratada : g.qtdContratada;
  const qtdMedida = ov.qtdMedida!=null ? ov.qtdMedida : g.qtdMedida;
  const valorContratado = ov.valorContratado!=null ? ov.valorContratado : g.valorContratado;
  const valorMedido = ov.valorMedido!=null ? ov.valorMedido : g.valorMedido;
  const suprimidoAuto = +(valorContratado - valorMedido).toFixed(2);
  const saldo = ov.saldo!=null ? ov.saldo : +(qtdContratada - qtdMedida).toFixed(4);
  const pct = valorContratado>0 ? valorMedido/valorContratado : 0;
  const status = ov.status || (pct>=0.999 ? 'Concluído' : pct>0 ? 'Em execução' : 'Não iniciado');
  return {disciplina:disc, qtdContratada, qtdMedida, valorContratado, valorMedido, suprimidoAuto, saldo, status, pct};
}

function getColWidth(tableId, key, def){
  const t = state.columnWidths[tableId];

function renderTable(tableId, columns, rows, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');
  table.className = 'datatable';
  table.dataset.tableId = tableId;

  const colgroup = document.createElement('colgroup');
  columns.forEach(c=>{
    const col = document.createElement('col');
    col.style.width = getColWidth(tableId, c.key, c.width||120)+'px';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach((c,ci)=>{
    const th = document.createElement('th');
    th.className = 'col-resizable';
    th.style.position='relative';
    th.textContent = c.label;
    const rez = document.createElement('span');
    rez.className = 'resizer';
    th.appendChild(rez);
    let startX, startW;
    rez.addEventListener('mousedown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      startX = e.clientX;
      startW = colgroup.children[ci].getBoundingClientRect().width;
      function onMove(ev){
        const w = Math.max(50, startW + (ev.clientX - startX));
        colgroup.children[ci].style.width = w+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        setColWidth(tableId, c.key, parseInt(colgroup.children[ci].style.width,10));
        saveLocalDebounced();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(row=>{
    const tr = document.createElement('tr');
    if(opts.rowClass) tr.className = opts.rowClass(row) || '';
    tr.dataset.rowId = row.id;
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.wrap) td.className = 'wrap';
      if(c.align==='num') td.classList.add('num');
      if(c.render){
        td.innerHTML = c.render(row);
      } else if(c.editable){
        if(c.type==='number' || c.align==='num') td.classList.add('num');
        if(c.type === 'select'){
          const sel = document.createElement('select');
          sel.dataset.key = c.key;
          (c.options||[]).forEach(optV=>{
            const o = document.createElement('option');
            o.value = optV; o.textContent = optV;
            if((row[c.key]||'') === optV) o.selected = true;
            sel.appendChild(o);
          });
          td.appendChild(sel);
        } else if(c.type === 'textarea'){
          const ta = document.createElement('textarea');
          ta.dataset.key = c.key;
          ta.value = row[c.key]||'';
          ta.rows = 2;
          td.appendChild(ta);
        } else {
          const inp = document.createElement('input');
          inp.type = c.type==='number' ? 'text' : 'text';
          inp.dataset.key = c.key;
          inp.value = c.type==='number' ? fmtNum(row[c.key], c.dec??2) : (row[c.key]??'');
          if(c.type==='number') inp.dataset.numeric = '1';
          td.appendChild(inp);
        }
      } else {
        let v = row[c.key];
        if(c.type==='number') v = fmtNum(v, c.dec??2);
        if(c.type==='money') v = fmtMoney(v);
        td.textContent = v ?? '';
        if(c.type==='money'||c.type==='number') td.classList.add('num');
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  if(opts.onChange){
    tbody.addEventListener('change', (e)=>{
      const key = e.target.dataset.key;
      if(!key) return;
      const tr = e.target.closest('tr');
      const rowId = tr.dataset.rowId;
      const row = rows.find(r=>String(r.id)===String(rowId));
      if(!row) return;
      let val = e.target.value;
      if(e.target.dataset.numeric) val = parseNumInput(val);
      opts.onChange(row, key, val, e.target);
    });
  }
  return wrap;
}

function makeSelectField(label, val, options, onChange){
  // options: array of plain strings, or [value,label] pairs (e.g. BM number + mês/ano).
  const wrap = document.createElement('label');
  const span = document.createElement('span'); span.textContent = label;
  const sel = document.createElement('select');
  options.forEach(o=>{
    const [v,l] = Array.isArray(o) ? o : [o,o];
    const op = document.createElement('option');
    op.value = v; op.textContent = v===''?'Todos':l;
    if(v===val) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener('change', ()=>onChange(sel.value));
  wrap.appendChild(span); wrap.appendChild(sel);
  return wrap;
}
function applyFilters(items, tabKey, opts){
  const f = getFilterState(tabKey);
  return items.filter(it=>{
    if(f.disciplina && it.disciplina !== f.disciplina) return false;
    if(f.grupo && it.grupo !== f.grupo) return false;
    if(f.status && (opts.statusField ? it[opts.statusField] : it.status) !== f.status) return false;
    if(f.bm && !(it.bmsMedidos||[]).includes(Number(f.bm))) return false;
    if(f.search){
      const s = normStr(f.search);
      const hay = normStr((it.item||'')+' '+(it.descricao||'')+' '+(it.disciplina||''));
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderBulkBar(tabKey, fieldOptions, getFilteredRows, onApplied){
  const bar = document.createElement('div');
  bar.className = 'bulkbar';
  bar.innerHTML = `<b>Ação em massa:</b>`;
  const fieldSel = document.createElement('select');
  fieldOptions.forEach(f=>{ const o=document.createElement('option'); o.value=f.key; o.textContent=f.label; fieldSel.appendChild(o); });
  const opSel = document.createElement('select');
  [['add','Somar'],['sub','Subtrair'],['set','Definir valor']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; opSel.appendChild(o); });
  const valInp = document.createElement('input'); valInp.type='number'; valInp.step='0.01'; valInp.placeholder='valor';
  const applyBtn = document.createElement('button'); applyBtn.className='btn primary sm'; applyBtn.textContent='Aplicar aos itens filtrados';
  applyBtn.onclick = ()=>{
    const rows = getFilteredRows();
    if(!rows.length){ toast('Nenhum item filtrado para aplicar.', 'err'); return; }
    const delta = parseNumInput(valInp.value);
    if(!delta && opSel.value!=='set'){ toast('Informe um valor.', 'err'); return; }
    const field = fieldSel.value;
    const label = fieldOptions.find(f=>f.key===field).label;
    let count=0, totalBefore=0, totalAfter=0;
    rows.forEach(r=>{
      const before = Number(r[field])||0;
      totalBefore += before;
      let after = before;
      if(opSel.value==='add') after = before + delta;
      else if(opSel.value==='sub') after = before - delta;
      else after = delta;
      after = +after.toFixed(2);
      r[field] = after;
      totalAfter += after;
      count++;
      if(onApplied) onApplied(r, field, before, after);
    });
    logHist('massa', `Ação em massa em "${label}" (${tabKey}): ${count} itens, total ${fmtMoney(totalBefore)} → ${fmtMoney(totalAfter)}.`);
    recalcAll(); saveLocalDebounced(); renderApp();
    toast(`Aplicado a ${count} itens.`, 'ok');
  };
  bar.appendChild(fieldSel); bar.appendChild(opSel); bar.appendChild(valInp); bar.appendChild(applyBtn);
  return bar;
}

  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(1)+'M';

  return String(Math.round(n));
}

function positionVizTooltip(evt){
  const tt = document.getElementById('vizTooltip');
  const x = Math.min(evt.clientX, window.innerWidth-16);
  tt.style.left = x + 'px';
  tt.style.top = Math.max(70, evt.clientY - 12) + 'px';
}
function hideVizTooltip(){ document.getElementById('vizTooltip').classList.remove('show'); }

function fillLegend(el, items){
  el.innerHTML='';
  items.forEach(it=>{
    const d = document.createElement('div'); d.className='lg-item';
    const sw = document.createElement('span'); sw.className = it.shape==='line' ? 'lg-line' : 'lg-swatch';
    sw.style.background = it.color;
    d.appendChild(sw);
    const lbl = document.createElement('span'); lbl.textContent = it.label;
    d.appendChild(lbl);
    el.appendChild(d);
  });
}

function simpleTable(columns, rows){
  const wrap = document.createElement('div'); wrap.style.overflow='auto'; wrap.style.maxHeight='320px';
  const table = document.createElement('table'); table.className='viz-table';
  const thead = document.createElement('thead'); const trh = document.createElement('tr');
  columns.forEach(c=>{ const th=document.createElement('th'); th.textContent=c.label; if(c.align==='num') th.style.textAlign='right'; trh.appendChild(th); });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.align==='num') td.className='num';
      td.textContent = c.format ? c.format(r) : (r[c.key] ?? '');
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

// Card chrome: title + optional subtitle + "table view" toggle + legend slot.
function vizCard(title, sub){
  const card = document.createElement('div'); card.className='viz-card';
  const head = document.createElement('div'); head.className='viz-head';
  const titleWrap = document.createElement('div');
  const h4 = document.createElement('h4'); h4.textContent = title; titleWrap.appendChild(h4);
  if(sub){ const s=document.createElement('div'); s.className='viz-sub'; s.textContent=sub; titleWrap.appendChild(s); }
  head.appendChild(titleWrap);
  const btn = document.createElement('button'); btn.className='viz-tblbtn'; btn.textContent='▤ Tabela'; btn.type='button';
  head.appendChild(btn);
  card.appendChild(head);
  const body = document.createElement('div');
  card.appendChild(body);
  const legend = document.createElement('div'); legend.className='viz-legend';
  card.appendChild(legend);
  let showingTable = false, chartNode = null, tableNode = null;
  btn.onclick = ()=>{
    if(!tableNode) return;
    showingTable = !showingTable;
    btn.textContent = showingTable ? '📈 Gráfico' : '▤ Tabela';
    legend.style.display = showingTable ? 'none' : '';
    body.innerHTML = '';
    body.appendChild(showingTable ? tableNode : chartNode);
  };
  return {
    card, legend,
    setChart(node){ chartNode = node; if(!showingTable){ body.innerHTML=''; body.appendChild(node); } },
    setTable(node){ tableNode = node; },
  };
}

function sparklineSVG(data, color){
  const svgNS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg'); svg.setAttribute('class','stat-spark');
  const w=100,h=26,pad=2;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('preserveAspectRatio','none');
  const max = Math.max(...data,0.0001), min = Math.min(...data,0);
  const range = (max-min)||1;
  const n = data.length;
  const xAt = i => pad + (w-2*pad)*(n>1?i/(n-1):0);
  const yAt = v => h-pad - (h-2*pad)*((v-min)/range);
  const pts = data.map((v,i)=>`${xAt(i)},${yAt(v)}`).join(' ');
  const muted = document.createElementNS(svgNS,'polyline');
  muted.setAttribute('points', pts); muted.setAttribute('fill','none');
  muted.setAttribute('stroke','var(--muted2)'); muted.setAttribute('stroke-width','1.4');
  muted.setAttribute('stroke-linejoin','round'); muted.setAttribute('stroke-linecap','round');
  svg.appendChild(muted);
  if(n>=2){
    const last = document.createElementNS(svgNS,'polyline');
    last.setAttribute('points', `${xAt(n-2)},${yAt(data[n-2])} ${xAt(n-1)},${yAt(data[n-1])}`);
    last.setAttribute('fill','none'); last.setAttribute('stroke', color||'var(--viz-1)'); last.setAttribute('stroke-width','1.8');
    last.setAttribute('stroke-linecap','round');
    svg.appendChild(last);
    const dot = document.createElementNS(svgNS,'circle');
    dot.setAttribute('cx',xAt(n-1)); dot.setAttribute('cy',yAt(data[n-1])); dot.setAttribute('r','2.4');
    dot.setAttribute('fill', color||'var(--viz-1)');
    svg.appendChild(dot);
  }
  return svg;
}

function statTile({label, value, delta, deltaLabel, deltaGood, spark, sparkColor, valueClass, sub}){
  const el = document.createElement('div'); el.className='stat-tile';
  const l = document.createElement('div'); l.className='stat-label'; l.textContent = label; el.appendChild(l);
  const v = document.createElement('div'); v.className='stat-value'+(valueClass?(' '+valueClass):''); v.textContent = value; el.appendChild(v);
  if(delta!=null && isFinite(delta)){
    const isUp = delta>=0;
    const good = deltaGood==null ? true : (deltaGood ? isUp : !isUp);
    const d = document.createElement('div'); d.className='stat-delta '+(good?'good':'bad');
    d.textContent = (isUp?'▲ ':'▼ ')+fmtPct(Math.abs(delta));
    if(deltaLabel){ const dsub=document.createElement('span'); dsub.className='stat-delta-sub'; dsub.textContent=' '+deltaLabel; d.appendChild(dsub); }
    el.appendChild(d);
  } else if(sub){
    const s = document.createElement('div'); s.className='stat-sub'; s.textContent = sub; el.appendChild(s);
  }
  if(spark && spark.length>=2){ el.appendChild(sparklineSVG(spark, sparkColor)); }
  return el;
}

function meterEl({label, value, max, formatValue, colorFn, refValue, refLabel}){
  const pct = max>0 ? value/max : 0;
  const pctClamped = Math.max(0, Math.min(1, pct));
  const color = colorFn ? colorFn(pct) : 'var(--viz-1)';
  const el = document.createElement('div'); el.className='meter';
  const head = document.createElement('div'); head.className='meter-head';
  const l = document.createElement('span'); l.className='stat-label'; l.textContent = label;
  const v = document.createElement('span'); v.className='meter-value'; v.textContent = formatValue ? formatValue(value,max,pct) : fmtPct(pct);
  head.appendChild(l); head.appendChild(v); el.appendChild(head);
  const track = document.createElement('div'); track.className='meter-track';
  const fill = document.createElement('div'); fill.className='meter-fill';
  fill.style.width = (pctClamped*100).toFixed(1)+'%'; fill.style.background = color;
  track.appendChild(fill);
  if(refValue!=null && max>0){
    const ref = document.createElement('div'); ref.className='meter-ref';
    ref.style.left = (Math.max(0,Math.min(1,refValue/max))*100).toFixed(1)+'%';
    ref.title = refLabel||'';
    track.appendChild(ref);
  }
  el.appendChild(track);
  return el;
}

function budgetStatusColor(pct){
  if(pct>1) return 'var(--viz-critical)';
  if(pct>=0.8) return 'var(--viz-warning)';
  return 'var(--viz-good)';
}

// Horizontal bar chart — 1 or 2 series (grouped, thin, shared baseline), long labels friendly.
function hBarChart({rows, seriesKeys, seriesNames, seriesColors, formatValue, colorFn}){
  const wrap = document.createElement('div'); wrap.className='hbar-chart';
  const max = Math.max(1e-9, ...rows.flatMap(r=>seriesKeys.map(k=>Math.abs(r[k]||0))));
  rows.forEach(row=>{
    const rEl = document.createElement('div'); rEl.className='hbar-row';
    const label = document.createElement('div'); label.className='hbar-label'; label.textContent = row.label; label.title = row.label;
    const tracksWrap = document.createElement('div'); tracksWrap.className='hbar-tracks';
    seriesKeys.forEach((k,si)=>{
      const track = document.createElement('div'); track.className='hbar-track';
      const fill = document.createElement('div'); fill.className='hbar-fill';
      const pct = Math.max(0, Math.min(1, (row[k]||0)/max));
      fill.style.width = (pct*100).toFixed(2)+'%';
      fill.style.background = colorFn ? colorFn(row, si) : seriesColors[si%seriesColors.length];
      fill.addEventListener('pointerenter', (e)=>{
        showVizTooltip(e, row.label, seriesKeys.map((kk,ii)=>({name:seriesNames[ii], value:formatValue(row[kk]||0), color: colorFn?colorFn(row,ii):seriesColors[ii%seriesColors.length]})));
      });
      fill.addEventListener('pointermove', positionVizTooltip);
      fill.addEventListener('pointerleave', hideVizTooltip);
      track.appendChild(fill);
      tracksWrap.appendChild(track);
    });
    const valEl = document.createElement('div'); valEl.className='hbar-val';
    valEl.textContent = seriesKeys.map(k=>formatValue(row[k]||0)).join(' / ');
    rEl.appendChild(label); rEl.appendChild(tracksWrap); rEl.appendChild(valEl);
    wrap.appendChild(rEl);
  });
  return wrap;
}

// Diverging horizontal bar chart, centered on a zero baseline (e.g. margem).
function divergingBarChart({rows, formatValue}){
  const wrap = document.createElement('div'); wrap.className='hbar-chart';
  const maxAbs = Math.max(1e-9, ...rows.map(r=>Math.abs(r.value)));
  rows.forEach(row=>{
    const rEl = document.createElement('div'); rEl.className='dbar-row';
    const label = document.createElement('div'); label.className='dbar-label'; label.textContent = row.label; label.title = row.label;
    const track = document.createElement('div'); track.className='dbar-track';
    const mid = document.createElement('div'); mid.className='dbar-mid'; track.appendChild(mid);
    const fill = document.createElement('div'); fill.className='dbar-fill';
    const pct = Math.min(1, Math.abs(row.value)/maxAbs) * 50;
    const color = row.value>=0 ? 'var(--viz-1)' : 'var(--viz-critical)';
    if(row.value>=0){ fill.style.left='50%'; fill.style.width=pct+'%'; } else { fill.style.left=(50-pct)+'%'; fill.style.width=pct+'%'; }
    fill.style.background = color;
    fill.addEventListener('pointerenter', (e)=>showVizTooltip(e, row.label, [{name:'Margem', value:formatValue(row.value), color}]));
    fill.addEventListener('pointermove', positionVizTooltip);
    fill.addEventListener('pointerleave', hideVizTooltip);
    track.appendChild(fill);
    const valEl = document.createElement('div'); valEl.className='dbar-val'; valEl.style.color = row.value>=0?'var(--viz-good)':'var(--viz-critical)';
    valEl.textContent = formatValue(row.value);
    rEl.appendChild(label); rEl.appendChild(track); rEl.appendChild(valEl);
    wrap.appendChild(rEl);
  });
  return wrap;
}

// Single stacked horizontal bar for part-to-whole (≤ ~6 segments).
function stackedBarChart({segments, formatValue}){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const track = document.createElement('div'); track.className='sbar-track';
  segments.forEach(seg=>{
    const pct = (seg.value/total)*100;
    if(pct<=0) return;
    const el = document.createElement('div'); el.className='sbar-seg';
    el.style.width = pct.toFixed(2)+'%'; el.style.background = seg.color;
    el.addEventListener('pointerenter', (e)=>showVizTooltip(e, seg.label, [{name:'Itens', value:formatValue(seg.value), color:seg.color}]));
    el.addEventListener('pointermove', positionVizTooltip);
    el.addEventListener('pointerleave', hideVizTooltip);
    track.appendChild(el);
  });
  return track;
}

// Multi-series line chart with hairline gridlines, crosshair+tooltip, end markers, reference line.
function lineChartSVG({labels, series, refLine, formatValue, height}){
  height = height || 220;
  const width = 640, padL=48, padR=14, padT=14, padB=24;
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const allVals = series.flatMap(s=>s.data).concat(refLine?[refLine.value]:[], [0]);
  const maxV = Math.max(1, ...allVals);
  const n = labels.length;
  const xAt = i => padL + (n>1 ? plotW*(i/(n-1)) : plotW/2);
  const yAt = v => padT + plotH - plotH*(v/maxV);
  const svgNS = 'http://www.w3.org/2000/svg';

  const wrap = document.createElement('div'); wrap.className='viz-line-wrap';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.style.height = height+'px';

  for(let g=0; g<=4; g++){
    const v = maxV*g/4, y = yAt(v);
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',width-padR); line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke','var(--viz-grid)'); line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    const txt = document.createElementNS(svgNS,'text');
    txt.setAttribute('x',padL-6); txt.setAttribute('y',y+3); txt.setAttribute('text-anchor','end');
    txt.setAttribute('font-size','9.5'); txt.setAttribute('fill','var(--muted2)');
    txt.textContent = fmtCompact(v);
    svg.appendChild(txt);
  }
  if(refLine){
    const y = yAt(refLine.value);
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',width-padR); line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke','var(--viz-axis)'); line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    const txt = document.createElementNS(svgNS,'text');
    txt.setAttribute('x', padL+4); txt.setAttribute('y', y-5); txt.setAttribute('text-anchor','start');
    txt.setAttribute('font-size','9.5'); txt.setAttribute('fill','var(--muted2)');
    txt.textContent = refLine.label;
    svg.appendChild(txt);
  }
  const tickIdx = new Set();
  if(n<=9){ for(let i=0;i<n;i++) tickIdx.add(i); }
  else {
    const step = Math.max(1, Math.ceil(n/8));
    for(let i=0;i<n;i+=step) tickIdx.add(i);
    tickIdx.add(n-1);
    const sorted = [...tickIdx].sort((x,y)=>x-y);
    if(sorted.length>=2 && (sorted[sorted.length-1]-sorted[sorted.length-2]) < step*0.6){
      tickIdx.delete(sorted[sorted.length-2]);
    }
  }
  labels.forEach((l,i)=>{
    if(!tickIdx.has(i)) return;
    const txt = document.createElementNS(svgNS,'text');
    txt.setAttribute('x', xAt(i)); txt.setAttribute('y', height-7); txt.setAttribute('text-anchor', i===n-1?'end':(i===0?'start':'middle'));
    txt.setAttribute('font-size','9.5'); txt.setAttribute('fill','var(--muted2)');
    txt.textContent = l;
    svg.appendChild(txt);
  });
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>`${xAt(i)},${yAt(v)}`).join(' ');
    const poly = document.createElementNS(svgNS,'polyline');
    poly.setAttribute('points', pts);
    poly.setAttribute('fill','none'); poly.setAttribute('stroke', s.color); poly.setAttribute('stroke-width','2');
    poly.setAttribute('stroke-linejoin','round'); poly.setAttribute('stroke-linecap','round');
    svg.appendChild(poly);
    const lastI = n-1, cx=xAt(lastI), cy=yAt(s.data[lastI]);
    const dot = document.createElementNS(svgNS,'circle');
    dot.setAttribute('cx',cx); dot.setAttribute('cy',cy); dot.setAttribute('r','4');
    dot.setAttribute('fill', s.color); dot.setAttribute('stroke','var(--panel2)'); dot.setAttribute('stroke-width','2');
    svg.appendChild(dot);
  });
  const crosshair = document.createElementNS(svgNS,'line');
  crosshair.setAttribute('class','viz-crosshair');
  crosshair.setAttribute('y1',padT); crosshair.setAttribute('y2',height-padB);
  svg.appendChild(crosshair);
  const hit = document.createElementNS(svgNS,'rect');
  hit.setAttribute('x',padL); hit.setAttribute('y',padT); hit.setAttribute('width',Math.max(1,plotW)); hit.setAttribute('height',Math.max(1,plotH));
  hit.setAttribute('fill','transparent');
  svg.appendChild(hit);
  hit.addEventListener('pointermove', (e)=>{
    const rect = svg.getBoundingClientRect();
    const scaleX = width/rect.width;
    const localX = (e.clientX-rect.left)*scaleX;
    let idx = Math.round(((localX-padL)/plotW)*(n-1));
    idx = Math.max(0, Math.min(n-1,idx));
    const cx = xAt(idx);
    crosshair.setAttribute('x1',cx); crosshair.setAttribute('x2',cx);
    crosshair.style.opacity='1';
    showVizTooltip(e, labels[idx], series.map(s=>({name:s.name, value:formatValue(s.data[idx]), color:s.color})));
  });
  hit.addEventListener('pointerleave', ()=>{ crosshair.style.opacity='0'; hideVizTooltip(); });
  wrap.appendChild(svg);
  return wrap;
}

// Barra de ação em massa dedicada para alterar o status de faturamento (não é numérica, por isso não reaproveita renderBulkBar).
function renderStatusBulkBar(tabKey, getFilteredRows){
  const bar = document.createElement('div'); bar.className='bulkbar';
  const label = document.createElement('b'); label.textContent = 'Status em massa:'; bar.appendChild(label);
  const sel = document.createElement('select');
  ['Não faturado','Em aprovação','Faturado aprovado'].forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
  bar.appendChild(sel);
  const autoWrap = document.createElement('label');
  autoWrap.style.cssText='display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);';
  const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=true;
  autoWrap.appendChild(chk);
  autoWrap.appendChild(document.createTextNode('preencher qtd./valor aprovado ao definir "Faturado aprovado"'));
  bar.appendChild(autoWrap);
  const btn = document.createElement('button'); btn.className='btn primary sm'; btn.textContent='Aplicar aos itens filtrados';
  btn.onclick = ()=>{
    const rows = getFilteredRows();
    if(!rows.length){ toast('Nenhum item filtrado para aplicar.', 'err'); return; }
    const target = sel.value;
    let count = 0;
    rows.forEach(r=>{
      const before = r.statusFaturamento;
      if(before !== target){
        r.statusFaturamento = target;
        logDeviation(r, 'Status de faturamento', before, target);
        count++;
      }
      if(target === 'Faturado aprovado' && chk.checked){
        const beforeQ = r.qtdAprovada, beforeV = r.valorAprovado;
        r.qtdAprovada = r.qtdAcumulada; r.valorAprovado = r.valorMedido;
        logDeviation(r, 'Qtd. aprovada', beforeQ, r.qtdAprovada);
        logDeviation(r, 'Valor aprovado', beforeV, r.valorAprovado);
      }
    });
    logHist('massa', `Status de faturamento definido em massa para "${target}" (${tabKey}): ${count} itens alterados.`);
    recalcAll(); saveLocalDebounced(); renderApp();
    toast(`Status atualizado em ${count} itens.`, 'ok');
  };
  bar.appendChild(btn);
  return bar;
}

// Folds a sorted-desc list of {label,...} rows to the top N, summing the rest into "Outras".
function foldTopN(rows, n, valueKeys){
  if(rows.length<=n) return rows;
  const head = rows.slice(0,n);
  const tail = rows.slice(n);
  const other = {label:'Outras ('+tail.length+')'};
  valueKeys.forEach(k=>{ other[k] = tail.reduce((s,r)=>s+(r[k]||0),0); });
  return [...head, other];
}

      {key:'unidade', label:'Un.', width:50},
      {key:'qtdContratada', label:'Qtd. contratada', type:'number', width:110, align:'num'},
      {key:'valorUnitario', label:'Valor unit.', type:'money', width:100, align:'num'},
      {key:'totalContrato', label:'Total contrato', type:'money', width:120, align:'num'},
      {key:'_bmQtd', label:`Qtd. medição (${bmLabel(activeBm)})`, width:150, render:(r)=>{
        const v = (r.bms&&r.bms[activeBm]) ? r.bms[activeBm].qtd : '';
        return `<input type="text" data-key="_bmQtd" value="${v===''?'':fmtNum(v)}" data-numeric="1">`;
      }},
      {key:'_bmVal', label:`Valor medição (${bmLabel(activeBm)})`, width:150, render:(r)=>{
        const v = (r.bms&&r.bms[activeBm]) ? r.bms[activeBm].valor : '';
        return `<input type="text" data-key="_bmVal" value="${v===''?'':fmtNum(v)}" data-numeric="1">`;
      }},
      {key:'qtdAcumulada', label:'Qtd. acumulada', type:'number', width:110, align:'num'},
      {key:'valorMedido', label:'Valor medido', type:'money', width:110, align:'num'},
      {key:'qtdAprovada', label:'Qtd. aprovada', type:'number', editable:true, width:110, align:'num'},
      {key:'valorAprovado', label:'Valor aprovado', type:'number', editable:true, width:120, align:'num'},
      {key:'statusFaturamento', label:'Status faturamento', editable:true, type:'select', options:['Não faturado','Em aprovação','Faturado aprovado'], width:150},
      {key:'saldoQtd', label:'Saldo qtd.', type:'number', width:100, align:'num'},
      {key:'saldoValor', label:'Saldo valor', type:'money', width:110, align:'num'},
      {key:'status', label:'Status', width:110, render:(r)=>statusTag(r.status)},
      {key:'_acoes', label:'Ações', width:90, render:(r)=>`<button class="btn sm good" data-act="aprovar">Aprovar</button>`},
    ];
    tableHolder.innerHTML = '';
    const tbl = renderTable('lancarBM', cols, filtered, {
      rowClass:(r)=> r.valorMedido> (r.totalContrato||0) ? 'risk' : '',
      onChange:(row,key,val)=>{
        if(key==='_bmQtd' || key==='_bmVal'){
          if(!row.bms) row.bms={};
          const cur = row.bms[activeBm] || {qtd:0,valor:0};
          if(key==='_bmQtd'){
            cur.qtd = val;
            if(!row._bmValManual || row._bmValManual!==activeBm) cur.valor = +(val*(row.valorUnitario||0)).toFixed(2);
          } else {
            cur.valor = val; row._bmValManual = activeBm;
          }
          if(cur.qtd===0 && cur.valor===0) delete row.bms[activeBm]; else row.bms[activeBm]=cur;
          recalcItem(row);
        } else if(key==='qtdAprovada'){
          logDeviation(row, 'Qtd. aprovada', row.qtdAprovada, val);
          row.qtdAprovada = val;
        } else if(key==='valorAprovado'){
          logDeviation(row, 'Valor aprovado', row.valorAprovado, val);
          row.valorAprovado = val;
        } else if(key==='statusFaturamento'){
          logDeviation(row, 'Status de faturamento', row.statusFaturamento, val);
          row.statusFaturamento = val;
        }
        recalcAll(); saveLocalDebounced(); renderKpiStrip();
        const f2 = getFiltered();
        document.getElementById('filterCount_lancarbm').textContent = f2.length + ' de ' + state.medicaoItems.length + ' itens';
        drawTotals(f2);
      }
    });
    tbl.querySelector('tbody').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-act=aprovar]');
      if(!btn) return;
      const tr = e.target.closest('tr');
      const row = filtered.find(r=>String(r.id)===tr.dataset.rowId);
      const beforeQ = row.qtdAprovada, beforeV = row.valorAprovado, beforeS = row.statusFaturamento;
      row.qtdAprovada = row.qtdAcumulada;
      row.valorAprovado = row.valorMedido;
      row.statusFaturamento = 'Faturado aprovado';
      logDeviation(row, 'Qtd. aprovada', beforeQ, row.qtdAprovada);
      logDeviation(row, 'Valor aprovado', beforeV, row.valorAprovado);
      logDeviation(row, 'Status de faturamento', beforeS, row.statusFaturamento);
      recalcAll(); saveLocalDebounced(); draw(); renderKpiStrip();
      toast(`Item ${row.item} aprovado.`, 'ok');
    });
    tableHolder.appendChild(tbl);
  }
  draw();

  setTimeout(()=>{
    document.getElementById('activeBmSel').addEventListener('change', (e)=>{ state.activeBm = Number(e.target.value); saveLocalDebounced(); draw(); });
    document.getElementById('bmLabelInput').addEventListener('change', (e)=>{
      state.bmLabels[state.activeBm-1] = e.target.value.trim();
      saveLocalDebounced(); draw();
    });
    document.getElementById('addBmBtn').addEventListener('click', ()=>{
      state.bmCount++;
      state.activeBm = state.bmCount;
      logHist('sistema', `Nova BM criada: BM ${state.bmCount}.`);
      saveLocalDebounced(); renderApp();
      toast(`BM ${state.bmCount} criada.`, 'ok');
    });
    document.getElementById('lbm_export').addEventListener('click', exportMedicaoExcel);
    document.getElementById('reajusteInput').addEventListener('change', (e)=>{
      const pct = parseNumInput(e.target.value);
      state.reajustePercent = +(pct/100).toFixed(6);
      logHist('sistema', `Reajuste contratual atualizado para ${fmtNum(pct)}%.`);
      recalcAll(); saveLocalDebounced(); renderKpiStrip();
      toast(`Reajuste contratual definido em ${fmtNum(pct)}%.`, 'ok');
    });
  },0);
}

function statusTag(s){
  const map = {'Concluído':'ok','Em andamento':'mid','Não iniciado':'no'};
  return `<span class="tag ${map[s]||'no'}">${s}</span>`;
}

function renderSupressao(main){
  const p = document.createElement('div'); p.className='panel';
  p.innerHTML = `<h2>Controle de Supressão${infoIcon('Preenchido a partir da planilha de MEDIÇÃO. Total do contrato = coluna TOTAL da medição. Medido BM = soma dos valores medidos em cada BM. Suprimido automático = total do contrato − medido BM. Todos os valores continuam editáveis manualmente (a alteração manual sobrepõe o cálculo automático até ser limpa).')}</h2>`;
  main.appendChild(p);

  const p2 = document.createElement('div'); p2.className='panel';
  const filterHolder = document.createElement('div'); p2.appendChild(filterHolder);
  const tableHolder = document.createElement('div'); p2.appendChild(tableHolder);

  function getRows(){
    return state.disciplinas.map((d,i)=>Object.assign({id:i}, supressaoRow(d)));
  }
  function getFiltered(){
    const f = getFilterState('supressao');
    return getRows().filter(r=>{
      if(f.disciplina && r.disciplina!==f.disciplina) return false;
      if(f.status && r.status!==f.status) return false;

      return true;
    });

    const cols = [
      {key:'disciplina', label:'Disciplina', width:170, wrap:true},
      {key:'qtdContratada', label:'Qtd. contratada', type:'number', editable:true, width:120, align:'num'},

      {key:'valorMedido', label:'Valor medido', type:'number', editable:true, width:120, align:'num'},

      {key:'saldo', label:'Saldo', type:'number', editable:true, width:110, align:'num'},
      {key:'status', label:'Status', editable:true, type:'select', options:['Não iniciado','Em execução','Concluído'], width:130},
    ];
    tableHolder.innerHTML='';
    tableHolder.appendChild(renderTable('supressao', cols, filtered, {
      onChange:(row,key,val)=>{
        const disc = row.disciplina;
        if(!state.supressaoOverrides[disc]) state.supressaoOverrides[disc]={};

function renderFisicoAnalise(main){
  const a = state._agg;

  main.appendChild(p);

  const p2 = document.createElement('div'); p2.className='panel';
  const filterHolder = document.createElement('div'); p2.appendChild(filterHolder);
  const tableHolder = document.createElement('div'); p2.appendChild(tableHolder);
  main.appendChild(p2);

  function getRows(){
    return Object.values(a.byDisc).filter(d=>d.metaCusto>0||d.custoRealizado>0||d.valorContratado>0).map((d,i)=>{
      const margem = +(d.valorMedido - d.custoRealizado).toFixed(2);
      return Object.assign({id:i, margem, risco: margem<0}, d);
    });
  }
  function draw(){
    const rows = getRows();
    const f = getFilterState('fisicoAnalise');
    const filtered = rows.filter(r=>{
      if(f.disciplina && r.disciplina!==f.disciplina) return false;
      if(f.status==='Risco' && !r.risco) return false;
      if(f.status==='OK' && r.risco) return false;
      if(f.search && !normStr(r.disciplina).includes(normStr(f.search))) return false;
      return true;
    });
    filterHolder.innerHTML='';
    filterHolder.appendChild(renderFilterBar('fisicoAnalise', {disciplina:true, status:true, statusOptions:['Risco','OK']}, draw));
    document.getElementById('filterCount_fisicoAnalise').textContent = filtered.length + ' disciplinas';

    const cols = [
      {key:'disciplina', label:'Disciplina', width:170, wrap:true},
      {key:'metaCusto', label:'Meta de custo', type:'money', width:120, align:'num'},
      {key:'custoRealizado', label:'Custo realizado', type:'money', width:130, align:'num'},
      {key:'valorMedido', label:'Faturamento BM', type:'money', width:130, align:'num'},
      {key:'margem', label:'Margem', width:120, align:'num', render:(r)=>`<span class="${r.margem<0?'tag bad':'tag ok'}">${fmtMoney(r.margem)}</span>`},
      {key:'risco', label:'Risco', width:90, render:(r)=> r.risco ? '<span class="tag bad">⚠ Risco</span>' : '<span class="tag ok">OK</span>'},
    ];
    tableHolder.innerHTML='';
    tableHolder.appendChild(renderTable('fisicoAnalise', cols, filtered, {rowClass:(r)=>r.risco?'risk':''}));
  }
  draw();
}

function fmtDateBR(iso){
  if(!iso) return '—';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}
function recalcContrato(c){
  const valorAditivos = (c.aditivos||[]).reduce((s,a)=>s+(Number(a.valor)||0),0);
  c.valorTotal = +(((Number(c.valorOriginal)||0)) + valorAditivos).toFixed(2);
  const meds = c.medicoes||[];
  c.valorMedidoTotal = +meds.reduce((s,m)=>s+(Number(m.valor)||0),0).toFixed(2);
  c.valorAprovado = +meds.filter(m=>m.status==='Aprovado').reduce((s,m)=>s+(Number(m.valor)||0),0).toFixed(2);
  c.saldo = +(c.valorTotal - c.valorAprovado).toFixed(2);
  c.pctExecutado = c.valorTotal>0 ? c.valorAprovado/c.valorTotal : 0;
}
function contratoAgg(){
  const list = state.contratos||[];
  const totalContratado = list.reduce((s,c)=>s+(c.valorTotal||0),0);
  const totalAprovado = list.reduce((s,c)=>s+(c.valorAprovado||0),0);
  const totalMedido = list.reduce((s,c)=>s+(c.valorMedidoTotal||0),0);
  const saldoTotal = list.reduce((s,c)=>s+(c.saldo||0),0);
  const ativos = list.filter(c=>c.status==='ativo').length;
  const now = Date.now(), in30 = now + 30*86400000;
  let vencendo=0, vencidos=0;
  list.forEach(c=>{
    if(c.status!=='ativo' || !c.vigenciaFim) return;
    const fim = new Date(c.vigenciaFim+'T00:00:00').getTime();
    if(isNaN(fim)) return;
    if(fim < now) vencidos++; else if(fim <= in30) vencendo++;
  });
  return {totalContratado, totalAprovado, totalMedido, saldoTotal, ativos, total:list.length, vencendo, vencidos};
}
function contratoStatusInfo(c){
  if(c.status==='encerrado') return {label:'Encerrado', cls:'contract-encerrado'};
  if(c.status==='suspenso') return {label:'Suspenso', cls:'contract-suspenso'};
  if(c.vigenciaFim){
    const fim = new Date(c.vigenciaFim+'T00:00:00').getTime();
    const now = Date.now();
    if(!isNaN(fim)){
      if(fim < now) return {label:'Vencido', cls:'contract-vencendo'};
      if(fim - now <= 30*86400000) return {label:'Vence em breve', cls:'contract-vencendo'};
    }
  }
  return {label:'Ativo', cls:'contract-ativo'};
}
function extractPdfText(file){
  return new Promise((resolve, reject)=>{
    if(typeof pdfjsLib === 'undefined'){ reject(new Error('PDF.js ainda carregando ou indisponível offline.')); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const pdf = await pdfjsLib.getDocument({data: e.target.result}).promise;
        let text = '';
        for(let p=1; p<=pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          text += content.items.map(it=>it.str).join(' ') + '\n\n';
        }
        resolve({text, pages: pdf.numPages});
      }catch(err){ reject(err); }
    };
    reader.onerror = ()=>reject(new Error('Falha ao ler o arquivo.'));
    reader.readAsArrayBuffer(file);
  });
}
async function attachContratoPdf(c, file){
  try{
    const {text, pages} = await extractPdfText(file);
    c.pdfNome = file.name; c.pdfTexto = text;
    logHist('contratos', `PDF "${file.name}" anexado ao contrato ${c.numero||c.fornecedor} (${pages} páginas).`);
    saveLocalDebounced(); renderApp();
    toast('PDF anexado.', 'ok');
  }catch(err){
    toast('Erro ao ler PDF: '+err.message, 'err');
  }
}
async function analyzeContratoWithAI(c, containerEl){
  const key = (localStorage.getItem(LS_APIKEY)||'').trim();
  let resultEl = containerEl.querySelector('.ai-result');
  if(!resultEl){ resultEl = document.createElement('div'); resultEl.className='ai-result hint'; resultEl.style.marginTop='6px'; containerEl.appendChild(resultEl); }
  if(!key){ resultEl.textContent = 'Nenhuma chave de API informada (aba Importar) — gere as diretrizes manualmente lendo o texto do PDF acima.'; return; }
  if(!c.pdfTexto){ resultEl.textContent = 'Nenhum PDF anexado a este contrato.'; return; }
  resultEl.textContent = 'Consultando IA...';
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({
        model:'claude-sonnet-5', max_tokens: 700,
        messages:[{role:'user', content:`Leia este contrato de prestação de serviços/fornecimento e liste, em português, de 5 a 10 diretrizes/pontos de atenção objetivos para quem for controlar e fiscalizar este contrato (valores, prazos, condições de pagamento, retenções, multas, garantia, riscos). Responda SOMENTE com uma lista, um item por linha, cada linha começando com "- ". Não inclua título nem texto explicativo.\n\nTexto do contrato:\n${c.pdfTexto.slice(0,15000)}`}]
      })
    });
    if(!resp.ok){
      const errBody = await resp.text();
      resultEl.textContent = `IA indisponível (${resp.status}). Detalhe: ${errBody.slice(0,200)}`;
      return;
    }
    const data = await resp.json();
    const txt = (data.content||[]).map(x=>x.text).join('\n');
    const lines = txt.split('\n').map(l=>l.replace(/^[-•\s]+/,'').trim()).filter(Boolean);
    if(!c.diretrizes) c.diretrizes = [];
    lines.forEach(l=>{ if(!c.diretrizes.includes(l)) c.diretrizes.push(l); });
    logHist('contratos', `Diretrizes geradas por IA para o contrato ${c.numero||c.fornecedor} (${lines.length} itens).`);
    saveLocalDebounced();
    resultEl.textContent = `${lines.length} diretriz(es) adicionada(s).`;
    renderApp();
  }catch(err){
    resultEl.textContent = 'IA indisponível (rede/CORS/crédito). Detalhe: '+err.message;
  }
}

function contratoField(label, key, c, opts){
  opts = opts || {};

  wrap.appendChild(l);
  let input;
  if(opts.type==='textarea'){ input = document.createElement('textarea'); input.rows = opts.rows||2; }
  else if(opts.type==='select'){
    input = document.createElement('select');
    (opts.options||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o.value; op.textContent=o.label; if((c[key]||'')===o.value) op.selected=true; input.appendChild(op); });
  } else { input = document.createElement('input'); input.type = opts.type||'text'; }
  if(opts.type!=='select') input.value = (opts.numeric ? fmtNum(c[key]||0) : (c[key] ?? ''));
  input.addEventListener('change', ()=>{
    let val = input.value;
    if(opts.numeric) val = parseNumInput(val);
    c[key] = val;
    recalcContrato(c);
    logHist('contratos', `Contrato ${c.numero||c.fornecedor}: "${label}" alterado.`);
    saveLocalDebounced();
    if(opts.rerender) renderApp(); else renderKpiStrip();
  });
  wrap.appendChild(input);
  return wrap;
}

/* =========================================================================
   IMPORTAÇÃO EXCEL — reconhecimento estrutural dos formatos reais
   (planilha de MEDIÇÃO com colunas por BM; planilha de ORÇAMENTO EXECUTIVO
   DETALHADO com meta de custo e custo realizado/aplicado)
   ========================================================================= */
function normCode(s){
  s = String(s==null?'':s).trim();
  const m = s.match(/^0*([0-9]+)$/);
  return m ? String(parseInt(m[1],10)) : s;
}
function cellText(v){ return v==null ? '' : String(v).trim(); }
function forwardFillLeft(row, len){
  const out = new Array(len).fill('');
  let last = '';
  for(let i=0;i<len;i++){
    const v = cellText(row && row[i]);
    if(v) last = v;
    out[i] = last;
  }
  return out;
}
function findRowIndex(rows, from, to, test){
  for(let i=from; i<Math.min(to, rows.length); i++){
    if(test(rows[i]||[])) return i;
  }
  return -1;
}

function parseMedicaoRows(rows){
  const maxCols = rows.reduce((m,r)=>Math.max(m, (r||[]).length), 0);
  const headerRowIdx = findRowIndex(rows, 0, 40, (r)=> normStr(r[0])==='item');
  if(headerRowIdx<0) return {ok:false, error:'não encontrei a linha de cabeçalho com "ITEM" na coluna A'};
  const subHeaderRowIdx = findRowIndex(rows, headerRowIdx, headerRowIdx+4, (r)=> r.some(c=>/quantidade\s*desta\s*medi/i.test(cellText(c))));
  const headerRow = rows[headerRowIdx] || [];
  const subHeaderRow = subHeaderRowIdx>=0 ? (rows[subHeaderRowIdx]||[]) : [];

  let itemCol=null, descCol=null, unidCol=null, qtdCol=null, vuCol=null, totalCol=null;
  for(let i=0;i<maxCols;i++){
    const h = normStr(headerRow[i]);
    if(h==='item' && itemCol===null) itemCol=i;
    else if((h.includes('descri')||h.includes('servico')) && descCol===null) descCol=i;
    else if((h==='und'||h==='und.'||h.includes('unidade')) && unidCol===null) unidCol=i;
    else if(h.includes('quant') && qtdCol===null) qtdCol=i;
    else if((h.includes('valor unit')||h.includes('preco unit')) && vuCol===null) vuCol=i;
    else if(h==='total' && totalCol===null) totalCol=i;
  }
  if(itemCol===null || descCol===null || unidCol===null){
    return {ok:false, error:'não encontrei as colunas de Item/Descrição/Unidade no cabeçalho'};
  }

  const bmCols = [];
  if(subHeaderRowIdx>=0){
    for(let i=0;i<maxCols;i++){
      if(/quantidade/i.test(cellText(subHeaderRow[i]))){
        const valIdx = (i+1<maxCols && /valor/i.test(cellText(subHeaderRow[i+1]))) ? i+1 : null;
        bmCols.push({qtdIdx:i, valIdx});
      }
    }
  }
  const bmLabels = bmCols.map(bc=>{
    const raw = cellText(headerRow[bc.qtdIdx]);
    return raw.replace(/^medi[cç][aã]o\s*\d+\s*-\s*/i,'').trim();
  });

  const dataStart = (subHeaderRowIdx>=0 ? subHeaderRowIdx : headerRowIdx) + 1;
  const items = [];
  let disc=null, grupo=null, blanks=0;
  for(let r=dataStart; r<rows.length; r++){
    const row = rows[r]||[];
    const a = cellText(row[itemCol]);
    const b = cellText(row[descCol]);
    if(!a && !b){ blanks++; if(blanks>8) break; continue; }
    blanks = 0;
    if(!a && /^total(\s+geral)?$/i.test(b)) break;
    const u = cellText(row[unidCol]);
    if(!u){
      if(a.length<=2) { disc = b || disc; grupo=null; }
      else { grupo = b || grupo; }
      continue;
    }
    const qtd = parseNumInput(qtdCol!=null ? row[qtdCol] : 0);
    const vu = parseNumInput(vuCol!=null ? row[vuCol] : 0);
    const tot = totalCol!=null ? parseNumInput(row[totalCol]) : 0;
    const bms = {};
    bmCols.forEach((bc,idx)=>{
      const qv = parseNumInput(row[bc.qtdIdx]);
      const vv = bc.valIdx!=null ? parseNumInput(row[bc.valIdx]) : 0;
      if(qv || vv) bms[idx+1] = {qtd:+qv.toFixed(4), valor: +(vv || qv*vu).toFixed(2)};
    });
    items.push({
      code:a, ncode:normCode(a), disciplina: disc||'(sem disciplina)', grupo: grupo||disc||'(sem grupo)',
      descricao:b, unidade:u, qtdContratada:+qtd.toFixed(4), valorUnitario:+vu.toFixed(4),
      totalContrato: +(tot || qtd*vu).toFixed(2), bms,
    });
  }
  if(!items.length) return {ok:false, error:'nenhum item com unidade preenchida foi encontrado após o cabeçalho'};
  if(!bmCols.length) return {ok:false, error:'não encontrei colunas de "QUANTIDADE DESTA MEDIÇÃO" por BM — confira se este é realmente o arquivo de MEDIÇÃO (e não o de custo/orçamento)'};

  let contrato=null, empresa=null, objeto=null;
  for(let r=0;r<headerRowIdx;r++){
    const row = rows[r]||[];
    row.forEach((c,i)=>{
      const t = normStr(c);
      if(/^contrato\s*:?$/.test(t)) contrato = cellText(row.slice(i+1).find(cellText));
      if(/^empresa\s*:?$/.test(t)) empresa = cellText(row.slice(i+1).find(cellText));
      if(/^objeto\s*:?$/.test(t)) objeto = cellText(row.slice(i+1).find(cellText));
    });
  }

  return {ok:true, items, bmCount:bmCols.length, bmLabels, contratoInfo:{contrato,empresa,objeto}};
}

function parseOrcamentoRows(rows){
  const maxCols = rows.reduce((m,r)=>Math.max(m, (r||[]).length), 0);
  const headerRowIdx = findRowIndex(rows, 0, 40, (r)=> normStr(r[0])==='item');
  if(headerRowIdx<0) return {ok:false, error:'não encontrei a linha de cabeçalho com "ITEM" na coluna A'};
  const headerRow = rows[headerRowIdx]||[];
  const groupRow = forwardFillLeft(rows[headerRowIdx-1]||[], maxCols);
  const superRowIdx = findRowIndex(rows, Math.max(0,headerRowIdx-4), headerRowIdx-1, (r)=> r.some(c=>/aplicad/i.test(cellText(c))));
  const superRow = superRowIdx>=0 ? forwardFillLeft(rows[superRowIdx]||[], maxCols) : new Array(maxCols).fill('');

  let itemCol=null, descCol=null, unidCol=null, qtdCol=null, metaCol=null, realCol=null;
  for(let i=0;i<maxCols;i++){
    const h = normStr(headerRow[i]);
    const g = normStr(groupRow[i]);
    const sup = normStr(superRow[i]);
    if(h==='item' && itemCol===null) itemCol=i;
    else if((h.includes('especifica')||h.includes('descri')||h.includes('servico')) && descCol===null) descCol=i;
    else if((h==='und'||h==='und.'||h.includes('unidade')) && unidCol===null) unidCol=i;
    else if(h.includes('quant') && qtdCol===null) qtdCol=i;
    else if(metaCol===null && h.includes('total') && h.includes('material') && !sup.includes('aplicad')) metaCol=i;
    else if(h==='valor total' && sup.includes('aplicad') && g.includes('material') && (g.includes('m.o')||g.includes('mao de obra')||g.includes('+'))) realCol=i;
  }
  if(itemCol===null || descCol===null || unidCol===null || metaCol===null){
    return {ok:false, error:'não encontrei as colunas de Item/Descrição/Unidade/Meta de custo no cabeçalho'};
  }

  const items = [];
  let disc=null, grupo=null, blanks=0;
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r]||[];
    const a = cellText(row[itemCol]);
    const b = cellText(row[descCol]);
    if(!a && !b){ blanks++; if(blanks>8) break; continue; }
    blanks = 0;
    if(/^total\s*geral$/i.test(a) || (!a && /^total(\s+geral)?$/i.test(b))) break;
    const u = cellText(row[unidCol]);
    if(!u){
      if(a.length<=2) { disc = b || disc; grupo=null; }
      else { grupo = b || grupo; }
      continue;
    }
    const meta = parseNumInput(row[metaCol]);
    const real = realCol!=null ? parseNumInput(row[realCol]) : 0;
    items.push({
      code:a, ncode:normCode(a), disciplina: disc||'(sem disciplina)', grupo: grupo||disc||'(sem grupo)',
      descricao:b, unidade:u, qtdOrcada: qtdCol!=null ? +parseNumInput(row[qtdCol]).toFixed(4) : 0,
      metaCusto: +meta.toFixed(2), custoRealizado: +real.toFixed(2),
    });
  }
  if(!items.length) return {ok:false, error:'nenhum item com unidade preenchida foi encontrado após o cabeçalho'};
  return {ok:true, items};
}

function handleExcelFile(file, kind){
  if(typeof XLSX === 'undefined'){ toast('Biblioteca de planilhas ainda carregando ou indisponível offline. Tente novamente em instantes.', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const nameGuess = kind==='medicao'
        ? wb.SheetNames.find(n=>/medi[cç][aã]o/i.test(n))
        : wb.SheetNames.find(n=>/planilha|or[cç]amento/i.test(n));
      const sheet = wb.Sheets[nameGuess || wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:true});
      if(!rows.length){ toast('Planilha vazia.', 'err'); return; }
      const parsed = kind==='medicao' ? parseMedicaoRows(rows) : parseOrcamentoRows(rows);
      if(!parsed.ok){
        toast(`Não foi possível reconhecer a estrutura da planilha (${parsed.error}). Confira se é o arquivo correto de ${kind==='medicao'?'MEDIÇÃO':'ORÇAMENTO EXECUTIVO DETALHADO'}.`, 'err');
        return;
      }
      showImportPreviewModal(file.name, kind, parsed);
    }catch(err){
      toast('Erro ao ler o arquivo: '+err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}
