function mergeMedicaoStructured(parsed, filename, jaAprovado){
  let updated=0, added=0, aprovados=0;
  const byId = {};
  state.medicaoItems.forEach(it=>{ byId[it.id]=it; });
  parsed.items.forEach(pi=>{
    let it = byId[pi.ncode];
    if(!it){
      it = {id: pi.ncode, item: pi.code, bms:{}, qtdAprovada:0, valorAprovado:0, statusFaturamento:'Não faturado'};
      state.medicaoItems.push(it);
      byId[pi.ncode] = it;
      added++;
    } else updated++;
    it.item = pi.code;
    it.disciplina = pi.disciplina;
    it.grupo = pi.grupo;
    it.descricao = pi.descricao;
    it.unidade = pi.unidade;
    it.qtdContratada = pi.qtdContratada;
    it.valorUnitario = pi.valorUnitario;
    it.totalContrato = pi.totalContrato;
    if(!it.bms) it.bms = {};
    Object.keys(pi.bms).forEach(n=>{ it.bms[n] = pi.bms[n]; });
    if(!state.disciplinas.includes(it.disciplina)) state.disciplinas.push(it.disciplina);
    recalcItem(it);
    if(jaAprovado && Object.keys(pi.bms).length){
      it.qtdAprovada = it.qtdAcumulada;
      it.valorAprovado = it.valorMedido;
      it.statusFaturamento = 'Faturado aprovado';
      aprovados++;
    }
  });
  if(parsed.bmCount > state.bmCount) state.bmCount = parsed.bmCount;
  (parsed.bmLabels||[]).forEach((lbl,idx)=>{ if(lbl) state.bmLabels[idx] = lbl; });
  if(parsed.contratoInfo){
    state.contratoInfo = Object.assign({}, state.contratoInfo, Object.fromEntries(Object.entries(parsed.contratoInfo).filter(([,v])=>v)));
  }
  state.lastImportMedicao = {when: nowStr(), updated, added};
  state.isSeed = false;
  logHist('importacao', `Importação de MEDIÇÃO ("${filename}"): ${updated} itens atualizados, ${added} novos, ${state.medicaoItems.length} no total, ${parsed.bmCount} BMs.${jaAprovado ? ` ${aprovados} itens marcados como aprovados (medições já aprovadas pela fiscalização).` : ''}`);
  recalcAll(); saveLocalDebounced(); renderApp();
  toast(`Medição importada: ${updated} atualizados, ${added} novos.${jaAprovado ? ` ${aprovados} aprovados.` : ''}`, 'ok');
}

function mergeCustoStructured(parsed, filename){
  let updated=0, added=0;
  const byId = {};
  state.custoItems.forEach(it=>{ byId[it.id]=it; });
  parsed.items.forEach(pi=>{
    let it = byId[pi.ncode];
    if(!it){
      it = {id: pi.ncode, item: pi.code, obs:''};
      state.custoItems.push(it);
      byId[pi.ncode] = it;
      added++;
    } else updated++;
    it.item = pi.code;
    it.disciplina = pi.disciplina;
    it.grupo = pi.grupo;
    it.descricao = pi.descricao;
    it.unidade = pi.unidade;
    it.qtdOrcada = pi.qtdOrcada;
    it.metaCusto = pi.metaCusto;
    it.custoRealizado = pi.custoRealizado;
    if(!state.disciplinas.includes(it.disciplina)) state.disciplinas.push(it.disciplina);
  });
  state.lastImportCusto = {when: nowStr(), updated, added};
  state.isSeed = false;
  logHist('importacao', `Importação de ORÇAMENTO EXECUTIVO ("${filename}"): ${updated} itens atualizados, ${added} novos, ${state.custoItems.length} no total.`);
  recalcAll(); saveLocalDebounced(); renderApp();
  toast(`Custo importado: ${updated} atualizados, ${added} novos.`, 'ok');
}

  [3,4].forEach(r=>{ [1,5].forEach(c=>{ ws.getCell(r,c).font={name:'Arial',bold:true}; }); });

  const headerRow = 6, subRow = 7;
  const setHeader = (r,c,v)=>{ const cell=ws.getCell(r,c); cell.value=v; cell.font={name:'Arial',size:10,bold:true}; cell.fill=HEADER_FILL; cell.alignment={horizontal:'center',vertical:'middle',wrapText:true}; cell.border=BORDER; return cell; };
  ws.mergeCells(headerRow,1,subRow,1); setHeader(headerRow,1,'ITEM');

  for(let b=0;b<bmCount;b++){

    setHeader(subRow,c2,'VALOR DESTA MEDICAO');

  ws.mergeCells(headerRow,saldoQC,subRow,saldoQC); setHeader(headerRow,saldoQC,'SALDO DE QUANTIDADE DE PLANILHA');

    ws.getCell(row,3).value = it.unidade;
    ws.getCell(row,4).value = it.qtdContratada;

/* =========================================================================
   PDF (PDF.js local) + IA opcional (Anthropic)
   ========================================================================= */
function handlePdfFile(file){
  if(typeof pdfjsLib === 'undefined'){ toast('PDF.js ainda carregando ou indisponível offline. Tente novamente em instantes.', 'err'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const pdf = await pdfjsLib.getDocument({data: e.target.result}).promise;
      let text = '';
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        text += content.items.map(it=>it.str).join(' ') + '\n\n';
      }
      state.attachments.push({name:file.name, pages:pdf.numPages, text, when: nowStr()});
      logHist('sistema', `PDF "${file.name}" lido localmente via PDF.js (${pdf.numPages} páginas).`);
      saveLocalDebounced();
      toast(`PDF "${file.name}" lido (${pdf.numPages} páginas).`, 'ok');
      if(currentTab==='importar') renderApp();
    }catch(err){
      toast('Erro ao ler PDF: '+err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}
async function analyzePdfWithAI(attachment, resultEl){
  const key = (localStorage.getItem(LS_APIKEY)||'').trim();
  if(!key){ resultEl.textContent = 'Nenhuma chave de API informada — usando apenas leitura local (recurso de IA é opcional).'; return; }
  resultEl.textContent = 'Consultando IA...';
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens: 600,
        messages:[{role:'user', content:`Resuma os pontos principais deste documento de obra em português, em até 8 tópicos:\n\n${attachment.text.slice(0,12000)}`}]
      })
    });
    if(!resp.ok){
      const errBody = await resp.text();
      resultEl.textContent = `IA indisponível (${resp.status}). Usando leitura local do PDF apenas. Detalhe: ${errBody.slice(0,200)}`;
      return;
    }
    const data = await resp.json();
    const txt = (data.content||[]).map(c=>c.text).join('\n');
    resultEl.textContent = txt || 'Sem resposta da IA.';
  }catch(err){
    resultEl.textContent = 'IA indisponível (rede/CORS/crédito). Usando leitura local do PDF apenas. Detalhe: '+err.message;
  }
}

      if(parsed.medicaoItems.length===0 && state.medicaoItems.length>0){
        if(!confirm('O backup selecionado está vazio (0 itens de medição) e a base atual possui '+state.medicaoItems.length+' itens. Restaurar mesmo assim e substituir a base atual?')) return;
      } else if(!confirm(`Restaurar backup com ${parsed.medicaoItems.length} itens de medição e ${(parsed.custoItems||[]).length} itens de custo? Isso substituirá os dados atuais no navegador.`)){
        return;
      }
      state = migrateState(parsed);
      logHist('sistema', 'Backup JSON restaurado pelo usuário.');
      recalcAll(); saveLocalDebounced(); renderApp();
      toast('Backup restaurado com sucesso.', 'ok');
    }catch(err){
      toast('Erro ao ler JSON: '+err.message, 'err');
    }
  };
  reader.readAsText(file);
}
function doSaveHtml(){
  try{
    const docClone = document.documentElement.cloneNode(true);
    const stateScript = docClone.querySelector('#embedded-state');
    stateScript.textContent = JSON.stringify(state);
    const html = '<!DOCTYPE html>\n' + docClone.outerHTML;
    const stamp = new Date().toISOString().replace(/[:T]/g,'-').slice(0,16);
    downloadFile(`controle_obra_${stamp}.html`, html, 'text/html');
    logHist('sistema','Cópia HTML autônoma exportada com os dados atuais embutidos.');
    saveLocalDebounced();
    toast('HTML salvo — publique este arquivo para atualizar a versão online.', 'ok');
  }catch(err){
    toast('Erro ao salvar HTML: '+err.message, 'err');
  }
}

/* =========================================================================
   TOOLBAR GLOBAL
   ========================================================================= */
document.getElementById('btnSaveLocal').onclick = ()=>persistLocal(false);
document.getElementById('btnBackupJson').onclick = doBackupJson;
document.getElementById('btnImportJsonTop').onclick = ()=>document.getElementById('fileJsonTop').click();
document.getElementById('fileJsonTop').addEventListener('change', (e)=>{ if(e.target.files[0]) doRestoreJson(e.target.files[0]); });
document.getElementById('btnSaveHtml').onclick = doSaveHtml;

/* =========================================================================
   INICIALIZAÇÃO
   ========================================================================= */
recalcAll();
renderApp();
let suppressUnloadSave = false;
window.addEventListener('beforeunload', ()=>{ if(suppressUnloadSave) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} });
</script>
</body>
