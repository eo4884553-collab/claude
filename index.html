<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Obra — Medição, BM e Físico-Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{
  --bg:#0f1420; --bg2:#161d2e; --panel:#1b2436; --panel2:#212c42;
  --border:#2c3a54; --text:#e7ecf5; --muted:#8fa0bd; --muted2:#647492;
  --accent:#4d8dff; --accent2:#2f6fe0; --good:#3ecf8e; --warn:#f0b93d; --bad:#f0563d;
  --input-bg:#111826; --radius:8px; --mono:'SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;}
body{display:flex;flex-direction:column;min-height:100vh;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:#33415c;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn.primary:hover{background:var(--accent);}
.btn.good{background:#1c3a2c;border-color:var(--good);color:var(--good);}
.btn.warn{background:#3a2f14;border-color:var(--warn);color:var(--warn);}
.btn.bad{background:#3a1c18;border-color:var(--bad);color:var(--bad);}
.btn.sm{padding:3px 8px;font-size:11.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* header */
header.topbar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header.topbar .title{font-weight:700;font-size:14.5px;margin-right:auto;display:flex;align-items:center;gap:8px;}
header.topbar .title .sub{color:var(--muted);font-weight:400;font-size:11.5px;}
.kpi-strip{display:flex;gap:8px;padding:6px 14px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;min-width:118px;flex:0 0 auto;}
.kpi-mini .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.kpi-mini .v{font-size:13.5px;font-weight:700;margin-top:1px;}
.kpi-mini .v.bad{color:var(--bad);}
.kpi-mini .v.good{color:var(--good);}

/* tabs */
nav.tabs{display:flex;gap:2px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;}
nav.tabs button{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
nav.subtabs{display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap;}
nav.subtabs button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px 6px 0 0;font-size:12px;font-weight:600;}
nav.subtabs button.active{color:var(--text);background:var(--panel2);border-color:var(--accent);border-bottom-color:var(--panel2);}

main{flex:1;padding:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.panel h2{margin:0 0 4px;font-size:15px;}
.panel h3{margin:0 0 8px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.hint{color:var(--muted);font-size:11.5px;line-height:1.5;}
.grid{display:grid;gap:10px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.kpi{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;}
.kpi .v.bad{color:var(--bad);}
.kpi .v.good{color:var(--good);}
.kpi .s{font-size:10.5px;color:var(--muted2);margin-top:2px;}

.charts-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;}
@media (max-width:1000px){.charts-row{grid-template-columns:1fr;}}
.chart-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;}
.chart-box h4{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;}
canvas{max-width:100%;display:block;}

.risk-banner{border-radius:8px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px;}
.risk-banner.bad{background:#3a1c18;border:1px solid var(--bad);color:#ffb3a3;}
.risk-banner.good{background:#123524;border:1px solid var(--good);color:#a9f0cf;}

/* filter bar */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;}
.filterbar label{font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;}
.filterbar select,.filterbar input[type=text]{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;font-size:12px;min-width:110px;}
.filterbar .count{margin-left:auto;color:var(--muted);font-size:11.5px;}

.bulkbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:8px;background:#182238;border:1px dashed var(--accent2);border-radius:8px;font-size:12px;}
.bulkbar select,.bulkbar input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;font-size:12px;}
.bulkbar input[type=number]{width:110px;}

/* tables */
.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px;}
table.datatable{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;}
table.datatable thead th{position:sticky;top:0;background:#1a2338;color:var(--muted);text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.02em;padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid #22304a;white-space:nowrap;z-index:2;user-select:none;}
table.datatable thead th .resizer{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;}
table.datatable th{position:sticky;top:0;}
table.datatable td{padding:4px 8px;border-bottom:1px solid #22304a;border-right:1px solid #1e2a41;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;}
table.datatable td.wrap{white-space:normal;overflow:visible;text-overflow:clip;}
table.datatable tbody tr:hover td{background:#1d2a42;}
table.datatable td input,table.datatable td select,table.datatable td textarea{width:100%;background:var(--input-bg);border:1px solid transparent;color:var(--text);padding:3px 5px;border-radius:4px;font-size:12px;}
table.datatable td input:hover,table.datatable td select:hover{border-color:var(--border);}
table.datatable td input:focus,table.datatable td select:focus,table.datatable td textarea:focus{border-color:var(--accent);outline:none;background:#0d1420;}
table.datatable td textarea{resize:vertical;min-height:30px;}
table.datatable td.num{text-align:right;}
table.datatable td.num input{text-align:right;}
table.datatable tbody tr.risk td{background:#2a1712;}
table.datatable tbody tr.risk:hover td{background:#331b15;}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;}
.tag.ok{background:#123524;color:var(--good);}
.tag.mid{background:#3a2f14;color:var(--warn);}
.tag.no{background:#22304a;color:var(--muted);}
.tag.bad{background:#3a1c18;color:var(--bad);}
th.col-resizable{position:relative;}

/* import area */
.drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px;transition:.15s;}
.drop.drag{border-color:var(--accent);background:#152036;color:var(--text);}
.import-card{display:grid;grid-template-columns:1fr;gap:8px;}
.import-log{font-size:11.5px;color:var(--muted);margin-top:8px;}
.import-log b{color:var(--text);}
.pdf-item{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel2);}
.pdf-item .pdf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pdf-item pre{white-space:pre-wrap;font-size:11px;max-height:200px;overflow:auto;background:var(--input-bg);padding:8px;border-radius:6px;margin-top:6px;display:none;}
.pdf-item.open pre{display:block;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.72);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;max-width:640px;width:92%;max-height:86vh;overflow:auto;}
.modal h3{margin-top:0;}
.map-row{display:grid;grid-template-columns:180px 1fr;gap:8px;align-items:center;margin-bottom:6px;}
.map-row select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

#toasts{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:fadein .15s ease-out;max-width:320px;}
.toast.err{border-color:var(--bad);}
.toast.ok{border-color:var(--good);}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.small-note{font-size:11px;color:var(--muted2);margin-top:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
label.field{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);}
label.field input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:5px;font-size:12.5px;}
footer.app-footer{padding:10px 14px;color:var(--muted2);font-size:10.5px;text-align:center;}
</style>
</head>

<header class="topbar">

<script>
/* =========================================================================
   UTILITÁRIOS
   ========================================================================= */
const LS_KEY = 'obra_controle_state_v1';
const LS_APIKEY = 'obra_controle_anthropic_key_v1';

function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtNum(n,dec){
  n = Number(n)||0;
  return n.toLocaleString('pt-BR',{minimumFractionDigits:dec??2,maximumFractionDigits:dec??2});
}
function fmtPct(n){
  n = Number(n)||0;
  return (n*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
}
function parseNumInput(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  let s = String(v).trim();
  if(s === '') return 0;
  s = s.replace(/[R$\s]/g,'');
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1){
    s = s.replace(/\./g,'').replace(',','.');
  } else if(s.indexOf(',')>-1){
    s = s.replace(',','.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,10); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function debounce(fn,ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; }
function normStr(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function nowStr(){
  const d = new Date();
  return d.toLocaleString('pt-BR');
}
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast'+(kind?(' '+kind):'');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3600);
}
function sumBy(arr, key){ return arr.reduce((s,it)=> s + (Number(it[key])||0), 0); }

/* =========================================================================
   ESTADO
   ========================================================================= */
let SEED = null;
try{ SEED = JSON.parse(document.getElementById('seed-data').textContent || 'null'); }catch(e){ SEED = null; }

function defaultState(){
  const seed = SEED || {disciplinas:[], bmCount:1, medicaoItems:[], custoItems:[]};
  return {
    version: 1,
    activeBm: 1,
    bmCount: seed.bmCount || 1,
    disciplinas: deepClone(seed.disciplinas || []),
    medicaoItems: deepClone(seed.medicaoItems || []),
    custoItems: deepClone(seed.custoItems || []),
    supressaoOverrides: {},
    filters: {},
    columnWidths: {},
    historico: [{ts: Date.now(), tipo:'sistema', texto:'Base inicial de demonstração carregada (dados de exemplo reconciliados com os totais consolidados informados).'}],
    lastImportMedicao: null,
    lastImportCusto: null,
    attachments: [],
    isSeed: true,
  };
}

let state = loadInitialState();

function loadInitialState(){
  try{
    const embedded = document.getElementById('embedded-state').textContent.trim();
    if(embedded && embedded !== '__EMBEDDED' + '_STATE__' && embedded.length > 10){
      const parsed = JSON.parse(embedded);
      if(parsed && Array.isArray(parsed.medicaoItems)) return migrateState(parsed);
    }
  }catch(e){ /* ignore, fall through */ }
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.medicaoItems)) return migrateState(parsed);
    }
  }catch(e){ /* ignore */ }
  return defaultState();
}
function migrateState(s){
  const d = defaultState();
  return Object.assign(d, s, {
    disciplinas: s.disciplinas && s.disciplinas.length ? s.disciplinas : d.disciplinas,
    filters: s.filters || {},
    columnWidths: s.columnWidths || {},
    historico: s.historico || [],
    attachments: s.attachments || [],
    supressaoOverrides: s.supressaoOverrides || {},
  });
}

const saveLocalDebounced = debounce(()=>{ persistLocal(true); }, 900);
function persistLocal(silent){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById('autosaveStatus').textContent = 'Salvo automaticamente às ' + new Date().toLocaleTimeString('pt-BR');
    if(!silent) toast('Estado salvo no navegador.', 'ok');
  }catch(e){
    document.getElementById('autosaveStatus').textContent = 'Falha ao salvar localmente: ' + e.message;
    if(!silent) toast('Falha ao salvar no navegador: '+e.message, 'err');
  }
}

/* =========================================================================
   HISTÓRICO / DESVIOS
   ========================================================================= */
function logHist(tipo, texto, extra){
  state.historico.unshift(Object.assign({ts: Date.now(), tipo, texto}, extra||{}));
  if(state.historico.length > 3000) state.historico.length = 3000;
}
function logDeviation(item, campo, before, after){
  if(before === after) return;
  logHist('desvio', `Item ${item.item} (${item.disciplina}) — ${campo}: ${typeof before==='number'?fmtMoney(before):before} → ${typeof after==='number'?fmtMoney(after):after}`,
    {itemId:item.id, campo, before, after});
}

/* =========================================================================
   RECÁLCULO CENTRAL
   ========================================================================= */
function recalcItem(it){
  const bmKeys = Object.keys(it.bms||{}).map(Number).filter(n=>!isNaN(n));
  it.bmsMedidos = bmKeys.sort((a,b)=>a-b);
  let qtdAc = 0, valMed = 0;
  bmKeys.forEach(k=>{ const b = it.bms[k]; qtdAc += Number(b.qtd)||0; valMed += Number(b.valor)||0; });
  it.qtdAcumulada = +qtdAc.toFixed(4);
  it.valorMedido = +valMed.toFixed(2);
  it.saldoQtd = +((it.qtdContratada||0) - it.qtdAcumulada).toFixed(4);
  it.saldoValor = +((it.totalContrato||0) - it.valorMedido).toFixed(2);
  if(!it._statusManual){
    it.status = it.saldoQtd <= 0.001 && it.qtdAcumulada>0 ? 'Concluído' : (it.qtdAcumulada>0 ? 'Em andamento' : 'Não iniciado');
  }
}
function recalcAll(){
  state.medicaoItems.forEach(recalcItem);

  const byDisc = {};
  const ensure = (d)=> byDisc[d] || (byDisc[d] = {disciplina:d, qtdContratada:0, qtdMedida:0, valorContratado:0, valorMedido:0, valorAprovado:0, metaCusto:0, custoRealizado:0, nItens:0});
  (state.disciplinas||[]).forEach(d=>ensure(d));
  state.medicaoItems.forEach(it=>{
    const g = ensure(it.disciplina || '(sem disciplina)');
    g.qtdContratada += it.qtdContratada||0;
    g.qtdMedida += it.qtdAcumulada||0;
    g.valorContratado += it.totalContrato||0;
    g.valorMedido += it.valorMedido||0;
    g.valorAprovado += it.valorAprovado||0;
    g.nItens++;
  });
  state.custoItems.forEach(it=>{
    const g = ensure(it.disciplina || '(sem disciplina)');
    g.metaCusto += it.metaCusto||0;
    g.custoRealizado += it.custoRealizado||0;
  });
  Object.values(byDisc).forEach(g=>{
    ['qtdContratada','qtdMedida','valorContratado','valorMedido','valorAprovado','metaCusto','custoRealizado'].forEach(k=>{ g[k] = +g[k].toFixed(2); });
  });

  const curvaS = [];
  let acc = 0, accAprov=0;
  for(let b=1; b<=state.bmCount; b++){
    let val = 0, aprov=0;
    state.medicaoItems.forEach(it=>{ if(it.bms && it.bms[b]) val += Number(it.bms[b].valor)||0; if(it.statusFaturamento==='Faturado aprovado' && it.bms && it.bms[b]) aprov += Number(it.bms[b].valor)||0; });
    acc += val; accAprov += aprov;
    curvaS.push({bm:b, valor:+val.toFixed(2), acumulado:+acc.toFixed(2), aprovAcumulado:+accAprov.toFixed(2)});
  }

  const totalContrato = sumBy(state.medicaoItems,'totalContrato');
  const totalMedidoBM = sumBy(state.medicaoItems,'valorMedido');
  const totalAprovado = sumBy(state.medicaoItems,'valorAprovado');
  const qtdContratadaTotal = sumBy(state.medicaoItems,'qtdContratada');
  const qtdMedidaTotal = sumBy(state.medicaoItems,'qtdAcumulada');
  const totalMetaCusto = sumBy(state.custoItems,'metaCusto');
  const totalCustoRealizado = sumBy(state.custoItems,'custoRealizado');
  const margemTotal = totalMedidoBM - totalCustoRealizado;

  const statusCounts = {'Não faturado':0,'Em aprovação':0,'Faturado aprovado':0};
  state.medicaoItems.forEach(it=>{ statusCounts[it.statusFaturamento||'Não faturado'] = (statusCounts[it.statusFaturamento||'Não faturado']||0)+1; });

  state._agg = {
    byDisc, curvaS,
    totalContrato:+totalContrato.toFixed(2), totalMedidoBM:+totalMedidoBM.toFixed(2), totalAprovado:+totalAprovado.toFixed(2),
    qtdContratadaTotal:+qtdContratadaTotal.toFixed(2), qtdMedidaTotal:+qtdMedidaTotal.toFixed(2),
    totalMetaCusto:+totalMetaCusto.toFixed(2), totalCustoRealizado:+totalCustoRealizado.toFixed(2),
    margemTotal:+margemTotal.toFixed(2), statusCounts,
    avancoFisico: qtdContratadaTotal>0 ? qtdMedidaTotal/qtdContratadaTotal : 0,
    avancoFinanceiro: totalContrato>0 ? totalMedidoBM/totalContrato : 0,
  };
}

function supressaoRow(disc){
  const g = state._agg.byDisc[disc] || {qtdContratada:0,qtdMedida:0,valorContratado:0,valorMedido:0};
  const ov = state.supressaoOverrides[disc] || {};
  const qtdContratada = ov.qtdContratada!=null ? ov.qtdContratada : g.qtdContratada;
  const qtdMedida = ov.qtdMedida!=null ? ov.qtdMedida : g.qtdMedida;
  const valorContratado = ov.valorContratado!=null ? ov.valorContratado : g.valorContratado;
  const valorMedido = ov.valorMedido!=null ? ov.valorMedido : g.valorMedido;
  const suprimidoAuto = +(valorContratado - valorMedido).toFixed(2);
  const saldo = ov.saldo!=null ? ov.saldo : +(qtdContratada - qtdMedida).toFixed(4);
  const pct = valorContratado>0 ? valorMedido/valorContratado : 0;
  const status = ov.status || (pct>=0.999 ? 'Concluído' : pct>0 ? 'Em execução' : 'Não iniciado');
  return {disciplina:disc, qtdContratada, qtdMedida, valorContratado, valorMedido, suprimidoAuto, saldo, status, pct};
}

/* =========================================================================
   TABELA GENÉRICA (com filtros, resize, edição)
   ========================================================================= */
function getColWidth(tableId, key, def){
  const t = state.columnWidths[tableId];
  return (t && t[key]) ? t[key] : def;
}
function setColWidth(tableId, key, w){
  if(!state.columnWidths[tableId]) state.columnWidths[tableId] = {};
  state.columnWidths[tableId][key] = w;
}

function renderTable(tableId, columns, rows, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');
  table.className = 'datatable';
  table.dataset.tableId = tableId;

  const colgroup = document.createElement('colgroup');
  columns.forEach(c=>{
    const col = document.createElement('col');
    col.style.width = getColWidth(tableId, c.key, c.width||120)+'px';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach((c,ci)=>{
    const th = document.createElement('th');
    th.className = 'col-resizable';
    th.style.position='relative';
    th.textContent = c.label;
    const rez = document.createElement('span');
    rez.className = 'resizer';
    th.appendChild(rez);
    let startX, startW;
    rez.addEventListener('mousedown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      startX = e.clientX;
      startW = colgroup.children[ci].getBoundingClientRect().width;
      function onMove(ev){
        const w = Math.max(50, startW + (ev.clientX - startX));
        colgroup.children[ci].style.width = w+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        setColWidth(tableId, c.key, parseInt(colgroup.children[ci].style.width,10));
        saveLocalDebounced();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(row=>{
    const tr = document.createElement('tr');
    if(opts.rowClass) tr.className = opts.rowClass(row) || '';
    tr.dataset.rowId = row.id;
    columns.forEach(c=>{
      const td = document.createElement('td');
      if(c.wrap) td.className = 'wrap';
      if(c.align==='num') td.classList.add('num');
      if(c.render){
        td.innerHTML = c.render(row);
      } else if(c.editable){
        if(c.type==='number' || c.align==='num') td.classList.add('num');
        if(c.type === 'select'){
          const sel = document.createElement('select');
          sel.dataset.key = c.key;
          (c.options||[]).forEach(optV=>{
            const o = document.createElement('option');
            o.value = optV; o.textContent = optV;
            if((row[c.key]||'') === optV) o.selected = true;
            sel.appendChild(o);
          });
          td.appendChild(sel);
        } else if(c.type === 'textarea'){
          const ta = document.createElement('textarea');
          ta.dataset.key = c.key;
          ta.value = row[c.key]||'';
          ta.rows = 2;
          td.appendChild(ta);
        } else {
          const inp = document.createElement('input');
          inp.type = c.type==='number' ? 'text' : 'text';
          inp.dataset.key = c.key;
          inp.value = c.type==='number' ? fmtNum(row[c.key], c.dec??2) : (row[c.key]??'');
          if(c.type==='number') inp.dataset.numeric = '1';
          td.appendChild(inp);
        }
      } else {
        let v = row[c.key];
        if(c.type==='number') v = fmtNum(v, c.dec??2);
        if(c.type==='money') v = fmtMoney(v);
        td.textContent = v ?? '';
        if(c.type==='money'||c.type==='number') td.classList.add('num');
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  if(opts.onChange){
    tbody.addEventListener('change', (e)=>{
      const key = e.target.dataset.key;
      if(!key) return;
      const tr = e.target.closest('tr');
      const rowId = tr.dataset.rowId;
      const row = rows.find(r=>String(r.id)===String(rowId));
      if(!row) return;
      let val = e.target.value;
      if(e.target.dataset.numeric) val = parseNumInput(val);
      opts.onChange(row, key, val, e.target);
    });
  }
  return wrap;
}

function getFilterState(tabKey){

function renderFilterBar(tabKey, opts, onChange){

  countSpan.className = 'count';

function makeSelectField(label, val, options, onChange){
  const wrap = document.createElement('label');
  const span = document.createElement('span'); span.textContent = label;
  const sel = document.createElement('select');
  options.forEach(o=>{
    const op = document.createElement('option');
    op.value = o; op.textContent = o===''?'Todos':o;
    if(o===val) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener('change', ()=>onChange(sel.value));
  wrap.appendChild(span); wrap.appendChild(sel);
  return wrap;
}
function applyFilters(items, tabKey, opts){
  const f = getFilterState(tabKey);
  return items.filter(it=>{
    if(f.disciplina && it.disciplina !== f.disciplina) return false;
    if(f.grupo && it.grupo !== f.grupo) return false;
    if(f.status && (opts.statusField ? it[opts.statusField] : it.status) !== f.status) return false;
    if(f.bm && !(it.bmsMedidos||[]).includes(Number(f.bm))) return false;
    if(f.search){
      const s = normStr(f.search);
      const hay = normStr((it.item||'')+' '+(it.descricao||'')+' '+(it.disciplina||''));
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderBulkBar(tabKey, fieldOptions, getFilteredRows, onApplied){
  const bar = document.createElement('div');
  bar.className = 'bulkbar';
  bar.innerHTML = `<b>Ação em massa:</b>`;
  const fieldSel = document.createElement('select');
  fieldOptions.forEach(f=>{ const o=document.createElement('option'); o.value=f.key; o.textContent=f.label; fieldSel.appendChild(o); });
  const opSel = document.createElement('select');
  [['add','Somar'],['sub','Subtrair'],['set','Definir valor']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; opSel.appendChild(o); });
  const valInp = document.createElement('input'); valInp.type='number'; valInp.step='0.01'; valInp.placeholder='valor';
  const applyBtn = document.createElement('button'); applyBtn.className='btn primary sm'; applyBtn.textContent='Aplicar aos itens filtrados';
  applyBtn.onclick = ()=>{
    const rows = getFilteredRows();
    if(!rows.length){ toast('Nenhum item filtrado para aplicar.', 'err'); return; }
    const delta = parseNumInput(valInp.value);
    if(!delta && opSel.value!=='set'){ toast('Informe um valor.', 'err'); return; }
    const field = fieldSel.value;
    const label = fieldOptions.find(f=>f.key===field).label;
    let count=0, totalBefore=0, totalAfter=0;
    rows.forEach(r=>{
      const before = Number(r[field])||0;
      totalBefore += before;
      let after = before;
      if(opSel.value==='add') after = before + delta;
      else if(opSel.value==='sub') after = before - delta;
      else after = delta;
      after = +after.toFixed(2);
      r[field] = after;
      totalAfter += after;
      count++;
      if(onApplied) onApplied(r, field, before, after);
    });
    logHist('massa', `Ação em massa em "${label}" (${tabKey}): ${count} itens, total ${fmtMoney(totalBefore)} → ${fmtMoney(totalAfter)}.`);
    recalcAll(); saveLocalDebounced(); renderApp();
    toast(`Aplicado a ${count} itens.`, 'ok');
  };
  bar.appendChild(fieldSel); bar.appendChild(opSel); bar.appendChild(valInp); bar.appendChild(applyBtn);
  return bar;
}

/* =========================================================================
   GRÁFICOS (canvas manual, sem dependências externas)
   ========================================================================= */
function sizeCanvas(cv, w, h){
  const dpr = window.devicePixelRatio || 1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return ctx;
}
const PALETTE = ['#4d8dff','#3ecf8e','#f0b93d','#f0563d','#a970ff','#3ddce0','#ff8fc7','#8fa0bd','#c9e13a','#ff9d5c','#5cc9ff','#e17aff','#7dd68a','#ffd166','#ef6f6c','#6ec6ff','#b2f2bb','#ffd8a8'];

function drawBarChart(cv, labels, values, opts){
  opts = opts || {};
  const w = cv.clientWidth || 320, h = 190;
  const ctx = sizeCanvas(cv, w, h);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...values);
  const padL = 4, padB = 46, padT = 10, padR = 6;
  const bw = (w - padL - padR) / values.length;
  ctx.font = '9px sans-serif';
  values.forEach((v,i)=>{
    const bh = (h - padT - padB) * (v/max);
    const x = padL + i*bw + bw*0.15;
    const y = h - padB - bh;
    ctx.fillStyle = opts.colors ? opts.colors[i%opts.colors.length] : PALETTE[i%PALETTE.length];
    ctx.fillRect(x, y, bw*0.7, bh);
    ctx.save();
    ctx.translate(x+bw*0.35, h-padB+4);
    ctx.rotate(Math.PI/5);
    ctx.fillStyle = '#8fa0bd';
    ctx.textAlign = 'left';
    const lbl = (labels[i]||'').length>14 ? labels[i].slice(0,13)+'…' : labels[i];
    ctx.fillText(lbl, 0, 8);
    ctx.restore();
  });
}
function drawDonut(cv, labels, values, colors){
  const w = cv.clientWidth || 260, h = 190;
  const ctx = sizeCanvas(cv, w, h);
  ctx.clearRect(0,0,w,h);
  const total = values.reduce((a,b)=>a+b,0) || 1;
  const cx = 62, cy = h/2, rOut = 58, rIn = 34;
  let start = -Math.PI/2;
  values.forEach((v,i)=>{
    const ang = (v/total) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOut,start,start+ang);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += ang;
  });
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,rIn,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  let ly = 16;
  ctx.font = '10.5px sans-serif'; ctx.textAlign='left';
  labels.forEach((l,i)=>{
    ctx.fillStyle = colors[i%colors.length];
    ctx.fillRect(132, ly-8, 9, 9);
    ctx.fillStyle = '#c7d2e6';
    ctx.fillText(`${l}: ${values[i]}`, 146, ly);
    ly += 16;
  });
}
function drawLineChart(cv, labels, seriesList, opts){
  const w = cv.clientWidth || 340, h = 190;
  const ctx = sizeCanvas(cv, w, h);
  ctx.clearRect(0,0,w,h);
  const allVals = seriesList.flatMap(s=>s.data);
  const max = Math.max(1, ...allVals);
  const padL = 44, padB = 22, padT = 10, padR = 8;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  ctx.strokeStyle = '#22304a'; ctx.fillStyle = '#8fa0bd'; ctx.font='9px sans-serif';
  for(let g=0; g<=4; g++){
    const y = padT + plotH - (plotH*g/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText(fmtCompact(max*g/4), 2, y+3);
  }
  seriesList.forEach(s=>{
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
    s.data.forEach((v,i)=>{
      const x = padL + (plotW * (labels.length>1 ? i/(labels.length-1) : 0));
      const y = padT + plotH - (plotH * (v/max));
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
  ctx.fillStyle = '#8fa0bd'; ctx.textAlign='center';
  labels.forEach((l,i)=>{
    if(labels.length>14 && i%3!==0) return;
    const x = padL + (plotW * (labels.length>1 ? i/(labels.length-1) : 0));
    ctx.fillText(l, x, h-6);
  });
}
function fmtCompact(n){
  if(Math.abs(n)>=1000000) return (n/1000000).toFixed(1)+'M';
  if(Math.abs(n)>=1000) return (n/1000).toFixed(0)+'k';
  return String(Math.round(n));
}

function drawGroupedBar(cv, labels, valsA, valsB){
  const w = cv.clientWidth||320, h=190;
  const ctx = sizeCanvas(cv,w,h);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...valsA, ...valsB);
  const padL=4, padB=46, padT=10, padR=6;
  const bw = (w-padL-padR)/labels.length;
  labels.forEach((l,i)=>{
    const x = padL + i*bw;
    const hA = (h-padT-padB)*(valsA[i]/max), hB = (h-padT-padB)*(valsB[i]/max);
    ctx.fillStyle = '#33415c';
    ctx.fillRect(x+bw*0.1, h-padB-hA, bw*0.35, hA);
    ctx.fillStyle = '#3ecf8e';
    ctx.fillRect(x+bw*0.5, h-padB-hB, bw*0.35, hB);
    ctx.save(); ctx.translate(x+bw*0.4, h-padB+4); ctx.rotate(Math.PI/5);
    ctx.fillStyle='#8fa0bd'; ctx.font='9px sans-serif'; ctx.textAlign='left';
    ctx.fillText((l.length>13?l.slice(0,12)+'…':l), 0, 8);
    ctx.restore();
  });
}

function renderLancarBM(main){
  const p = document.createElement('div'); p.className='panel';
  p.innerHTML = `<h2>Lançar BM</h2><p class="hint">Lista de todos os subitens da medição. Selecione a BM ativa para lançar quantidade/valor medidos naquele boletim; os acumulados, saldos e status são recalculados automaticamente.</p>`;

  const bmRow = document.createElement('div'); bmRow.className='section-actions'; bmRow.style.alignItems='center';
  bmRow.innerHTML = `<label class="field" style="max-width:140px;">BM ativa
    <select id="activeBmSel">${Array.from({length:state.bmCount},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===state.activeBm?'selected':''}>BM ${n}</option>`).join('')}</select></label>
    <button class="btn sm" id="addBmBtn">+ Nova BM</button>
    <span class="hint">Total de BMs cadastrados: ${state.bmCount}</span>`;
  p.appendChild(bmRow);
  main.appendChild(p);

  const p2 = document.createElement('div'); p2.className='panel';
  const filterHolder = document.createElement('div');
  p2.appendChild(filterHolder);
  const bulkHolder = document.createElement('div');
  p2.appendChild(bulkHolder);
  const tableHolder = document.createElement('div');
  p2.appendChild(tableHolder);
  main.appendChild(p2);

  function getFiltered(){
    return applyFilters(state.medicaoItems, 'lancarbm', {statusField:'statusFaturamento'});
  }
  function draw(){
    filterHolder.innerHTML=''; filterHolder.appendChild(renderFilterBar('lancarbm', {disciplina:true, grupo:true, bm:true, status:true, statusOptions:['Não faturado','Em aprovação','Faturado aprovado']}, draw));
    const filtered = getFiltered();
    document.getElementById('filterCount_lancarbm').textContent = filtered.length + ' de ' + state.medicaoItems.length + ' itens';

    bulkHolder.innerHTML='';
    bulkHolder.appendChild(renderBulkBar('lancarbm', [
      {key:'qtdAprovada', label:'Qtd. aprovada'},
      {key:'valorAprovado', label:'Valor aprovado'},
    ], getFiltered, (row,field,before,after)=>{
      logDeviation(row, field, before, after);
      row.saldoValor = +((row.totalContrato||0)-row.valorMedido).toFixed(2);
    }));

    const activeBm = state.activeBm;
    const cols = [
      {key:'item', label:'Item', width:70},
      {key:'disciplina', label:'Disciplina', width:130, wrap:true},
      {key:'grupo', label:'Grupo', width:100},
      {key:'descricao', label:'Descrição', width:220, wrap:true},
      {key:'bmsMedidos', label:'BMs medidos', width:110, render:(r)=>(r.bmsMedidos||[]).join(', ')||'—'},
      {key:'unidade', label:'Un.', width:50},
      {key:'qtdContratada', label:'Qtd. contratada', type:'number', width:110, align:'num'},
      {key:'valorUnitario', label:'Valor unit.', type:'money', width:100, align:'num'},
      {key:'totalContrato', label:'Total contrato', type:'money', width:120, align:'num'},
      {key:'_bmQtd', label:`Qtd. medição (BM ${activeBm})`, width:130, render:(r)=>{
        const v = (r.bms&&r.bms[activeBm]) ? r.bms[activeBm].qtd : '';
        return `<input type="text" data-key="_bmQtd" value="${v===''?'':fmtNum(v)}" data-numeric="1">`;
      }},
      {key:'_bmVal', label:`Valor medição (BM ${activeBm})`, width:130, render:(r)=>{
        const v = (r.bms&&r.bms[activeBm]) ? r.bms[activeBm].valor : '';
        return `<input type="text" data-key="_bmVal" value="${v===''?'':fmtNum(v)}" data-numeric="1">`;
      }},
      {key:'qtdAcumulada', label:'Qtd. acumulada', type:'number', width:110, align:'num'},
      {key:'valorMedido', label:'Valor medido', type:'money', width:110, align:'num'},
      {key:'qtdAprovada', label:'Qtd. aprovada', type:'number', editable:true, width:110, align:'num'},
      {key:'valorAprovado', label:'Valor aprovado', type:'number', editable:true, width:120, align:'num'},
      {key:'statusFaturamento', label:'Status faturamento', editable:true, type:'select', options:['Não faturado','Em aprovação','Faturado aprovado'], width:150},
      {key:'saldoQtd', label:'Saldo qtd.', type:'number', width:100, align:'num'},
      {key:'saldoValor', label:'Saldo valor', type:'money', width:110, align:'num'},
      {key:'status', label:'Status', width:110, render:(r)=>statusTag(r.status)},
      {key:'_acoes', label:'Ações', width:90, render:(r)=>`<button class="btn sm good" data-act="aprovar">Aprovar</button>`},
    ];
    tableHolder.innerHTML = '';
    const tbl = renderTable('lancarBM', cols, filtered, {
      rowClass:(r)=> r.valorMedido> (r.totalContrato||0) ? 'risk' : '',
      onChange:(row,key,val)=>{
        if(key==='_bmQtd' || key==='_bmVal'){
          if(!row.bms) row.bms={};
          const cur = row.bms[activeBm] || {qtd:0,valor:0};
          if(key==='_bmQtd'){
            cur.qtd = val;
            if(!row._bmValManual || row._bmValManual!==activeBm) cur.valor = +(val*(row.valorUnitario||0)).toFixed(2);
          } else {
            cur.valor = val; row._bmValManual = activeBm;
          }
          if(cur.qtd===0 && cur.valor===0) delete row.bms[activeBm]; else row.bms[activeBm]=cur;
          recalcItem(row);
        } else if(key==='qtdAprovada'){
          logDeviation(row, 'Qtd. aprovada', row.qtdAprovada, val);
          row.qtdAprovada = val;
        } else if(key==='valorAprovado'){
          logDeviation(row, 'Valor aprovado', row.valorAprovado, val);
          row.valorAprovado = val;
        } else if(key==='statusFaturamento'){
          logDeviation(row, 'Status de faturamento', row.statusFaturamento, val);
          row.statusFaturamento = val;
        }
        recalcAll(); saveLocalDebounced(); renderKpiStrip();
        document.getElementById('filterCount_lancarbm').textContent = getFiltered().length + ' de ' + state.medicaoItems.length + ' itens';
      }
    });
    tbl.querySelector('tbody').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-act=aprovar]');
      if(!btn) return;
      const tr = e.target.closest('tr');
      const row = filtered.find(r=>String(r.id)===tr.dataset.rowId);
      const beforeQ = row.qtdAprovada, beforeV = row.valorAprovado, beforeS = row.statusFaturamento;
      row.qtdAprovada = row.qtdAcumulada;
      row.valorAprovado = row.valorMedido;
      row.statusFaturamento = 'Faturado aprovado';
      logDeviation(row, 'Qtd. aprovada', beforeQ, row.qtdAprovada);
      logDeviation(row, 'Valor aprovado', beforeV, row.valorAprovado);
      logDeviation(row, 'Status de faturamento', beforeS, row.statusFaturamento);
      recalcAll(); saveLocalDebounced(); draw(); renderKpiStrip();
      toast(`Item ${row.item} aprovado.`, 'ok');
    });
    tableHolder.appendChild(tbl);
  }
  draw();

  setTimeout(()=>{
    document.getElementById('activeBmSel').addEventListener('change', (e)=>{ state.activeBm = Number(e.target.value); saveLocalDebounced(); draw(); });
    document.getElementById('addBmBtn').addEventListener('click', ()=>{
      state.bmCount++;
      state.activeBm = state.bmCount;
      logHist('sistema', `Nova BM criada: BM ${state.bmCount}.`);
      saveLocalDebounced(); renderApp();
      toast(`BM ${state.bmCount} criada.`, 'ok');
    });
  },0);
}
function statusTag(s){
  const map = {'Concluído':'ok','Em andamento':'mid','Não iniciado':'no'};
  return `<span class="tag ${map[s]||'no'}">${s}</span>`;

    document.getElementById('lc_import').onclick = ()=>document.getElementById('lc_importFile').click();

    document.getElementById('lc_add').onclick = ()=>{
      const newId = 'manual_'+uid('c');
      state.custoItems.push({id:newId, item:'MAN-'+(state.custoItems.length+1), disciplina:state.disciplinas[0]||'', grupo:'', descricao:'Novo lançamento manual', unidade:'vb', metaCusto:0, custoRealizado:0, obs:''});
      logHist('custo', 'Novo lançamento manual de custo adicionado.');
      recalcAll(); saveLocalDebounced(); draw();
    };
  },0);
}

/* ---------------- HISTÓRICO ---------------- */
function renderHistorico(main){
  const p = document.createElement('div'); p.className='panel';
  p.innerHTML = `<h2>Histórico</h2><p class="hint">Histórico de desvios (alterações em BM, aprovação, faturamento e custo) e registro geral de importações/ações em massa.</p>`;
  const actions = document.createElement('div'); actions.className='section-actions';
  actions.innerHTML = `<button class="btn" id="h_clear">Limpar histórico</button><button class="btn" id="h_export">⬇ Exportar histórico (CSV)</button>`;
  p.appendChild(actions);
  main.appendChild(p);

  const p2 = document.createElement('div'); p2.className='panel';
  const filterHolder = document.createElement('div'); p2.appendChild(filterHolder);
  const tableHolder = document.createElement('div'); p2.appendChild(tableHolder);
  main.appendChild(p2);

  function draw(){
    const f = getFilterState('historico');
    let rows = state.historico.map((h,i)=>Object.assign({id:i}, h));
    if(f.status) rows = rows.filter(r=>r.tipo===f.status);
    if(f.search) rows = rows.filter(r=>normStr(r.texto).includes(normStr(f.search)));
    filterHolder.innerHTML='';
    filterHolder.appendChild(renderFilterBar('historico', {status:true, statusOptions:['desvio','massa','importacao','custo','supressao','sistema']}, draw));
    document.getElementById('filterCount_historico').textContent = rows.length + ' registros';

    const cols = [
      {key:'ts', label:'Data/Hora', width:150, render:(r)=>new Date(r.ts).toLocaleString('pt-BR')},
      {key:'tipo', label:'Tipo', width:100, render:(r)=>`<span class="tag ${r.tipo==='desvio'?'mid':(r.tipo==='sistema'?'no':'ok')}">${r.tipo}</span>`},
      {key:'texto', label:'Descrição', width:500, wrap:true},
    ];
    tableHolder.innerHTML='';
    tableHolder.appendChild(renderTable('historico', cols, rows));
  }
  draw();

  setTimeout(()=>{
    document.getElementById('h_clear').onclick = ()=>{
      if(!confirm('Limpar todo o histórico? Esta ação não pode ser desfeita.')) return;
      state.historico = [];
      logHist('sistema','Histórico limpo pelo usuário.');
      saveLocalDebounced(); draw();
    };
    document.getElementById('h_export').onclick = ()=>{
      const lines = ['Data;Tipo;Descrição', ...state.historico.map(h=>`${new Date(h.ts).toLocaleString('pt-BR')};${h.tipo};"${(h.texto||'').replace(/"/g,'""')}"`)];
      downloadFile('historico.csv', lines.join('\n'), 'text/csv;charset=utf-8');
    };
  },0);
}

/* =========================================================================
   IMPORTAÇÃO EXCEL (com mapeamento de colunas)
   ========================================================================= */
const FIELD_ALIASES = {
  medicao: {
    item: ['item','codigo','cod item','código'],
    disciplina: ['disciplina','especialidade'],
    grupo: ['grupo','subgrupo','categoria'],
    descricao: ['descricao','descrição','serviço','servico'],
    unidade: ['unidade','un','und'],
    qtdContratada: ['qtd contratada','quantidade contratada','qtd contrato','quant contratada'],
    valorUnitario: ['valor unitario','valor unitário','preco unitario','preço unitário','v unit','vl unitario'],
    total: ['total','total contrato','valor total','vl total'],
  },
  custo: {
    item: ['item','codigo','cod item','código'],
    disciplina: ['disciplina','especialidade'],
    grupo: ['grupo','subgrupo','categoria'],
    descricao: ['descricao','descrição','serviço','servico'],
    unidade: ['unidade','un','und'],
    metaCusto: ['meta de custo','custo meta','orcado','orçado','custo previsto','custo orcado'],
    custoRealizado: ['custo realizado','custo aplicado','realizado','custo real'],
  }
};
function bestMatch(header, aliases){
  const h = normStr(header);
  for(const a of aliases) if(h===normStr(a)) return true;
  for(const a of aliases) if(h.includes(normStr(a))) return true;
  return false;
}
function detectColumns(headers, kind){
  const map = {};
  const dict = FIELD_ALIASES[kind];
  Object.keys(dict).forEach(field=>{
    let found = headers.findIndex(h=>bestMatch(h, dict[field]));
    map[field] = found>-1 ? found : -1;
  });
  const bmCols = [];
  headers.forEach((h,idx)=>{
    const m = String(h).match(/BM\s*[\-\.]?\s*(\d+)/i);
    if(m){
      const isVal = /valor|vl\.?/i.test(h);
      bmCols.push({idx, bm:Number(m[1]), type: isVal?'valor':'qtd'});
    }
  });
  return {map, bmCols};
}
function handleExcelFile(file, kind){
  if(typeof XLSX === 'undefined'){ toast('Biblioteca de planilhas ainda carregando ou indisponível offline. Tente novamente em instantes.', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      if(!rows.length){ toast('Planilha vazia.', 'err'); return; }
      let headerRowIdx = 0;
      for(let i=0;i<Math.min(5,rows.length);i++){
        if(rows[i].filter(c=>String(c).trim()!=='').length >= 3){ headerRowIdx = i; break; }
      }
      const headers = rows[headerRowIdx].map(h=>String(h||'').trim());
      const dataRows = rows.slice(headerRowIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
      const detected = detectColumns(headers, kind);
      showImportMappingModal(file.name, kind, headers, detected, dataRows);
    }catch(err){
      toast('Erro ao ler o arquivo: '+err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}
function showImportMappingModal(filename, kind, headers, detected, dataRows){
  const root = document.getElementById('modalRoot');
  const dict = FIELD_ALIASES[kind];
  const fieldLabels = kind==='medicao'
    ? {item:'Item',disciplina:'Disciplina',grupo:'Grupo',descricao:'Descrição',unidade:'Unidade',qtdContratada:'Qtd. contratada',valorUnitario:'Valor unitário',total:'Total (contrato)'}
    : {item:'Item',disciplina:'Disciplina',grupo:'Grupo',descricao:'Descrição',unidade:'Unidade',metaCusto:'Meta de custo',custoRealizado:'Custo realizado'};

  const bg = document.createElement('div'); bg.className='modal-bg';
  const modal = document.createElement('div'); modal.className='modal';
  modal.innerHTML = `<h3>Mapear colunas — ${filename}</h3>
    <p class="hint">${dataRows.length} linhas detectadas. Confirme o mapeamento de colunas antes de importar. Itens já existentes (mesmo código "Item") serão atualizados; itens novos serão adicionados; itens ausentes no arquivo serão preservados.</p>
    <div id="mapRows"></div>
    ${kind==='medicao' ? `<p class="small-note" id="bmColsInfo"></p>` : ''}
    <div class="modal-actions">
      <button class="btn" id="mapCancel">Cancelar</button>
      <button class="btn primary" id="mapConfirm">Confirmar importação</button>
    </div>`;
  bg.appendChild(modal); root.appendChild(bg);

  const mapRows = modal.querySelector('#mapRows');
  const selects = {};
  Object.keys(fieldLabels).forEach(field=>{
    const row = document.createElement('div'); row.className='map-row';
    const label = document.createElement('div'); label.textContent = fieldLabels[field];
    const sel = document.createElement('select');
    sel.innerHTML = `<option value="-1">(não mapear)</option>` + headers.map((h,i)=>`<option value="${i}">${h||'(coluna '+(i+1)+')'}</option>`).join('');
    sel.value = detected.map[field] >= 0 ? detected.map[field] : -1;
    selects[field] = sel;
    row.appendChild(label); row.appendChild(sel);
    mapRows.appendChild(row);
  });
  if(kind==='medicao'){
    modal.querySelector('#bmColsInfo').textContent = detected.bmCols.length
      ? `Colunas de BM detectadas automaticamente: ${detected.bmCols.map(b=>'BM'+b.bm+'('+b.type+')').join(', ')}.`
      : 'Nenhuma coluna de BM detectada — apenas dados contratuais (item/qtd/valor/total) serão atualizados; a medição por BM pode ser lançada na aba Lançar BM.';
  }

  modal.querySelector('#mapCancel').onclick = ()=>bg.remove();
  modal.querySelector('#mapConfirm').onclick = ()=>{
    const finalMap = {};
    Object.keys(selects).forEach(f=> finalMap[f] = Number(selects[f].value));
    bg.remove();
    if(kind==='medicao') mergeMedicao(dataRows, finalMap, detected.bmCols, filename);
    else mergeCusto(dataRows, finalMap, filename);
  };
}
function rowVal(row, idx){ return idx>=0 ? row[idx] : undefined; }

function mergeMedicao(dataRows, map, bmCols, filename){
  let updated=0, added=0;
  const byItem = {};
  state.medicaoItems.forEach(it=>{ if(it.item) byItem[String(it.item)]=it; });
  dataRows.forEach((r,idx)=>{
    const itemCode = String(rowVal(r,map.item) ?? '').trim() || ('IMP-'+(idx+1));
    let it = byItem[itemCode];
    const isNew = !it;
    if(isNew){
      it = {id: uid('m'), item:itemCode, bms:{}, qtdAprovada:0, valorAprovado:0, statusFaturamento:'Não faturado'};
      state.medicaoItems.push(it);
      byItem[itemCode] = it;
      added++;
    } else updated++;
    if(map.disciplina>=0) it.disciplina = String(rowVal(r,map.disciplina)||it.disciplina||'').trim();
    if(map.grupo>=0) it.grupo = String(rowVal(r,map.grupo)||it.grupo||'').trim();
    if(map.descricao>=0) it.descricao = String(rowVal(r,map.descricao)||it.descricao||'').trim();
    if(map.unidade>=0) it.unidade = String(rowVal(r,map.unidade)||it.unidade||'').trim();
    if(map.qtdContratada>=0) it.qtdContratada = parseNumInput(rowVal(r,map.qtdContratada));
    if(map.valorUnitario>=0) it.valorUnitario = parseNumInput(rowVal(r,map.valorUnitario));
    if(map.total>=0) it.totalContrato = parseNumInput(rowVal(r,map.total));
    else if(it.qtdContratada!=null && it.valorUnitario!=null) it.totalContrato = +(it.qtdContratada*it.valorUnitario).toFixed(2);
    bmCols.forEach(bc=>{
      const v = parseNumInput(rowVal(r,bc.idx));
      if(!v) return;
      if(!it.bms[bc.bm]) it.bms[bc.bm] = {qtd:0,valor:0};
      if(bc.type==='valor') it.bms[bc.bm].valor = v; else it.bms[bc.bm].qtd = v;
      if(bc.type==='qtd' && !it.bms[bc.bm].valor) it.bms[bc.bm].valor = +(v*(it.valorUnitario||0)).toFixed(2);
    });
    if(!it.disciplina && state.disciplinas.length) it.disciplina = state.disciplinas[0];
    if(it.disciplina && !state.disciplinas.includes(it.disciplina)) state.disciplinas.push(it.disciplina);
    recalcItem(it);
  });
  const maxBm = bmCols.reduce((m,b)=>Math.max(m,b.bm), 0);
  if(maxBm > state.bmCount) state.bmCount = maxBm;
  state.lastImportMedicao = {when: nowStr(), updated, added};
  state.isSeed = false;
  logHist('importacao', `Importação MEDIÇÃO.xlsx ("${filename}"): ${updated} itens atualizados, ${added} novos, ${state.medicaoItems.length} no total.`);
  recalcAll(); saveLocalDebounced(); renderApp();
  toast(`Medição importada: ${updated} atualizados, ${added} novos.`, 'ok');
}
function mergeCusto(dataRows, map, filename){
  let updated=0, added=0;
  const byItem = {};
  state.custoItems.forEach(it=>{ if(it.item) byItem[String(it.item)]=it; });
  dataRows.forEach((r,idx)=>{
    const itemCode = String(rowVal(r,map.item) ?? '').trim() || ('IMP-'+(idx+1));
    let it = byItem[itemCode];
    const isNew = !it;
    if(isNew){
      it = {id: uid('c'), item:itemCode, obs:''};
      state.custoItems.push(it);
      byItem[itemCode] = it;
      added++;
    } else updated++;
    if(map.disciplina>=0) it.disciplina = String(rowVal(r,map.disciplina)||it.disciplina||'').trim();
    if(map.grupo>=0) it.grupo = String(rowVal(r,map.grupo)||it.grupo||'').trim();
    if(map.descricao>=0) it.descricao = String(rowVal(r,map.descricao)||it.descricao||'').trim();
    if(map.unidade>=0) it.unidade = String(rowVal(r,map.unidade)||it.unidade||'').trim();
    if(map.metaCusto>=0) it.metaCusto = parseNumInput(rowVal(r,map.metaCusto));
    if(map.custoRealizado>=0) it.custoRealizado = parseNumInput(rowVal(r,map.custoRealizado));
    if(it.disciplina && !state.disciplinas.includes(it.disciplina)) state.disciplinas.push(it.disciplina);
  });
  state.lastImportCusto = {when: nowStr(), updated, added};
  state.isSeed = false;
  logHist('importacao', `Importação CUSTO DO CONTRATO.xlsx ("${filename}"): ${updated} itens atualizados, ${added} novos, ${state.custoItems.length} no total.`);
  recalcAll(); saveLocalDebounced(); renderApp();
  toast(`Custo importado: ${updated} atualizados, ${added} novos.`, 'ok');
}

/* =========================================================================
   PDF (PDF.js local) + IA opcional (Anthropic)
   ========================================================================= */
function handlePdfFile(file){
  if(typeof pdfjsLib === 'undefined'){ toast('PDF.js ainda carregando ou indisponível offline. Tente novamente em instantes.', 'err'); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const pdf = await pdfjsLib.getDocument({data: e.target.result}).promise;
      let text = '';
      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        text += content.items.map(it=>it.str).join(' ') + '\n\n';
      }
      state.attachments.push({name:file.name, pages:pdf.numPages, text, when: nowStr()});
      logHist('sistema', `PDF "${file.name}" lido localmente via PDF.js (${pdf.numPages} páginas).`);
      saveLocalDebounced();
      toast(`PDF "${file.name}" lido (${pdf.numPages} páginas).`, 'ok');
      if(currentTab==='importar') renderApp();
    }catch(err){
      toast('Erro ao ler PDF: '+err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}
async function analyzePdfWithAI(attachment, resultEl){
  const key = (localStorage.getItem(LS_APIKEY)||'').trim();
  if(!key){ resultEl.textContent = 'Nenhuma chave de API informada — usando apenas leitura local (recurso de IA é opcional).'; return; }
  resultEl.textContent = 'Consultando IA...';
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens: 600,
        messages:[{role:'user', content:`Resuma os pontos principais deste documento de obra em português, em até 8 tópicos:\n\n${attachment.text.slice(0,12000)}`}]
      })
    });
    if(!resp.ok){
      const errBody = await resp.text();
      resultEl.textContent = `IA indisponível (${resp.status}). Usando leitura local do PDF apenas. Detalhe: ${errBody.slice(0,200)}`;
      return;
    }
    const data = await resp.json();
    const txt = (data.content||[]).map(c=>c.text).join('\n');
    resultEl.textContent = txt || 'Sem resposta da IA.';
  }catch(err){
    resultEl.textContent = 'IA indisponível (rede/CORS/crédito). Usando leitura local do PDF apenas. Detalhe: '+err.message;
  }
}

/* =========================================================================
   BACKUP / RESTAURAÇÃO / SALVAR HTML
   ========================================================================= */
function doBackupJson(){
  const data = JSON.stringify(state, null, 2);
  const stamp = new Date().toISOString().replace(/[:T]/g,'-').slice(0,16);
  downloadFile(`backup_controle_obra_${stamp}.json`, data, 'application/json');
  logHist('sistema','Backup JSON gerado.');
  saveLocalDebounced();
  toast('Backup JSON baixado.', 'ok');
}
function doRestoreJson(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.medicaoItems)){ toast('Arquivo JSON inválido para este app.', 'err'); return; }
      if(parsed.medicaoItems.length===0 && state.medicaoItems.length>0){
        if(!confirm('O backup selecionado está vazio (0 itens de medição) e a base atual possui '+state.medicaoItems.length+' itens. Restaurar mesmo assim e substituir a base atual?')) return;
      } else if(!confirm(`Restaurar backup com ${parsed.medicaoItems.length} itens de medição e ${(parsed.custoItems||[]).length} itens de custo? Isso substituirá os dados atuais no navegador.`)){
        return;
      }
      state = migrateState(parsed);
      logHist('sistema', 'Backup JSON restaurado pelo usuário.');
      recalcAll(); saveLocalDebounced(); renderApp();
      toast('Backup restaurado com sucesso.', 'ok');
    }catch(err){
      toast('Erro ao ler JSON: '+err.message, 'err');
    }
  };
  reader.readAsText(file);
}
function doSaveHtml(){
  try{
    const docClone = document.documentElement.cloneNode(true);
    const stateScript = docClone.querySelector('#embedded-state');
    stateScript.textContent = JSON.stringify(state);
    const html = '<!DOCTYPE html>\n' + docClone.outerHTML;
    const stamp = new Date().toISOString().replace(/[:T]/g,'-').slice(0,16);
    downloadFile(`controle_obra_${stamp}.html`, html, 'text/html');
    logHist('sistema','Cópia HTML autônoma exportada com os dados atuais embutidos.');
    saveLocalDebounced();
    toast('HTML salvo — publique este arquivo para atualizar a versão online.', 'ok');
  }catch(err){
    toast('Erro ao salvar HTML: '+err.message, 'err');
  }
}

/* =========================================================================
   TOOLBAR GLOBAL

document.getElementById('btnSaveLocal').onclick = ()=>persistLocal(false);
document.getElementById('btnBackupJson').onclick = doBackupJson;
document.getElementById('btnImportJsonTop').onclick = ()=>document.getElementById('fileJsonTop').click();

document.getElementById('btnSaveHtml').onclick = doSaveHtml;

/* =========================================================================
   INICIALIZAÇÃO
   ========================================================================= */
recalcAll();
renderApp();
window.addEventListener('beforeunload', ()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} });
</script>
