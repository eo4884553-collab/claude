  .tabs { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .card .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; font-weight: 600; }

  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }

  .cell-input {
    border: 1px solid transparent; background: transparent; font: inherit; color: var(--ink);
    width: 100%; min-width: 70px; padding: 3px 5px; border-radius: 5px; font-family: "IBM Plex Mono", monospace;

  .badge-cell.manual { color: var(--accent-ink); font-weight: 600; }

  .cell-input:disabled { color: var(--muted); cursor: default; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }

  .gantt-track { position: relative; height: 22px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; min-width: 220px; overflow: hidden; }
  .gantt-planned { position: absolute; top: 0; bottom: 0; background: var(--border); border-radius: 6px; }

  .gantt-actual.status-atrasado { background: var(--danger); }

  .gantt-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  .scurve-key { display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: 2px; border-radius: 2px; }

  .scurve-key.planned { background: var(--muted); }
  .scurve-key-sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }

  .scurve-wrap { position: relative; margin-top: 8px; }
  .scurve-svg { width: 100%; height: auto; display: block; touch-action: none; }
  .scurve-grid { stroke: var(--grid-line); stroke-width: 1; }
  .scurve-axis-label { font-size: 9.5px; fill: var(--muted); font-family: inherit; }
  .scurve-line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .scurve-line.executed { stroke: var(--accent); }
  .scurve-line.planned { stroke: var(--muted); }
  .scurve-dot { stroke: var(--surface); stroke-width: 2; }
  .scurve-dot.executed { fill: var(--accent); }
  .scurve-dot.planned { fill: var(--muted); }
  .scurve-hoje { stroke: var(--warn); stroke-width: 1.5; }
  .scurve-crosshair { stroke: var(--ink); stroke-opacity: 0.25; stroke-width: 1; }

  .scurve-tooltip {

  @media (max-width: 720px) {
    main#app { padding: 14px; }
    .titleblock { padding: 14px 14px 0 14px; }
  }
</style>

const STATE = JSON.parse(document.getElementById('state-data').textContent);

/* ==========================================================================
   Motor de cálculo (mesma lógica do app original — puro, sem dependências)
   ========================================================================== */
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function sum(arr, fn) { return arr.reduce((acc, item) => acc + (Number(fn(item)) || 0), 0); }
function monthKeyFromDateStr(dateStr) {
  if (!dateStr) return null;
  const d = String(dateStr).slice(0, 7);
  return /^\d{4}-\d{2}$/.test(d) ? d : null;
}
function addMonthsToKey(monthKey, n) {
  const [y, m] = monthKey.split('-').map(Number);
  const total = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(total / 12);
  const nm = (total % 12) + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}
const MONTH_LABEL = { '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril', '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto', '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro' };
function monthLabel(monthKey) {
  if (!monthKey) return 'Sem data';
  const [y, m] = monthKey.split('-');
  return `${MONTH_LABEL[m] || m}/${y}`;
}
function quinzenaFromDateStr(dateStr) {
  if (!dateStr) return null;
  const day = Number(String(dateStr).slice(8, 10));
  if (!day) return null;
  return day <= 15 ? 1 : 2;
}
function monthQuinzenaLabel(monthKey, quinzena) {
  if (!monthKey || monthKey === 'sem-data') return 'Sem data';
  const base = monthLabel(monthKey);
  return quinzena ? `${base} — ${quinzena}ª Parcela` : base;
}

function calcPercPrevisto(cronogramaPrevisto, dataRef) {
  if (!cronogramaPrevisto || !cronogramaPrevisto.inicio || !cronogramaPrevisto.termino) return 0;
  const inicio = new Date(cronogramaPrevisto.inicio + 'T00:00:00');
  const termino = new Date(cronogramaPrevisto.termino + 'T00:00:00');
  const ref = new Date(dataRef + 'T00:00:00');
  if (Number.isNaN(inicio.getTime()) || Number.isNaN(termino.getTime()) || Number.isNaN(ref.getTime())) return 0;
  if (ref <= inicio) return 0;
  if (ref >= termino) return 1;
  const totalMs = termino.getTime() - inicio.getTime();
  if (totalMs <= 0) return 1;
  return clamp((ref.getTime() - inicio.getTime()) / totalMs, 0, 1);
}

const ITEM_PLUG_REGEX = /m[ãa]o de obra/i;

function computeCategoria(cat, dataRef) {
  const valorOrcado = Number(cat.valorOrcado) || 0;
  const itensBrutos = cat.itens || [];
  const itemPlug = itensBrutos.find((it) => ITEM_PLUG_REGEX.test(it.descricao || ''));
  const somaOutrosItens = round2(sum(itensBrutos.filter((it) => it !== itemPlug), (it) => it.valorRealizado));
  const itensComPlug = itemPlug
    ? itensBrutos.map((it) => {
        if (it !== itemPlug) return it;
        const tetoPlug = Math.max(0, round2(valorOrcado - somaOutrosItens));
        const valorRealizadoOriginal = Number(it.valorRealizado) || 0;
        const valorRealizadoAjustado = Math.min(valorRealizadoOriginal, tetoPlug);
        return valorRealizadoAjustado === valorRealizadoOriginal
          ? it
          : { ...it, valorRealizado: valorRealizadoAjustado, valorRealizadoOriginal };
      })
    : itensBrutos;
  // Nota: itens individuais NÃO têm teto no seu próprio valorOrcado — um item
  // pode legitimamente custar mais do que a cotação inicial (ex.: "REGISTRO DO
  // LOTE" orçado em R$8.000 mas realizado em R$14.008,01, confirmado na planilha
  // original: 'Detalhamento F.C'!E16 soma os itens sem cap por linha). O teto de
  // medição "nunca mais que 100%" vale para a categoria como um todo — garantido
  // pelo item plug (que só encolhe, nunca infla) e pelo clamp de percAvancoEfetivo
  // logo abaixo — não para cada item isoladamente.
  const itens = itensComPlug;
  const valorRealizadoItens = round2(sum(itens, (it) => it.valorRealizado));
  const percAvancoItens = valorOrcado > 0 ? valorRealizadoItens / valorOrcado : 0;
  const temOverride = cat.percAvancoManual !== null && cat.percAvancoManual !== undefined;
  // Teto de medição: nunca mais que 100% da categoria como um todo.
  const percAvancoEfetivo = clamp(temOverride ? Number(cat.percAvancoManual) : percAvancoItens, 0, 1);
  const valorMedido = round2(valorOrcado * percAvancoEfetivo);
  const percPrevisto = calcPercPrevisto(cat.cronogramaPrevisto, dataRef);
  const valorPrevisto = round2(valorOrcado * percPrevisto);
  const statusCronograma = !cat.cronogramaPrevisto
    ? 'sem-dados'
    : percAvancoEfetivo >= 1
      ? 'concluido'
      : percAvancoEfetivo + 0.0001 >= percPrevisto
        ? 'no-prazo'
        : 'atrasado';
  const verbaCaixa = Number(cat.verbaCaixa) || 0;
  const caixaLiberadoAutoCategoria = round2(verbaCaixa * percAvancoEfetivo);
  const temOverrideCaixa = cat.liberadoCaixaManual !== null && cat.liberadoCaixaManual !== undefined;
  const caixaLiberadoCategoria = temOverrideCaixa ? round2(Number(cat.liberadoCaixaManual)) : caixaLiberadoAutoCategoria;
  return {
    ...cat,
    itens,
    valorRealizadoItens,
    percAvancoItens: round2(percAvancoItens * 10000) / 10000,
    percAvancoEfetivo: round2(percAvancoEfetivo * 10000) / 10000,
    origemPercAvanco: temOverride ? 'manual' : 'itens',
    valorMedido,
    saldoContratoCategoria: round2(valorOrcado - valorMedido),
    percPrevisto: round2(percPrevisto * 10000) / 10000,
    valorPrevisto,
    statusCronograma,
    verbaCaixa,
    caixaLiberadoAutoCategoria,
    caixaLiberadoCategoria,
    origemCaixaCategoria: temOverrideCaixa ? 'manual' : 'auto',
    saldoCaixaCategoria: round2(verbaCaixa - caixaLiberadoCategoria),
  };
}

// Recalcula cat.percAvancoManual a partir do avanço REALIZADO mais recente
// (por data) no histórico dessa categoria — avanços PLANEJADO não contam,
// igual à lógica de "parcela REALIZADO" em Contas a Pagar: um avanço fica
// visível e editável na aba Lançar Avanços, mas só passa a valer no % de
// avanço efetivo (e em tudo que depende dele — Execução financeira, Crédito
// CAIXA disponível etc.) quando confirmado como REALIZADO. Chamada sempre
// que um item do histórico é criado/editado/excluído/tem o status alterado.
// Se não houver nenhum avanço REALIZADO para a categoria (ex.: o único foi
// excluído), o valor atual de percAvancoManual é preservado — o % de obra
// não "volta atrás" para um estado sem histórico algum (ex.: os valores
// iniciais vindos da planilha, que não têm entrada correspondente aqui).
function recomputeCategoriaPercManual(categoria, historicoAvancos) {
  const realizados = (historicoAvancos || [])
    .filter((h) => h.categoriaId === categoria.id && h.status === 'REALIZADO')
    .sort((a, b) => (a.data || '').localeCompare(b.data || '') || (a.timestamp || '').localeCompare(b.timestamp || ''));
  if (realizados.length) {
    categoria.percAvancoManual = realizados[realizados.length - 1].percAvancoNovo;
  }
}

// Etapas do cronograma macro planejado (puramente informativo/planejamento —
// define o total de 1.5M e a curva "planejada"). O valor REALMENTE liberado
// pelo banco não segue esse cronograma por % de obra (confirmado contra a
// planilha original: o banco libera por medição mensal, em valores e datas
// que não batem com as 6 etapas) — é rastreado à parte em liberacoesCaixa.
function computeLiberacaoPCI(liberacaoPCI) {
  return [...liberacaoPCI].sort((a, b) => a.etapa - b.etapa);
}

function computeParcela(parcela) {
  const autoTotalATransferir = round2((Number(parcela.totalEmpreiteiroPix) || 0) + (Number(parcela.totalAdmPix) || 0));
  const autoCustoTotal = round2(autoTotalATransferir + (Number(parcela.gastoCartao) || 0) + (Number(parcela.parcelaEvolucaoCaixa) || 0));
  const overrides = parcela.overrides || {};

  const dataOcorrencia = parcela.vencimento || parcela.vencPlanejado || null;
  const mesReferencia = monthKeyFromDateStr(dataOcorrencia);
  const quinzena = quinzenaFromDateStr(dataOcorrencia);

  return {
    ...parcela,
    totalATransferir: overrides.totalATransferir ? Number(parcela.totalATransferir) : autoTotalATransferir,
    custoTotal: overrides.custoTotal ? Number(parcela.custoTotal) : autoCustoTotal,
    autoTotalATransferir, autoCustoTotal,
    mesReferencia,
    quinzena,
    mesReferenciaLabel: mesReferencia ? monthQuinzenaLabel(mesReferencia, quinzena || 1) : null,
  };
}

function recompute(state) {
  const dataRef = (state.meta && state.meta.dataReferenciaCronograma) || new Date().toISOString().slice(0, 10);
  const categoriasBase = (state.categorias || []).map((c) => computeCategoria(c, dataRef));
  const totalOrcadoCategorias = round2(sum(categoriasBase, (c) => c.valorOrcado));
  const totalMedido = round2(sum(categoriasBase, (c) => c.valorMedido));
  const totalPrevistoCronograma = round2(sum(categoriasBase, (c) => c.valorPrevisto));
  const percObraGeral = totalOrcadoCategorias > 0 ? totalMedido / totalOrcadoCategorias : 0;
  const percPrevistoGeral = totalOrcadoCategorias > 0 ? totalPrevistoCronograma / totalOrcadoCategorias : 0;
  const totalVerbaCaixaCategorias = round2(sum(categoriasBase, (c) => c.verbaCaixa));
  const totalCaixaLiberadoCategorias = round2(sum(categoriasBase, (c) => c.caixaLiberadoCategoria));

  // Peso de cada categoria sobre o orçado total — o "peso já estipulado" usado
  // para ratear o avanço lançado na aba Fluxo de Caixa em valor financeiro.
  const categorias = categoriasBase.map((c) => ({
    ...c,
    peso: totalOrcadoCategorias > 0 ? round2((c.valorOrcado / totalOrcadoCategorias) * 10000) / 10000 : 0,
  }));

  const liberacaoPCI = computeLiberacaoPCI(state.liberacaoPCI || []);
  const creditoCaixaTotalPCI = round2(sum(liberacaoPCI, (e) => e.valor));

  // Custo do lote já executado (taxas e projetos, financiados pelo CAIXA) — ver
  // definição completa mais abaixo, junto de gastoAcumuladoPLS; extraído aqui
  // primeiro porque "Valor caixa liberado" também depende dele.
  const custoLoteExecutado = Number((state.parametros || {}).custoLoteExecutado) || 0;

  // Liberações reais do CAIXA (medições mensais efetivamente pagas pelo banco,
  // lançadas manualmente conforme o extrato) — substitui o cronograma de
  // etapas como fonte de "quanto já foi liberado", somadas ao valor que o
  // CAIXA já passou para o lote — "Valor caixa liberado" = medições + lote.
  const liberacoesCaixa = [...(state.liberacoesCaixa || [])].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  // Só medições REALIZADO contam no valor efetivamente liberado (e em tudo que
  // depende dele — % caixa liberada, saldo caixa disponível, saldo de recurso
  // próprio auto) — mesma lógica de "parcela REALIZADO"/"avanço REALIZADO".
  // Entradas sem status (dados antigos) são tratadas como REALIZADO.
  const liberacoesCaixaRealizadas = liberacoesCaixa.filter((l) => l.status !== 'PLANEJADO');
  const caixaLiberadaAcumulada = round2(custoLoteExecutado + sum(liberacoesCaixaRealizadas, (l) => l.valor));

  const parcelas = (state.parcelas || []).map(computeParcela).sort((a, b) => {
    const da = a.vencimento || a.vencPlanejado || '';
    const db_ = b.vencimento || b.vencPlanejado || '';
    return da.localeCompare(db_);
  });

  const parcelasRealizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const totalEmpreiteiroPago = round2(sum(parcelasRealizadas, (p) => p.totalEmpreiteiroPix));
  const totalAdmPago = round2(sum(parcelasRealizadas, (p) => p.totalAdmPix));
  const totalCartaoPago = round2(sum(parcelasRealizadas, (p) => p.gastoCartao));
  const totalEvolucaoCaixaPago = round2(sum(parcelasRealizadas, (p) => p.parcelaEvolucaoCaixa));
  const totalPagoDiretoProprietario = round2(sum(categoriasBase.filter((c) => c.pagoDiretoProprietario), (c) => c.valorRealizadoItens));
  // "GASTO PLS + Provisão da Quizena" — mesma métrica da aba Contas a Pagar da
  // planilha original (célula C6 = 356168 + soma do "Custo Total" de cada
  // parcela já realizada, respeitando overrides já ajustados manualmente).
  const gastoAcumuladoPLS = round2(custoLoteExecutado + sum(parcelasRealizadas, (p) => p.custoTotal));
  const totalGastoAcumulado = round2(gastoAcumuladoPLS + totalPagoDiretoProprietario);
  const parcelasPlanejadas = parcelas.filter((p) => p.status !== 'REALIZADO');
  const totalEmpreiteiroPlanejado = round2(sum(parcelasPlanejadas, (p) => p.totalEmpreiteiroPix));
  const totalPlanejadoFuturo = round2(sum(parcelasPlanejadas, (p) => p.custoTotal));

  const parametros = state.parametros || {};
  const contratoTotalEmpreiteiro = Number(parametros.contratoTotalEmpreiteiro) || totalOrcadoCategorias;
  const recursoProprioPlanejado = Number(parametros.recursoProprioPlanejado) || 0;

  const totalConsumidoContrato = round2(totalEmpreiteiroPago + totalCartaoPago);
  const saldoAPagarEmpreiteiro = round2(totalMedido - totalConsumidoContrato);
  const saldoContratoRestante = round2(contratoTotalEmpreiteiro - totalMedido);
  const totalInvestidoDisponivel = round2(recursoProprioPlanejado + caixaLiberadaAcumulada);
  const saldoRecursoDisponivelAuto = round2(totalInvestidoDisponivel - totalGastoAcumulado);
  // "Saldo de Recurso Disponível" (F6 da planilha original) não é uma fórmula viva:
  // na planilha ela soma só o "Total a Transferir" das primeiras parcelas em que o
  // recurso próprio foi de fato usado (antes de a liberação do CAIXA começar a fluir)
  // — Maio/1ª, Maio/2ª, Junho/1ª — mais a entrada do lote e os serviços preliminares
  // pagos direto. Em vez de travar essa lista, o app deixa o proprietário lançar e
  // editar cada item que consumiu o recurso próprio (consumosRecursoProprio) —
  // o saldo é recalculado automaticamente como planejado menos a soma da lista.
  // Um valor manual único (saldoRecursoDisponivelManual) ainda tem prioridade sobre
  // tudo, para os casos em que nem a lista reflete o saldo real em conta.
  const consumosRecursoProprio = [...(state.consumosRecursoProprio || [])];
  const totalConsumoRecursoProprio = round2(sum(consumosRecursoProprio, (c) => c.valor));
  const saldoRecursoProprioPorItens = round2(recursoProprioPlanejado - totalConsumoRecursoProprio);
  const temOverrideSaldoRecurso = parametros.saldoRecursoDisponivelManual !== null && parametros.saldoRecursoDisponivelManual !== undefined;
  const temItensConsumoRecursoProprio = consumosRecursoProprio.length > 0;
  let saldoRecursoDisponivel;
  let origemSaldoRecurso;
  if (temOverrideSaldoRecurso) {
    saldoRecursoDisponivel = round2(Number(parametros.saldoRecursoDisponivelManual));
    origemSaldoRecurso = 'manual';
  } else if (temItensConsumoRecursoProprio) {
    saldoRecursoDisponivel = saldoRecursoProprioPorItens;
    origemSaldoRecurso = 'itens';
  } else {
    saldoRecursoDisponivel = saldoRecursoDisponivelAuto;
    origemSaldoRecurso = 'auto';
  }

  const sugestaoProximaParcelaEmpreiteiro = Math.max(0, saldoAPagarEmpreiteiro);
  const sugestaoProximaParcelaAdm = round2(sugestaoProximaParcelaEmpreiteiro * (Number(parametros.taxaAdministracaoPercent) || 0));

  const monthsMap = new Map();
  function bucket(monthKey, quinzena) {
    const q = monthKey === 'sem-data' ? null : (quinzena || 1);
    const key = monthKey === 'sem-data' ? 'sem-data' : `${monthKey}-Q${q}`;
    if (!monthsMap.has(key)) {
      monthsMap.set(key, { mes: monthKey, quinzena: q, label: monthQuinzenaLabel(monthKey, q), entradaRecursoProprio: 0, entradaCaixaPCI: 0, entradaAjusteManual: 0, saidaEmpreiteiroPix: 0, saidaAdmPix: 0, saidaCartao: 0, saidaAjusteManual: 0 });
    }
    return monthsMap.get(key);
  }
  const startMonthKey = monthKeyFromDateStr(state.meta?.dataInicio) || monthKeyFromDateStr(parcelas[0]?.vencimento) || 'sem-data';
  bucket(startMonthKey, 1).entradaRecursoProprio += recursoProprioPlanejado;
  for (const lib of liberacoesCaixa) {
    const mk = monthKeyFromDateStr(lib.data) || 'sem-data';
    bucket(mk, quinzenaFromDateStr(lib.data) || 1).entradaCaixaPCI += Number(lib.valor) || 0;
  }
  for (const p of parcelas) {
    const dataOcorrencia = p.vencimento || p.vencPlanejado || null;
    const mk = monthKeyFromDateStr(dataOcorrencia) || 'sem-data';
    const b = bucket(mk, quinzenaFromDateStr(dataOcorrencia));
    b.saidaEmpreiteiroPix += Number(p.totalEmpreiteiroPix) || 0;
    b.saidaAdmPix += Number(p.totalAdmPix) || 0;
    b.saidaCartao += Number(p.gastoCartao) || 0;
  }
  for (const ajuste of state.fluxoCaixaAjustes || []) {
    const mk = monthKeyFromDateStr(ajuste.data) || 'sem-data';
    const b = bucket(mk, quinzenaFromDateStr(ajuste.data));
    if (ajuste.tipo === 'entrada') b.entradaAjusteManual += Number(ajuste.valor) || 0;
    else b.saidaAjusteManual += Number(ajuste.valor) || 0;
  }
  const fluxoCaixaMensal = [...monthsMap.values()].sort((a, b) => {
    if (a.mes === 'sem-data') return 1;
    if (b.mes === 'sem-data') return -1;
    const c = a.mes.localeCompare(b.mes);
    return c !== 0 ? c : (a.quinzena || 0) - (b.quinzena || 0);
  }).map((b) => {
    const entradaTotal = round2(b.entradaRecursoProprio + b.entradaCaixaPCI + b.entradaAjusteManual);
    const saidaTotal = round2(b.saidaEmpreiteiroPix + b.saidaAdmPix + b.saidaCartao + b.saidaAjusteManual);
    return { ...b, entradaRecursoProprio: round2(b.entradaRecursoProprio), entradaCaixaPCI: round2(b.entradaCaixaPCI), entradaAjusteManual: round2(b.entradaAjusteManual), entradaTotal, saidaEmpreiteiroPix: round2(b.saidaEmpreiteiroPix), saidaAdmPix: round2(b.saidaAdmPix), saidaCartao: round2(b.saidaCartao), saidaAjusteManual: round2(b.saidaAjusteManual), saidaTotal };
  });
  let acumulado = 0;
  for (const m of fluxoCaixaMensal) { acumulado = round2(acumulado + m.entradaTotal - m.saidaTotal); m.saldoAcumuladoMes = acumulado; }

  const saldoCaixaDisponivel = round2(creditoCaixaTotalPCI - caixaLiberadaAcumulada);
  const verbaDisponivelFutura = round2(saldoCaixaDisponivel + saldoRecursoDisponivel);

  const resumo = {
    totalOrcadoCategorias, contratoTotalEmpreiteiro, totalMedido,
    percObraGeral: round2(percObraGeral * 10000) / 10000,
    totalPrevistoCronograma,
    percPrevistoGeral: round2(percPrevistoGeral * 10000) / 10000,
    dataReferenciaCronograma: dataRef,
    totalVerbaCaixaCategorias,
    totalCaixaLiberadoCategorias,
    creditoCaixaTotalPCI, caixaLiberadaAcumulada,
    percCaixaLiberada: creditoCaixaTotalPCI > 0 ? round2((caixaLiberadaAcumulada / creditoCaixaTotalPCI) * 10000) / 10000 : 0,
    recursoProprioPlanejado, totalInvestidoDisponivel,
    // % Execução financeira: mesma fórmula da aba "Contas a pagar"!I6 da planilha
    // original (=C6/(1500000+A6)) — usa GASTO PLS + Provisão da Quizena (C6) sobre
    // o total de financiamento disponível (crédito CAIXA total + recurso próprio).
    percExecucaoFinanceira: (creditoCaixaTotalPCI + recursoProprioPlanejado) > 0
      ? round2((gastoAcumuladoPLS / (creditoCaixaTotalPCI + recursoProprioPlanejado)) * 10000) / 10000
      : 0,
    totalEmpreiteiroPago, totalAdmPago, totalCartaoPago, totalEvolucaoCaixaPago, totalPagoDiretoProprietario,
    gastoAcumuladoPLS, totalGastoAcumulado, totalEmpreiteiroPlanejado,
    // "Crédito CAIXA disponível" (H6 da planilha) = crédito CAIXA total − gasto PLS.
    creditoCaixaDisponivelContabil: round2(creditoCaixaTotalPCI - gastoAcumuladoPLS),
    totalPlanejadoFuturo,
    saldoAPagarEmpreiteiro, saldoContratoRestante, saldoRecursoDisponivel,
    saldoRecursoDisponivelAuto,
    totalConsumoRecursoProprio,
    saldoRecursoProprioPorItens,
    origemSaldoRecurso,
    saldoCaixaDisponivel,
    totalConsumidoContrato,
    saldoContratoAPagarEmpreiteiro: round2(contratoTotalEmpreiteiro - totalConsumidoContrato),
    percValorTotalPago: contratoTotalEmpreiteiro > 0 ? round2((totalConsumidoContrato / contratoTotalEmpreiteiro) * 10000) / 10000 : 0,
    sugestaoProximaParcelaEmpreiteiro: round2(sugestaoProximaParcelaEmpreiteiro),
    sugestaoProximaParcelaAdm: round2(sugestaoProximaParcelaAdm),
    verbaDisponivelFutura,
    saldoParaFuturos: round2(verbaDisponivelFutura - totalPlanejadoFuturo),
  };

  return { meta: state.meta, parametros: state.parametros, categorias, liberacaoPCI, liberacoesCaixa, consumosRecursoProprio, parcelas, fluxoCaixaMensal, fluxoCaixaAjustes: state.fluxoCaixaAjustes || [], historicoAvancos: state.historicoAvancos || [], resumo, updatedAt: state.updatedAt };
}

/**
 * Reorganiza as parcelas PLANEJADAS para que o total (já realizado + ainda
 * planejado) do empreiteiro nunca ultrapasse o orçado do contrato
 * (parametros.contratoTotalEmpreiteiro). Só encolhe (nunca infla de volta)
 * e só mexe em totalEmpreiteiroPix/totalAdmPix — o cartão fica intocado.
 * Retorna um resumo do ajuste, ou `null` se nada precisou mudar. Muta
 * `state.parcelas` diretamente.
 */
function reorganizarPlanejamento(state, dataAjuste) {
  const parametros = state.parametros || {};
  const contratoTotalEmpreiteiro = Number(parametros.contratoTotalEmpreiteiro) || 0;
  if (!contratoTotalEmpreiteiro) return null;

  const parcelas = state.parcelas || [];
  const realizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const totalConsumidoRealizado = round2(sum(realizadas, (p) => (Number(p.totalEmpreiteiroPix) || 0) + (Number(p.gastoCartao) || 0)));
  const tetoRestante = Math.max(0, round2(contratoTotalEmpreiteiro - totalConsumidoRealizado));

  const planejadas = parcelas.filter((p) => p.status !== 'REALIZADO');
  const somaCartaoPlanejado = round2(sum(planejadas, (p) => p.gastoCartao));
  const tetoParaPix = Math.max(0, round2(tetoRestante - somaCartaoPlanejado));
  const somaPixPlanejado = round2(sum(planejadas, (p) => p.totalEmpreiteiroPix));

  if (somaPixPlanejado <= 0 || somaPixPlanejado <= tetoParaPix) return null;

  const fator = tetoParaPix / somaPixPlanejado;
  const taxaAdm = Number(parametros.taxaAdministracaoPercent) || 0;
  const data = dataAjuste || new Date().toISOString().slice(0, 10);
  const nota = `[Ajustado automaticamente em ${data} para caber no orçado restante do contrato]`;
  for (const p of planejadas) {
    p.totalEmpreiteiroPix = round2((Number(p.totalEmpreiteiroPix) || 0) * fator);
    p.totalAdmPix = round2((p.totalEmpreiteiroPix + (Number(p.gastoCartao) || 0)) * taxaAdm);
    if (p.overrides) { p.overrides.totalATransferir = false; p.overrides.custoTotal = false; }
    if (!p.obs || !p.obs.includes('[Ajustado automaticamente')) {
      p.obs = p.obs ? `${p.obs} ${nota}` : nota;
    }
  }
  return { fator: round2(fator * 10000) / 10000, tetoPlanejado: tetoParaPix, somaPlanejadoAnterior: somaPixPlanejado, qtd: planejadas.length };
}

</script>

<script>
'use strict';
/* Template bruto da página, capturado aqui — no início do ÚLTIMO <script> do
   documento — porque só neste ponto o parser já leu (e o DOM já contém) TODOS
   os blocos de script anteriores por inteiro; capturar mais cedo perderia o
   conteúdo dos scripts ainda não parseados. É a "fonte canônica" usada para
   publicar novas versões: nunca serializamos o DOM já renderizado, só
   trocamos o bloco de estado dentro deste template. */
const RAW_SHELL_HTML = document.documentElement.outerHTML;

function buildFullDocument(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const newTag = `<script id="state-data" type="application/json">${json}<\/script>`;
  const html = RAW_SHELL_HTML.replace(/<script id="state-data" type="application\/json">[\s\S]*?<\/script>/, newTag);
  return '<!doctype html>\n' + html;
}

/* ==========================================================================
   Estado de visualização, persistência (self-publish) e utilidades
   ========================================================================== */
let VIEW = recompute(STATE);
let ACTIVE_TAB = 'painel';
let PAINEL_CATEGORIA_SELECIONADA = null;
const OPEN_CATEGORIES = new Set();
// Filtro de quinzena selecionado em cada aba (persiste entre re-renders,
// {mes, quinzena} ou null = "Todas").
let FILTRO_QUINZENA_AVANCOS = null;
let FILTRO_QUINZENA_CRONOGRAMA = null;
let FILTRO_QUINZENA_FLUXO = null;
let FILTRO_QUINZENA_PCI = null;
let READONLY = false;
let saveTimer = null;
const SAVE_DEBOUNCE_MS = 1500;

const ARTIFACT_NS_PROMISE = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('artifact').catch(() => null)
  : Promise.resolve(null);

const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
function money(v) { return fmtBRL.format(Number(v) || 0); }
function pct(v) { return `${fmtNum.format((Number(v) || 0) * 100)}%`; }
function dateBR(iso) {
  if (!iso) return '—';
  const s = String(iso).slice(0, 10);
  const [y, m, d] = s.split('-');
  if (!y || !m || !d) return s;
  return `${d}/${m}/${y}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const MONTH_NAMES_PT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function mesParcelaLabel(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = String(dateStr).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return '';
  const quinzena = d <= 15 ? '1º' : '2º';
  return `${MONTH_NAMES_PT[m - 1].toUpperCase()}/${quinzena} PARCELA`;
}

// Rótulo "Mês/Ano — 1ª/2ª Parcela" a partir de um mês (YYYY-MM) + quinzena (1|2).
function mesQuinzenaLabel(mes, quinzena) {
  if (!mes) return 'Sem data';
  const [y, m] = mes.split('-');
  return `${MONTH_NAMES_PT[Number(m) - 1]}/${y} — ${quinzena}ª Parcela`;
}

// {mes, quinzena} a partir de uma data 'YYYY-MM-DD' (dia ≤15 = 1ª parcela).
function periodoFromDateStr(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = String(dateStr).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  return { mes: `${y}-${String(m).padStart(2, '0')}`, quinzena: d <= 15 ? 1 : 2 };
}

// Lista todos os períodos (mês/quinzena) entre o início da obra e a previsão de
// término, na mesma convenção de data usada nas parcelas reais (dia 10 = 1ª
// parcela, dia 25 = 2ª) — usada para o seletor de período em "Lançar Avanços".
function buildQuinzenaPeriods(dataInicio, previsaoTermino) {
  const out = [];
  if (!dataInicio) return out;
  let [y, m] = dataInicio.slice(0, 7).split('-').map(Number);
  const [yEnd, mEnd] = (previsaoTermino || dataInicio).slice(0, 7).split('-').map(Number);
  let guard = 0;
  while ((y < yEnd || (y === yEnd && m <= mEnd)) && guard < 120) {
    const mes = `${y}-${String(m).padStart(2, '0')}`;
    out.push({ mes, quinzena: 1, vencPlanejado: `${mes}-10`, label: mesQuinzenaLabel(mes, 1) });
    out.push({ mes, quinzena: 2, vencPlanejado: `${mes}-25`, label: mesQuinzenaLabel(mes, 2) });
    m += 1;
    if (m > 12) { m = 1; y += 1; }
    guard += 1;
  }
  return out;
}

// true se a data (YYYY-MM-DD) cair dentro da quinzena selecionada ({mes, quinzena}).
function dataNaQuinzena(dateStr, filtro) {
  if (!filtro) return true;
  const p = periodoFromDateStr(dateStr);
  return !!p && p.mes === filtro.mes && p.quinzena === filtro.quinzena;
}

// Seletor "Filtrar por quinzena" reutilizável nas abas Lançar Avanços,
// Cronograma de Obra, Fluxo de Caixa e Liberação PCI — filtra a tabela
// correspondente para mostrar só os lançamentos daquela quinzena exata.
function renderQuinzenaFilter({ periods, selected, onChange }) {
  const wrap = document.createElement('div');
  wrap.className = 'form-grid';
  wrap.style.maxWidth = '280px';
  wrap.style.marginBottom = '4px';
  wrap.innerHTML = `<label>Filtrar por quinzena
    <select class="cell-input">
      <option value="">Todas as quinzenas</option>
      ${periods.map((p) => `<option value="${p.mes}|${p.quinzena}">${esc(p.label)}</option>`).join('')}
    </select>
  </label>`;
  const select = wrap.querySelector('select');
  if (selected) select.value = `${selected.mes}|${selected.quinzena}`;
  select.addEventListener('change', () => {
    if (!select.value) { onChange(null); return; }
    const [mes, quinzena] = select.value.split('|');
    onChange({ mes, quinzena: Number(quinzena) });
  });
  return wrap;
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  el.classList.toggle('error', isError);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 3200);
}

// Mostra o toast do ajuste automático (parcelas planejadas reorganizadas para
// caber no orçado); retorna true se mostrou, para o chamador decidir se ainda
// quer mostrar sua própria mensagem de sucesso por cima.
function toastAjuste(ajuste) {
  if (!ajuste) return false;
  toast(`Ajuste automático: ${ajuste.qtd} parcela(s) planejada(s) reduzida(s) para caber no orçado restante do contrato (${money(ajuste.tetoPlanejado)}).`);
  return true;
}

function newId(prefix) {
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
  return `${prefix}-${rand}`;
}

function setStatus(kind) {
  const chip = document.getElementById('statusChip');
  const text = document.getElementById('statusChipText');
  if (!chip || !text) return;
  chip.className = `status-chip ${kind}`;
  const labels = { saving: 'Salvando…', saved: 'Sincronizado', error: 'Erro ao salvar', readonly: 'Somente leitura' };
  text.textContent = labels[kind] || kind;
}

function enterReadOnly() {
  if (READONLY) return;
  READONLY = true;
  const banner = document.getElementById('readonlyBanner');
  if (banner) banner.hidden = false;
  setStatus('readonly');
  renderAll();
}

function stashViewState() {
  try { sessionStorage.setItem('lc_viewState', JSON.stringify({ tab: ACTIVE_TAB, open: [...OPEN_CATEGORIES] })); } catch (e) { /* ignore */ }
}
function restoreViewState() {
  try {
    const raw = sessionStorage.getItem('lc_viewState');
    if (raw) {
      const v = JSON.parse(raw);
      if (v.tab) ACTIVE_TAB = v.tab;
      if (Array.isArray(v.open)) v.open.forEach((id) => OPEN_CATEGORIES.add(id));
      sessionStorage.removeItem('lc_viewState');
    }
  } catch (e) { /* ignore */ }
}

async function doSave() {
  const ns = await ARTIFACT_NS_PROMISE;
  if (!ns) { enterReadOnly(); return; }
  try {
    stashViewState();
    await ns.publish(buildFullDocument(STATE));
    // sucesso: a própria plataforma recarrega esta visão para a nova versão.
  } catch (e) {
    if (e && (e.code === 'not_writer' || e.code === 'not_granted')) {
      enterReadOnly();
    } else if (e && e.code === 'conflict') {
      // outra edição venceu; a visão já está sendo recarregada para ela.
    } else {
      setStatus('error');
      toast('Não foi possível salvar agora. Tentando novamente…', true);
      saveTimer = setTimeout(doSave, 4000);
    }
  }
}

function afterMutation() {
  STATE.updatedAt = new Date().toISOString();
  VIEW = recompute(STATE);
  renderAll();
  if (READONLY) return;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, SAVE_DEBOUNCE_MS);
}

/* ==========================================================================
   Mutadores de estado (equivalentes às rotas do backend original)
   ========================================================================== */
function updateMeta(patch) { Object.assign(STATE.meta, patch); afterMutation(); }
function updateParametros(patch) { Object.assign(STATE.parametros, patch); afterMutation(); }

function updateCategoria(id, patch) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  if (patch.nome !== undefined) cat.nome = patch.nome;
  if (patch.valorOrcado !== undefined) cat.valorOrcado = Number(patch.valorOrcado);
  if (patch.observacao !== undefined) cat.observacao = patch.observacao;
  if (patch.verbaCaixa !== undefined) cat.verbaCaixa = Number(patch.verbaCaixa);
  if (patch.liberadoCaixaManual !== undefined) cat.liberadoCaixaManual = patch.liberadoCaixaManual === null ? null : Number(patch.liberadoCaixaManual);
  if (patch.percAvancoManual !== undefined) {
    cat.percAvancoManual = patch.percAvancoManual === null ? null : Number(patch.percAvancoManual);
    cat.dataUltimoAvanco = new Date().toISOString().slice(0, 10);
  }
  afterMutation();
}

function lancarAvanco(id, { perc, data, obs }) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  const percAvancoAnterior = cat.percAvancoManual;
  cat.percAvancoManual = Number(perc);
  cat.dataUltimoAvanco = data || new Date().toISOString().slice(0, 10);
  if (obs !== undefined) cat.observacao = obs;
  STATE.historicoAvancos.unshift({
    id: newId('avanco'), categoriaId: cat.id, categoriaNome: cat.nome,
    percAvancoAnterior, percAvancoNovo: cat.percAvancoManual,
    data: cat.dataUltimoAvanco, obs: obs || '', timestamp: new Date().toISOString(),
  });
  afterMutation();
}

function limparAvancoManual(id) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  cat.percAvancoManual = null;
  afterMutation();
}

function addItem(catId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  cat.itens.push({
    id: newId('item'), descricao: patch.descricao || 'Novo item', unidade: patch.unidade || '',
    valorOrcado: Number(patch.valorOrcado) || 0, valorRealizado: Number(patch.valorRealizado) || 0,
    dataPagamento: patch.dataPagamento || null, formaPagamento: patch.formaPagamento || '',
  });
  afterMutation();
}

function updateItem(catId, itemId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  const item = cat.itens.find((i) => i.id === itemId); if (!item) return;
  if (patch.descricao !== undefined) item.descricao = patch.descricao;
  if (patch.unidade !== undefined) item.unidade = patch.unidade;
  if (patch.valorOrcado !== undefined) item.valorOrcado = Number(patch.valorOrcado);
  if (patch.valorRealizado !== undefined) item.valorRealizado = Number(patch.valorRealizado);
  if (patch.dataPagamento !== undefined) item.dataPagamento = patch.dataPagamento;
  if (patch.formaPagamento !== undefined) item.formaPagamento = patch.formaPagamento;
  afterMutation();
}

function addMonthsToDate(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function findOrCreateParcelaPorData(dataStr, labelSufixo) {
  const mesReferencia = monthKeyFromDateStr(dataStr);
  // Cartão é sempre pago na 1ª quinzena do mês da fatura (fechamento dia 05,
  // vencimento dia 15) — nunca cai na 2ª parcela, independentemente do dia
  // exato informado na compra.
  const quinzena = 1;
  let parcela = STATE.parcelas.find((p) => {
    const dataOcorrencia = p.vencimento || p.vencPlanejado || null;
    return monthKeyFromDateStr(dataOcorrencia) === mesReferencia && quinzenaFromDateStr(dataOcorrencia) === quinzena;
  });
  if (!parcela) {
    parcela = {
      id: newId('parcela'),
      label: `${monthQuinzenaLabel(mesReferencia, quinzena || 1)}${labelSufixo || ''}`,
      totalEmpreiteiroPix: 0, totalAdmPix: 0, gastoCartao: 0, totalATransferir: 0,
      parcelaEvolucaoCaixa: 0, custoTotal: 0,
      dataGeracaoCusto: dataStr, vencimento: null, vencPlanejado: dataStr,
      status: 'PLANEJADO', obs: '', overrides: {},
    };
    STATE.parcelas.push(parcela);
  }
  return parcela;
}

// Lança uma compra parcelada no cartão: cria N itens (um por parcela) no
// Detalhamento FC da categoria e soma automaticamente cada parcela na
// respectiva parcela de Contas a Pagar (mês/quinzena da fatura) — mesma lógica
// do endpoint /api/categorias/:id/compra-parcelada do app Node.
function lancarCompraParcelada(catId, b) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return null;
  const descricao = (b.descricao || 'Compra no cartão').trim();
  const valorTotal = round2(Number(b.valorTotal) || 0);
  const qtdParcelas = Math.max(1, Math.min(48, Math.round(Number(b.qtdParcelas) || 1)));
  const dataCompra = b.dataCompra || new Date().toISOString().slice(0, 10);
  const primeiraFatura = b.primeiraFatura || dataCompra;
  if (!valorTotal || valorTotal <= 0) { toast('Informe o valor total da compra.', true); return null; }

  const valorParcelaBase = round2(valorTotal / qtdParcelas);
  const parcelasAfetadas = [];
  for (let i = 0; i < qtdParcelas; i++) {
    const valorParcela = i === qtdParcelas - 1
      ? round2(valorTotal - valorParcelaBase * (qtdParcelas - 1))
      : valorParcelaBase;
    const dataFatura = addMonthsToDate(primeiraFatura, i);
    cat.itens.push({
      id: newId('item'),
      descricao: qtdParcelas > 1 ? `${descricao} (parcela ${i + 1}/${qtdParcelas})` : descricao,
      unidade: b.unidade || 'UNID',
      valorOrcado: 0,
      valorRealizado: valorParcela,
      dataPagamento: dataCompra,
      formaPagamento: `CARTÃO — fatura ${dataFatura.slice(0, 7)}`,
    });

    const parcela = findOrCreateParcelaPorData(dataFatura, ' (cartão)');
    parcela.gastoCartao = round2((Number(parcela.gastoCartao) || 0) + valorParcela);
    if (!parcela.overrides?.custoTotal) {
      parcela.custoTotal = round2((Number(parcela.totalEmpreiteiroPix) || 0) + (Number(parcela.totalAdmPix) || 0) + (Number(parcela.gastoCartao) || 0) + (Number(parcela.parcelaEvolucaoCaixa) || 0));
    }
    parcelasAfetadas.push({ id: parcela.id, label: parcela.label, valor: valorParcela });
  }
  afterMutation();
  return { qtdParcelas, valorTotal, parcelasAfetadas };
}

// Data "de calendário" de uma quinzena (mês/1ª ou 2ª parcela): dia 10 para a
// 1ª, dia 25 para a 2ª — bate com os vencimentos reais extraídos da planilha.
function dataQuinzena(mes, quinzena) { return `${mes}-${quinzena === 2 ? '25' : '10'}`; }

// Soma o gasto no cartão já lançado no Detalhamento FC para a fatura de um mês
// específico (formaPagamento com "CARTÃO — fatura YYYY-MM") — sugestão automática
// ao lançar o avanço de uma quinzena.
function sugestaoCartaoDoMes(mes) {
  let total = 0;
  for (const cat of STATE.categorias) {
    for (const it of cat.itens || []) {
      const m = /fatura\s+(\d{4}-\d{2})/i.exec(it.formaPagamento || '');
      if (m && m[1] === mes) total += Number(it.valorRealizado) || 0;
    }
  }
  return round2(total);
}

// Lançamento de avanço por quinzena (aba "Lançar Avanços"): 2 lançamentos por
// mês (1ª e 2ª parcela), cada um define o % acumulado de cada categoria que
// avançou naquela quinzena e gera automaticamente a parcela correspondente em
// Contas a Pagar. Cartão nunca é cobrado na 2ª quinzena (sempre pago na 1ª).
function lancamentoQuinzena(b) {
  const avancos = Array.isArray(b.avancos) ? b.avancos : [];
  if (!avancos.length) { toast('Informe o novo % de ao menos uma categoria.', true); return { ok: false }; }
  if (!/^\d{4}-\d{2}$/.test(b.mes || '')) { toast('Informe o mês (YYYY-MM).', true); return { ok: false }; }
  const quinzena = Number(b.quinzena) === 2 ? 2 : 1;
  const mes = b.mes;
  const vencPlanejado = dataQuinzena(mes, quinzena);

  let valorGeradoPeriodo = 0;
  const detalhes = [];

  for (const a of avancos) {
    const cat = STATE.categorias.find((c) => c.id === a.categoriaId);
    const novoPerc = Number(a.novoPerc);
    if (!cat || !Number.isFinite(novoPerc)) continue;
    const percAnteriorEfetivo = computeCategoria(cat).percAvancoEfetivo;
    if (Math.abs(novoPerc - percAnteriorEfetivo) < 0.0001) continue;

    const valorOrcado = Number(cat.valorOrcado) || 0;
    valorGeradoPeriodo += valorOrcado * (novoPerc - percAnteriorEfetivo);

    const percAvancoManualAnterior = cat.percAvancoManual;
    const statusAvanco = b.status === 'REALIZADO' ? 'REALIZADO' : 'PLANEJADO';
    // O avanço pertence à quinzena selecionada (vencPlanejado) — não à "data em
    // que o custo foi gerado" (dataGeracaoCusto), que é só um detalhe da parcela
    // de Contas a Pagar e por padrão vem preenchida com a data de hoje. Usar
    // dataGeracaoCusto aqui fazia o avanço "sumir" do filtro por quinzena sempre
    // que o usuário lançava um período retroativo sem trocar essa data.
    STATE.historicoAvancos.unshift({
      id: newId('avanco'), categoriaId: cat.id, categoriaNome: cat.nome,
      percAvancoAnterior: percAvancoManualAnterior, percAvancoNovo: novoPerc,
      data: vencPlanejado, status: statusAvanco, obs: b.obs || '', timestamp: new Date().toISOString(),
    });
    // Um avanço lançado como PLANEJADO fica registrado, mas só passa a
    // contar no % efetivo da categoria (e em tudo que depende dele) quando
    // confirmado como REALIZADO — ver recomputeCategoriaPercManual.
    if (statusAvanco === 'REALIZADO') cat.dataUltimoAvanco = vencPlanejado;
    recomputeCategoriaPercManual(cat, STATE.historicoAvancos);
    detalhes.push(`${cat.nome}: ${(percAnteriorEfetivo * 100).toFixed(1)}% → ${(novoPerc * 100).toFixed(1)}%`);
  }

  if (!detalhes.length) { toast('Nenhuma categoria teve o % alterado.', true); return { ok: false }; }

  valorGeradoPeriodo = round2(valorGeradoPeriodo);
  // Cartão sempre pago na 1ª quinzena — na 2ª, o gasto do cartão é sempre zero.
  const gastoCartao = quinzena === 2 ? 0 : round2(Number(b.gastoCartao) || 0);
  const taxaAdm = Number(STATE.parametros.taxaAdministracaoPercent) || 0;
  const totalEmpreiteiroPix = round2(Math.max(0, valorGeradoPeriodo - gastoCartao));
  // ADM (10%) incide sobre PIX + cartão juntos — o cartão também consome a verba
  // do empreiteiro, só muda o canal de pagamento.
  const totalAdmPix = round2((totalEmpreiteiroPix + gastoCartao) * taxaAdm);
  const obsAuto = `Avanço da quinzena (valor gerado: R$ ${valorGeradoPeriodo.toFixed(2)}) — ${detalhes.join('; ')}`;
  const label = monthQuinzenaLabel(mes, quinzena);

  STATE.parcelas.push({
    id: newId('parcela'), label,
    totalEmpreiteiroPix, totalAdmPix, gastoCartao,
    totalATransferir: round2(totalEmpreiteiroPix + totalAdmPix),
    parcelaEvolucaoCaixa: 0,
    custoTotal: round2(totalEmpreiteiroPix + totalAdmPix + gastoCartao),
    dataGeracaoCusto: b.dataGeracaoCusto || vencPlanejado,
    vencimento: b.status === 'REALIZADO' ? (b.vencimento || vencPlanejado) : null,
    vencPlanejado,
    status: b.status || 'PLANEJADO',
    obs: b.obs ? `${b.obs} — ${obsAuto}` : obsAuto,
    overrides: {},
  });
  let ajusteOcorreu = false;
  if ((b.status || 'PLANEJADO') === 'REALIZADO') {
    ajusteOcorreu = toastAjuste(reorganizarPlanejamento(STATE));
  }
  afterMutation();
  return { ok: true, ajusteOcorreu, label };
}

/* ==========================================================================
   Helpers de célula editável
   ========================================================================== */
function numberInput({ value, onSave, manual = false, step = '0.01', wide = false, min }) {
  const input = document.createElement('input');
  input.type = 'number';
  input.step = step;
  if (min !== undefined) input.min = min;
  input.value = value ?? 0;
  input.className = `cell-input${manual ? ' manual' : ''}${wide ? ' wide' : ''}`;
  const commit = () => { const v = input.value === '' ? 0 : Number(input.value); if (v !== value) onSave(v); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

// input de valor monetário: exibe formatado ("R$ 31.000,00") em repouso; ao
// focar, troca para edição em número simples com vírgula decimal (mais fácil
// de digitar), reformatando ao sair do campo.
function moneyInput({ value, onSave, manual = false, wide = false }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = `cell-input${manual ? ' manual' : ''}${wide ? ' wide' : ''}`;
  input.value = money(value);
  function parseMoneyText(s) {
    let cleaned = String(s).trim().replace(/^R\$\s*/i, '');
    if (!cleaned) return 0;
    if (/,\d{1,2}$/.test(cleaned)) cleaned = cleaned.replace(/\./g, '').replace(',', '.');
    else cleaned = cleaned.replace(/,/g, '');
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
  }
  input.addEventListener('focus', () => {
    input.value = (Number(value) || 0) === 0 ? '' : String(Number(value)).replace('.', ',');
    input.select();
  });
  const commit = () => {
    const v = parseMoneyText(input.value);
    input.value = money(v);
    if (v !== value) onSave(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

// Descrição curta da origem do "Saldo de recurso próprio disponível" — usada
// nos cards do Dashboard/Painel; 'itens' = calculado pela lista itemizada em
// Parâmetros, 'manual' = valor único forçado (avançado), 'auto' = cálculo
// simples de fallback (nenhuma lista lançada e nenhum manual).
function origemSaldoRecursoLabel(origem, r) {
  if (origem === 'manual') return 'Ajustado manualmente (ver Parâmetros → Avançado)';
  if (origem === 'itens') return `Recurso próprio − itens consumidos (ver Parâmetros): ${money(r.totalConsumoRecursoProprio)}`;
  return `Execução financeira − gasto acumulado (${money(r.totalGastoAcumulado)})`;
}

// input percentual: mostra "42,5%" em repouso; ao focar, edita em número
// simples (0-100), reformatando ao sair. Valor salvo/recebido é sempre
// fração (0-1), igual aos demais campos de percentual do app.
function percentInput({ value, onSave, wide = false }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = `cell-input${wide ? ' wide' : ''}`;
  input.value = pct(value);
  input.addEventListener('focus', () => {
    input.value = String(Math.round((Number(value) || 0) * 1000) / 10).replace('.', ',');
    input.select();
  });
  const commit = () => {
    const raw = input.value.trim().replace(',', '.');
    const n = Number(raw);
    const v = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) / 100 : 0;
    input.value = pct(v);
    if (v !== value) onSave(v);
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

function textInput({ value, onSave, wide = false }) {
  const input = document.createElement('input');
  input.type = 'text';

   TAB — Dashboard Executivo (curva S + seleção "o que pagar")
   ========================================================================== */
function calcPercPrevistoClient(cronogramaPrevisto, dataRef) {
  if (!cronogramaPrevisto || !cronogramaPrevisto.inicio || !cronogramaPrevisto.termino) return 0;
  const inicio = new Date(cronogramaPrevisto.inicio + 'T00:00:00');
  const termino = new Date(cronogramaPrevisto.termino + 'T00:00:00');
  const ref = new Date(dataRef + 'T00:00:00');
  if (Number.isNaN(inicio.getTime()) || Number.isNaN(termino.getTime()) || Number.isNaN(ref.getTime())) return 0;
  if (ref <= inicio) return 0;
  if (ref >= termino) return 1;
  const totalMs = termino.getTime() - inicio.getTime();
  if (totalMs <= 0) return 1;
  return Math.max(0, Math.min(1, (ref.getTime() - inicio.getTime()) / totalMs));
}

function addMonthsISO(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function buildMonthlyCheckpoints(startStr, endStr) {
  const out = [];
  let cur = startStr;
  let i = 0;
  while (cur < endStr && i < 60) {
    out.push(cur);
    i += 1;
    cur = addMonthsISO(startStr, i);
  }
  out.push(endStr);
  return out;
}

function buildCurvaEmpreiteiro(checkpoints) {
  const categorias = VIEW.categorias;
  const totalValue = VIEW.resumo.contratoTotalEmpreiteiro;

  const planned = checkpoints.map((cp) => {
    let total = 0;
    for (const c of categorias) {
      total += (Number(c.valorOrcado) || 0) * calcPercPrevistoClient(c.cronogramaPrevisto, cp);
    }
    return Math.round(total * 100) / 100;
  });

  const realizadas = VIEW.parcelas
    .filter((p) => p.status === 'REALIZADO')
    .map((p) => ({ data: (p.vencimento || p.vencPlanejado || '').slice(0, 10), valor: (Number(p.totalEmpreiteiroPix) || 0) + (Number(p.gastoCartao) || 0) }))
    .filter((p) => p.data)
    .sort((a, b) => a.data.localeCompare(b.data));

  let acc = 0;
  const executedRaw = realizadas.map((p) => { acc += p.valor; return { data: p.data, valor: Math.round(acc * 100) / 100 }; });

  const executed = checkpoints.map((cp) => {
    let last = 0;
    for (const e of executedRaw) { if (e.data <= cp) last = e.valor; else break; }
    return last;
  });

  return { checkpoints, planned, executed, executedRaw, totalValue };
}

function buildCurvaCaixa(checkpoints, dataInicio) {
  const totalValue = VIEW.resumo.creditoCaixaTotalPCI;
  const etapasComData = VIEW.liberacaoPCI.map((e) => ({
    data: addMonthsISO(dataInicio, Math.max(0, (Number(e.mesProgramado) || 1) - 1)),
    valor: Number(e.valor) || 0,
  }));

  const planned = checkpoints.map((cp) => {
    let total = 0;
    for (const e of etapasComData) if (e.data <= cp) total += e.valor;
    return Math.round(total * 100) / 100;
  });

  // Executado: acumulado real das liberações do CAIXA — começa com o valor que
  // o CAIXA já passou do lote (taxas e projetos, financiado junto com a
  // aquisição do lote, etapa 1 do PCI) e soma as medições mensais lançadas
  // pelo proprietário, na data real de cada uma. Esse total precisa bater com
  // "Valor caixa liberado" do resumo (resumo.caixaLiberadaAcumulada).
  const custoLoteExecutado = Number((VIEW.parametros || {}).custoLoteExecutado) || 0;
  const liberacoes = [...(VIEW.liberacoesCaixa || [])].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  let accLib = custoLoteExecutado;
  const executedRaw = custoLoteExecutado > 0
    ? [{ data: dataInicio, valor: Math.round(accLib * 100) / 100 }]
    : [];
  liberacoes.forEach((l) => { accLib += Number(l.valor) || 0; executedRaw.push({ data: l.data, valor: Math.round(accLib * 100) / 100 }); });
  const executed = checkpoints.map((cp) => {
    let last = 0;
    for (const e of executedRaw) { if (e.data <= cp) last = e.valor; else break; }
    return last;
  });

  return { checkpoints, planned, executed, executedRaw, totalValue };
}

function renderSCurveCard({ title, subtitle, curve, hojeStr }) {
  const card = document.createElement('div');
  card.className = 'panel scurve-card';

  const W = 720, H = 300, padL = 46, padR = 16, padT = 14, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = curve.checkpoints.length;
  const xAt = (i) => padL + (n > 1 ? (i / (n - 1)) * plotW : 0);
  const maxVal = Math.max(curve.totalValue, ...curve.planned, ...curve.executed) * 1.02 || 1;
  const yAt = (v) => padT + plotH - (v / maxVal) * plotH;

  const pathFrom = (arr) => arr.map((v, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  const plannedPath = pathFrom(curve.planned);
  const executedPath = pathFrom(curve.executed);
  const areaPath = `${executedPath} L${xAt(n - 1).toFixed(1)},${(padT + plotH).toFixed(1)} L${xAt(0).toFixed(1)},${(padT + plotH).toFixed(1)} Z`;

  const gridFracs = [0, 0.25, 0.5, 0.75, 1];
  const hojeIdx = curve.checkpoints.findIndex((cp) => cp >= hojeStr);
  const hojeI = hojeIdx === -1 ? n - 1 : hojeIdx;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'scurve-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `${title}: curva planejado x executado`);

  const gradId = `scurveFill-${title.replace(/\W+/g, '')}`;
  let defs = `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.16" />
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01" />
  </linearGradient></defs>`;

  let grid = '';
  for (const f of gridFracs) {
    const y = padT + plotH - f * plotH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" class="scurve-grid" />`;
    grid += `<text x="${padL - 8}" y="${(y + 3).toFixed(1)}" class="scurve-axis-label" text-anchor="end">${Math.round(f * 100)}%</text>`;
  }

  let xlabels = '';
  const step = Math.max(1, Math.round(n / 8));
  for (let i = 0; i < n; i += step) {
    const [y, m] = curve.checkpoints[i].split('-');
    xlabels += `<text x="${xAt(i).toFixed(1)}" y="${H - 10}" class="scurve-axis-label" text-anchor="middle">${MONTH_NAMES_PT[Number(m) - 1].slice(0, 3)}/${y.slice(2)}</text>`;
  }

  const hojeX = xAt(hojeI).toFixed(1);
  const hojeLine = `<line x1="${hojeX}" y1="${padT}" x2="${hojeX}" y2="${padT + plotH}" class="scurve-hoje" />`;

  const endPlanned = curve.planned[hojeI] ?? curve.planned[n - 1];
  const endExecuted = curve.executed[hojeI] ?? curve.executed[n - 1];

  svg.innerHTML = `
    ${defs}
    <g>${grid}</g>
    <path d="${areaPath}" fill="url(#${gradId})" stroke="none"></path>
    <path d="${plannedPath}" class="scurve-line planned"></path>
    <path d="${executedPath}" class="scurve-line executed"></path>
    ${hojeLine}
    <circle cx="${hojeX}" cy="${yAt(endExecuted).toFixed(1)}" r="4.5" class="scurve-dot executed"></circle>
    <circle cx="${hojeX}" cy="${yAt(endPlanned).toFixed(1)}" r="4.5" class="scurve-dot planned"></circle>
    <g>${xlabels}</g>
  `;

  const wrap = document.createElement('div');
  wrap.className = 'scurve-wrap';
  const tooltip = document.createElement('div');
  tooltip.className = 'scurve-tooltip';
  tooltip.hidden = true;
  wrap.appendChild(svg);
  wrap.appendChild(tooltip);

  const hitArea = document.createElementNS(svgNS, 'rect');
  hitArea.setAttribute('x', padL); hitArea.setAttribute('y', padT);
  hitArea.setAttribute('width', plotW); hitArea.setAttribute('height', plotH);
  hitArea.setAttribute('fill', 'transparent');
  svg.appendChild(hitArea);
  const crosshair = document.createElementNS(svgNS, 'line');
  crosshair.setAttribute('class', 'scurve-crosshair');
  crosshair.setAttribute('y1', padT); crosshair.setAttribute('y2', padT + plotH);
  crosshair.setAttribute('hidden', 'true');
  svg.appendChild(crosshair);

  const onMove = (evt) => {
    const rect = svg.getBoundingClientRect();
    const xFrac = (evt.clientX - rect.left) / rect.width;
    const xSvg = xFrac * W;
    let idx = Math.round(((xSvg - padL) / plotW) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    crosshair.removeAttribute('hidden');
    crosshair.setAttribute('x1', xAt(idx)); crosshair.setAttribute('x2', xAt(idx));
    const [y, m, d] = curve.checkpoints[idx].split('-');
    tooltip.hidden = false;
    tooltip.style.left = `${(xAt(idx) / W) * 100}%`;
    tooltip.innerHTML = `
      <div class="scurve-tooltip-date">${d}/${m}/${y}</div>
      <div class="scurve-tooltip-row"><span class="scurve-key executed"></span>Executado <strong>${money(curve.executed[idx])}</strong> (${pct(curve.totalValue > 0 ? curve.executed[idx] / curve.totalValue : 0)})</div>
      <div class="scurve-tooltip-row"><span class="scurve-key planned"></span>Planejado <strong>${money(curve.planned[idx])}</strong> (${pct(curve.totalValue > 0 ? curve.planned[idx] / curve.totalValue : 0)})</div>
    `;
  };
  const onLeave = () => { crosshair.setAttribute('hidden', 'true'); tooltip.hidden = true; };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerleave', onLeave);

  const gapVal = endExecuted - endPlanned;
  const gapPct = curve.totalValue > 0 ? gapVal / curve.totalValue : 0;

  card.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>${esc(title)}</h2>
        <div class="muted">${esc(subtitle)}</div>
      </div>
      <div class="scurve-legend">
        <span><span class="scurve-key executed"></span>Executado</span>
        <span><span class="scurve-key planned"></span>Planejado</span>
        <span class="scurve-key-sep"></span>
        <span>Hoje: <strong>${pct(curve.totalValue > 0 ? endExecuted / curve.totalValue : 0)}</strong> executado vs. <strong>${pct(curve.totalValue > 0 ? endPlanned / curve.totalValue : 0)}</strong> planejado</span>
      </div>
    </div>
  `;
  card.appendChild(wrap);

  const gapNote = document.createElement('div');
  gapNote.className = `scurve-gap-note ${gapVal >= 0 ? 'good' : 'warn'}`;
  gapNote.textContent = gapVal >= 0
    ? `Adiantado/em dia: ${money(gapVal)} acima do planejado até hoje (${pct(Math.abs(gapPct))}).`
    : `Atrasado: falta ${money(Math.abs(gapVal))} para alcançar o planejado até hoje (${pct(Math.abs(gapPct))}).`;
  card.appendChild(gapNote);

  const details = document.createElement('details');
  details.className = 'scurve-table-details';
  details.innerHTML = `<summary>Ver tabela de apoio (valores por mês)</summary>`;
  const tblWrap = document.createElement('div');
  tblWrap.className = 'table-scroll';
  tblWrap.innerHTML = `<table class="data"><thead><tr>
    <th>Mês</th><th class="num">Planejado</th><th class="num">Executado</th><th class="num">Diferença</th>
  </tr></thead><tbody>${curve.checkpoints.map((cp, i) => {
    const diff = curve.executed[i] - curve.planned[i];
    return `<tr><td>${dateBR(cp)}</td><td class="num">${money(curve.planned[i])}</td><td class="num">${money(curve.executed[i])}</td><td class="num">${diff >= 0 ? '+' : ''}${money(diff)}</td></tr>`;
  }).join('')}</tbody></table>`;
  details.appendChild(tblWrap);
  card.appendChild(details);

  return card;
}

function openNovaParcelaModal() {

  openModal('Nova parcela (Contas a Pagar)', (body, close) => {
    const form = document.createElement('form');
    form.className = 'form-grid';
    form.innerHTML = `
      <label>Rótulo (ex.: SETEMBRO/3º PARCELA)
        <input name="label" value="NOVA PARCELA" required />
      </label>
      <label>Total empreiteiro (PIX)

      </label>

      </label>

      </label>
      <label>Status

      </label>

        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Criar parcela</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;

    // Cartão é sempre pago na 1ª quinzena do mês — nunca na 2ª. Ao escolher a
    // data, detecta a quinzena e já sugere o valor de cartão lançado no
    // Detalhamento FC para aquele mês.
    const cartaoInput = form.querySelector('[name="gastoCartao"]');
    const vencField = form.querySelector('[name="vencPlanejado"]');
    vencField.addEventListener('change', () => {
      const p = periodoFromDateStr(vencField.value);
      if (!p) return;
      if (p.quinzena === 2) {
        cartaoInput.value = '0';
        cartaoInput.disabled = true;
        cartaoInput.title = 'Cartão é sempre pago na 1ª quinzena do mês — nunca na 2ª.';
      } else {
        cartaoInput.disabled = false;
        cartaoInput.title = '';
        cartaoInput.value = sugestaoCartaoDoMes(p.mes);
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      const ajusteOcorreu = addParcela(payload);
      close();
      if (!ajusteOcorreu) toast('Parcela criada.');
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.textContent = `Sugestão automática = medido até agora (${money(r.totalMedido)}) − já pago (${money(r.totalEmpreiteiroPago)}).`;
    body.appendChild(hint);
    body.appendChild(form);
  });
}

      <div>
        <h2>Histórico de avanços — planejados e realizados</h2>

      <button class="btn primary" id="btnNovoAvanco">+ Novo avanço</button>
    </div>
    <div class="quinzenaFilterSlot"></div>

  panel.querySelector('.quinzenaFilterSlot').appendChild(renderQuinzenaFilter({
    periods,
    selected: FILTRO_QUINZENA_AVANCOS,
    onChange: (v) => { FILTRO_QUINZENA_AVANCOS = v; renderAvancos(); },
  }));
  const wrap = panel.querySelector('.table-scroll');
  const entries = [...(STATE.historicoAvancos || [])]
    .filter((h) => dataNaQuinzena(h.data, FILTRO_QUINZENA_AVANCOS))

    wrap.innerHTML = `<div class="muted">${FILTRO_QUINZENA_AVANCOS ? 'Nenhum avanço lançado nessa quinzena.' : 'Nenhum avanço lançado ainda.'}</div>`;

    tbl.innerHTML = `<thead><tr>

      <th>Status</th><th class="wrap">Observação</th><th></th>
    </tr></thead><tbody></tbody>`;
    const tbody = tbl.querySelector('tbody');
    for (const h of entries) {
      const tr = document.createElement('tr');
      tr.appendChild(td(dateInput({ value: h.data, onSave: (v) => updateHistoricoAvanco(h.id, { data: v }) })));
      tr.appendChild(td(`<span class="wrap">${esc(h.categoriaNome)}</span>`));
      tr.appendChild(td(`<span class="num">${h.percAvancoAnterior == null ? '—' : pct(h.percAvancoAnterior)}</span>`));
      tr.appendChild(td(percentInput({ value: h.percAvancoNovo, onSave: (v) => updateHistoricoAvanco(h.id, { percAvancoNovo: v }) })));
      tr.appendChild(td(selectInput({
        value: h.status || 'REALIZADO',
        options: ['PLANEJADO', 'REALIZADO'],
        onSave: (v) => updateHistoricoAvanco(h.id, { status: v }),
      })));
      tr.appendChild(td(textInput({ value: h.obs, wide: true, onSave: (v) => updateHistoricoAvanco(h.id, { obs: v }) })));
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
      delBtn.onclick = () => { if (confirm(`Remover avanço de "${h.categoriaNome}"?`)) deleteHistoricoAvanco(h.id); };
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    }
    wrap.appendChild(tbl);
  }
  panel.querySelector('#btnNovoAvanco').onclick = () => openNovoAvancoModal();

const STATUS_CRONOGRAMA_INFO = {
  'concluido': { label: 'Concluído', badge: 'green' },
  'no-prazo': { label: 'No prazo', badge: 'accent' },
  'atrasado': { label: 'Atrasado', badge: 'red' },
  'sem-dados': { label: 'Sem cronograma', badge: 'gray' },
};

function clampPerc(v) {
  return Math.max(0, Math.min(1, v));
}

function renderCronograma() {
  const root = document.getElementById('tab-cronograma');
  root.innerHTML = '';
  const r = VIEW.resumo;

  const projInicio = new Date((VIEW.meta?.dataInicio || '2026-05-11') + 'T00:00:00');
  const projTermino = new Date((VIEW.meta?.previsaoTermino || '2027-08-14') + 'T00:00:00');
  const projTotalMs = Math.max(1, projTermino.getTime() - projInicio.getTime());
  const hojeDate = new Date((r.dataReferenciaCronograma || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
  const hojePerc = clampPerc((hojeDate.getTime() - projInicio.getTime()) / projTotalMs);

  const diasDecorridos = Math.round((hojeDate.getTime() - projInicio.getTime()) / 86400000);
  const diasTotais = Math.round(projTotalMs / 86400000);

  const etapaAtual = (VIEW.liberacaoPCI || []).find((e) => r.percObraGeral < e.percLimiteAcumulado)
    || VIEW.liberacaoPCI[VIEW.liberacaoPCI.length - 1];

  const cards = document.createElement('div');
  cards.className = 'cards-grid';
  cards.innerHTML = `
    <div class="card accent">
      <div class="card-label">% Executado (real)</div>
      <div class="card-value">${pct(r.percObraGeral)}</div>
      <div class="progress-bar" style="margin-top:6px"><span style="width:${Math.min(100, r.percObraGeral * 100)}%"></span></div>
      <div class="card-sub">Medido: ${money(r.totalMedido)} de ${money(r.totalOrcadoCategorias)}</div>
    </div>
    <div class="card ${r.percObraGeral + 0.0001 >= r.percPrevistoGeral ? 'good' : 'warn'}">
      <div class="card-label">% Previsto (cronograma)</div>
      <div class="card-value">${pct(r.percPrevistoGeral)}</div>
      <div class="progress-bar" style="margin-top:6px"><span style="width:${Math.min(100, r.percPrevistoGeral * 100)}%"></span></div>
      <div class="card-sub">${r.percObraGeral + 0.0001 >= r.percPrevistoGeral ? 'Obra no prazo ou adiantada' : `Obra atrasada em ${pct(r.percPrevistoGeral - r.percObraGeral)} vs. planejado`}</div>
    </div>
    <div class="card">
      <div class="card-label">Prazo decorrido</div>
      <div class="card-value">${diasDecorridos} / ${diasTotais} dias</div>
      <div class="card-sub">Início: ${dateBR(VIEW.meta?.dataInicio)} · Término previsto: ${dateBR(VIEW.meta?.previsaoTermino)}</div>
    </div>
    <div class="card">
      <div class="card-label">Etapa PCI corrente</div>
      <div class="card-value">${etapaAtual ? `${etapaAtual.etapa} — ${esc(etapaAtual.descricao)}` : '—'}</div>
      <div class="card-sub">${etapaAtual ? `Libera a ${pct(etapaAtual.percLimiteAcumulado)} de obra executada · ${money(etapaAtual.valor)}` : ''}</div>
    </div>
  `;
  root.appendChild(cards);

      </tr></thead>
      <tbody></tbody>
    </table></div>

  }));

  const tbody = panel.querySelector('tbody');

  if (!categoriasFiltradas.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="muted">Nenhuma categoria com avanço lançado nessa quinzena.</td></tr>';
  }
  for (const c of categoriasFiltradas) {
    const tr = document.createElement('tr');
    tr.appendChild(td(`${c.numero}`));
    tr.appendChild(td(`<span class="wrap">${esc(c.nome)}</span>`));
    tr.appendChild(td(c.cronogramaPrevisto ? dateBR(c.cronogramaPrevisto.inicio) : '—'));
    tr.appendChild(td(c.cronogramaPrevisto ? dateBR(c.cronogramaPrevisto.termino) : '—'));
    tr.appendChild(td(`<span class="num">${c.cronogramaPrevisto ? c.cronogramaPrevisto.duracaoDias : '—'}</span>`));
    tr.appendChild(td(`<span class="num">${pct(c.percPrevisto)}</span>`));

    tr.appendChild(td(`<span class="num badge-cell ${c.origemPercAvanco === 'manual' ? 'manual' : 'auto'}">${pct(c.percAvancoEfetivo)}</span>`));

    const info = STATUS_CRONOGRAMA_INFO[c.statusCronograma] || STATUS_CRONOGRAMA_INFO['sem-dados'];
    tr.appendChild(td(`<span class="badge ${info.badge}">${info.label}</span>`));

    const ganttTd = document.createElement('td');
    if (c.cronogramaPrevisto) {
      const ini = new Date(c.cronogramaPrevisto.inicio + 'T00:00:00');
      const fim = new Date(c.cronogramaPrevisto.termino + 'T00:00:00');
      const barStart = clampPerc((ini.getTime() - projInicio.getTime()) / projTotalMs);
      const barEnd = clampPerc((fim.getTime() - projInicio.getTime()) / projTotalMs);
      const barWidth = Math.max(0.6, (barEnd - barStart) * 100);
      const actualWidth = Math.min(100, c.percAvancoEfetivo * 100);
      const statusClass = c.statusCronograma === 'atrasado' ? 'status-atrasado' : c.statusCronograma === 'concluido' ? 'status-concluido' : '';
      ganttTd.innerHTML = `
        <div class="gantt-track">
          <div class="gantt-planned" style="left:${barStart * 100}%; width:${barWidth}%"></div>
          <div class="gantt-actual ${statusClass}" style="left:${barStart * 100}%; width:${(barWidth * actualWidth) / 100}%"></div>
          <div class="gantt-hoje" style="left:${hojePerc * 100}%"></div>
        </div>`;
    } else {
      ganttTd.innerHTML = '<span class="muted">Sem datas na planilha</span>';
    }
    tr.appendChild(ganttTd);
    tbody.appendChild(tr);
  }
}

/* ==========================================================================

// Gasto no cartão por mês/quinzena — mesma fonte e agrupamento do campo
// "Cartão" em Contas a Pagar (parcela.gastoCartao + mesReferenciaLabel), não
// recalculado a partir dos itens: garante que bate exatamente com o extrato
// do cartão (fechamento dia 05, sempre lançado na 1ª quinzena do mês — por
// isso toda linha "2º PARCELA" aparece com R$ 0,00, igual à fatura real).
function renderGastoCartaoMensal() {
  const rows = [...VIEW.parcelas]
    .filter((p) => p.mesReferenciaLabel)
    .sort((a, b) => (a.vencimento || a.vencPlanejado || '').localeCompare(b.vencimento || b.vencPlanejado || ''));
  const totalGeral = rows.reduce((a, p) => a + (Number(p.gastoCartao) || 0), 0);
  const details = document.createElement('details');
  details.className = 'scurve-table-details';
  details.innerHTML = `<summary>Ver gasto no cartão por quinzena (${money(totalGeral)} no total)</summary>`;
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  if (!rows.length) {
    wrap.innerHTML = '<div class="muted" style="padding:8px 0">Nenhuma parcela lançada ainda.</div>';
  } else {
    wrap.innerHTML = `<table class="data"><thead><tr><th>Mês</th><th class="num">Gasto do cartão</th></tr></thead><tbody>${rows.map((p) => `
      <tr><td>${esc(p.mesReferenciaLabel)}</td><td class="num">${money(p.gastoCartao)}</td></tr>
    `).join('')}</tbody></table>`;
  }
  details.appendChild(wrap);
  return details;
}
