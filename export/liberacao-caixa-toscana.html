<style>

    --muted: #8fa2b8;

  .titleblock-row {

function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
function sum(arr, fn) { return arr.reduce((acc, item) => acc + (Number(fn(item)) || 0), 0); }
function monthKeyFromDateStr(dateStr) {
  if (!dateStr) return null;
  const d = String(dateStr).slice(0, 7);
  return /^\d{4}-\d{2}$/.test(d) ? d : null;
}
function addMonthsToKey(monthKey, n) {
  const [y, m] = monthKey.split('-').map(Number);
  const total = (y * 12 + (m - 1)) + n;
  const ny = Math.floor(total / 12);
  const nm = (total % 12) + 1;
  return `${ny}-${String(nm).padStart(2, '0')}`;
}

  const valorMedido = round2(valorOrcado * percAvancoEfetivo);
  return {
    ...cat,
    valorRealizadoItens,
    percAvancoItens: round2(percAvancoItens * 10000) / 10000,
    percAvancoEfetivo: round2(percAvancoEfetivo * 10000) / 10000,
    origemPercAvanco: temOverride ? 'manual' : 'itens',
    valorMedido,
    saldoContratoCategoria: round2(valorOrcado - valorMedido),
  };
}

function computeLiberacaoPCI(liberacaoPCI, percObraGeral) {
  const etapas = [...liberacaoPCI].sort((a, b) => a.etapa - b.etapa);
  return etapas.map((etapa, idx) => {
    const valor = Number(etapa.valor) || 0;
    const limiteSuperior = Number(etapa.percLimiteAcumulado) || 0;
    const limiteInferior = idx === 0 ? 0 : Number(etapas[idx - 1].percLimiteAcumulado) || 0;
    let fracaoAuto;
    if (etapa.etapa === 1) {
      fracaoAuto = percObraGeral > 0 ? 1 : 0;
    } else {
      const faixa = limiteSuperior - limiteInferior;
      fracaoAuto = faixa > 0 ? clamp((percObraGeral - limiteInferior) / faixa, 0, 1) : 0;
    }
    const valorLiberadoAuto = round2(valor * fracaoAuto);
    const temOverride = etapa.liberadoManual !== null && etapa.liberadoManual !== undefined;
    const valorLiberado = temOverride ? round2(Number(etapa.liberadoManual)) : valorLiberadoAuto;
    return {
      ...etapa, limiteInferior, valorLiberadoAuto, valorLiberado,
      origemLiberado: temOverride ? 'manual' : 'auto',
      percLiberado: valor > 0 ? round2((valorLiberado / valor) * 10000) / 10000 : 0,
    };
  });
}

function computeParcela(parcela) {
  const autoTotalATransferir = round2((Number(parcela.totalEmpreiteiroPix) || 0) + (Number(parcela.totalAdmPix) || 0));
  const autoCustoTotal = round2(autoTotalATransferir + (Number(parcela.gastoCartao) || 0) + (Number(parcela.parcelaEvolucaoCaixa) || 0));
  const overrides = parcela.overrides || {};
  return {
    ...parcela,
    totalATransferir: overrides.totalATransferir ? Number(parcela.totalATransferir) : autoTotalATransferir,
    custoTotal: overrides.custoTotal ? Number(parcela.custoTotal) : autoCustoTotal,
    autoTotalATransferir, autoCustoTotal,
  };
}

function recompute(state) {
  const categorias = (state.categorias || []).map(computeCategoria);
  const totalOrcadoCategorias = round2(sum(categorias, (c) => c.valorOrcado));
  const totalMedido = round2(sum(categorias, (c) => c.valorMedido));
  const percObraGeral = totalOrcadoCategorias > 0 ? totalMedido / totalOrcadoCategorias : 0;

  const liberacaoPCI = computeLiberacaoPCI(state.liberacaoPCI || [], percObraGeral);
  const caixaLiberadaAcumulada = round2(sum(liberacaoPCI, (e) => e.valorLiberado));
  const creditoCaixaTotalPCI = round2(sum(liberacaoPCI, (e) => e.valor));

  const parcelas = (state.parcelas || []).map(computeParcela).sort((a, b) => {
    const da = a.vencimento || a.vencPlanejado || '';
    const db_ = b.vencimento || b.vencPlanejado || '';
    return da.localeCompare(db_);
  });

  const parcelasRealizadas = parcelas.filter((p) => p.status === 'REALIZADO');
  const totalEmpreiteiroPago = round2(sum(parcelasRealizadas, (p) => p.totalEmpreiteiroPix));
  const totalAdmPago = round2(sum(parcelasRealizadas, (p) => p.totalAdmPix));
  const totalCartaoPago = round2(sum(parcelasRealizadas, (p) => p.gastoCartao));
  const totalEvolucaoCaixaPago = round2(sum(parcelasRealizadas, (p) => p.parcelaEvolucaoCaixa));
  const totalGastoAcumulado = round2(totalEmpreiteiroPago + totalAdmPago + totalCartaoPago);
  const totalEmpreiteiroPlanejado = round2(sum(parcelas.filter((p) => p.status !== 'REALIZADO'), (p) => p.totalEmpreiteiroPix));

  const parametros = state.parametros || {};
  const contratoTotalEmpreiteiro = Number(parametros.contratoTotalEmpreiteiro) || totalOrcadoCategorias;
  const recursoProprioPlanejado = Number(parametros.recursoProprioPlanejado) || 0;

  const saldoAPagarEmpreiteiro = round2(totalMedido - totalEmpreiteiroPago);
  const saldoContratoRestante = round2(contratoTotalEmpreiteiro - totalMedido);
  const totalInvestidoDisponivel = round2(recursoProprioPlanejado + caixaLiberadaAcumulada);
  const saldoRecursoDisponivel = round2(totalInvestidoDisponivel - totalGastoAcumulado);

  const sugestaoProximaParcelaEmpreiteiro = Math.max(0, saldoAPagarEmpreiteiro);
  const sugestaoProximaParcelaAdm = round2(sugestaoProximaParcelaEmpreiteiro * (Number(parametros.taxaAdministracaoPercent) || 0));

  const monthsMap = new Map();
  function bucket(monthKey) {
    if (!monthsMap.has(monthKey)) {
      monthsMap.set(monthKey, { mes: monthKey, label: monthLabel(monthKey), entradaRecursoProprio: 0, entradaCaixaPCI: 0, entradaAjusteManual: 0, saidaEmpreiteiroPix: 0, saidaAdmPix: 0, saidaCartao: 0, saidaAjusteManual: 0 });
    }
    return monthsMap.get(monthKey);
  }
  const startMonthKey = monthKeyFromDateStr(state.meta?.dataInicio) || monthKeyFromDateStr(parcelas[0]?.vencimento) || 'sem-data';
  bucket(startMonthKey).entradaRecursoProprio += recursoProprioPlanejado;
  for (const etapa of liberacaoPCI) {
    if (!etapa.valorLiberado) continue;
    const mk = startMonthKey === 'sem-data' ? 'sem-data' : addMonthsToKey(startMonthKey, (Number(etapa.mesProgramado) || 1) - 1);
    bucket(mk).entradaCaixaPCI += etapa.valorLiberado;
  }
  for (const p of parcelas) {
    const mk = monthKeyFromDateStr(p.vencimento) || monthKeyFromDateStr(p.vencPlanejado) || 'sem-data';
    const b = bucket(mk);
    b.saidaEmpreiteiroPix += Number(p.totalEmpreiteiroPix) || 0;
    b.saidaAdmPix += Number(p.totalAdmPix) || 0;
    b.saidaCartao += Number(p.gastoCartao) || 0;
  }
  for (const ajuste of state.fluxoCaixaAjustes || []) {
    const mk = monthKeyFromDateStr(ajuste.data) || 'sem-data';
    const b = bucket(mk);
    if (ajuste.tipo === 'entrada') b.entradaAjusteManual += Number(ajuste.valor) || 0;
    else b.saidaAjusteManual += Number(ajuste.valor) || 0;
  }
  const fluxoCaixaMensal = [...monthsMap.values()].sort((a, b) => (a.mes || '').localeCompare(b.mes || '')).map((b) => {
    const entradaTotal = round2(b.entradaRecursoProprio + b.entradaCaixaPCI + b.entradaAjusteManual);
    const saidaTotal = round2(b.saidaEmpreiteiroPix + b.saidaAdmPix + b.saidaCartao + b.saidaAjusteManual);
    return { ...b, entradaRecursoProprio: round2(b.entradaRecursoProprio), entradaCaixaPCI: round2(b.entradaCaixaPCI), entradaAjusteManual: round2(b.entradaAjusteManual), entradaTotal, saidaEmpreiteiroPix: round2(b.saidaEmpreiteiroPix), saidaAdmPix: round2(b.saidaAdmPix), saidaCartao: round2(b.saidaCartao), saidaAjusteManual: round2(b.saidaAjusteManual), saidaTotal };
  });
  let acumulado = 0;
  for (const m of fluxoCaixaMensal) { acumulado = round2(acumulado + m.entradaTotal - m.saidaTotal); m.saldoAcumuladoMes = acumulado; }

  const resumo = {
    totalOrcadoCategorias, contratoTotalEmpreiteiro, totalMedido,
    percObraGeral: round2(percObraGeral * 10000) / 10000,
    creditoCaixaTotalPCI, caixaLiberadaAcumulada,
    percCaixaLiberada: creditoCaixaTotalPCI > 0 ? round2((caixaLiberadaAcumulada / creditoCaixaTotalPCI) * 10000) / 10000 : 0,
    recursoProprioPlanejado, totalInvestidoDisponivel,
    totalEmpreiteiroPago, totalAdmPago, totalCartaoPago, totalEvolucaoCaixaPago, totalGastoAcumulado, totalEmpreiteiroPlanejado,
    saldoAPagarEmpreiteiro, saldoContratoRestante, saldoRecursoDisponivel,
    percValorTotalPago: contratoTotalEmpreiteiro > 0 ? round2((totalEmpreiteiroPago / contratoTotalEmpreiteiro) * 10000) / 10000 : 0,
    sugestaoProximaParcelaEmpreiteiro: round2(sugestaoProximaParcelaEmpreiteiro),
    sugestaoProximaParcelaAdm: round2(sugestaoProximaParcelaAdm),
  };

  return { meta: state.meta, parametros: state.parametros, categorias, liberacaoPCI, parcelas, fluxoCaixaMensal, fluxoCaixaAjustes: state.fluxoCaixaAjustes || [], historicoAvancos: state.historicoAvancos || [], resumo, updatedAt: state.updatedAt };
}

</script>

<script>
'use strict';
/* Template bruto da página, capturado aqui — no início do ÚLTIMO <script> do
   documento — porque só neste ponto o parser já leu (e o DOM já contém) TODOS
   os blocos de script anteriores por inteiro; capturar mais cedo perderia o
   conteúdo dos scripts ainda não parseados. É a "fonte canônica" usada para
   publicar novas versões: nunca serializamos o DOM já renderizado, só
   trocamos o bloco de estado dentro deste template. */
const RAW_SHELL_HTML = document.documentElement.outerHTML;

function buildFullDocument(state) {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const newTag = `<script id="state-data" type="application/json">${json}<\/script>`;
  const html = RAW_SHELL_HTML.replace(/<script id="state-data" type="application\/json">[\s\S]*?<\/script>/, newTag);
  return '<!doctype html>\n' + html;
}

/* ==========================================================================
   Estado de visualização, persistência (self-publish) e utilidades
   ========================================================================== */
let VIEW = recompute(STATE);
let ACTIVE_TAB = 'dashboard';
const OPEN_CATEGORIES = new Set();
let READONLY = false;
let saveTimer = null;
const SAVE_DEBOUNCE_MS = 1500;

const ARTIFACT_NS_PROMISE = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('artifact').catch(() => null)
  : Promise.resolve(null);

const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
function money(v) { return fmtBRL.format(Number(v) || 0); }
function pct(v) { return `${fmtNum.format((Number(v) || 0) * 100)}%`; }
function dateBR(iso) {
  if (!iso) return '—';
  const s = String(iso).slice(0, 10);
  const [y, m, d] = s.split('-');
  if (!y || !m || !d) return s;
  return `${d}/${m}/${y}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  el.classList.toggle('error', isError);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 3200);
}

function newId(prefix) {
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
  return `${prefix}-${rand}`;
}

function setStatus(kind) {
  const chip = document.getElementById('statusChip');
  const text = document.getElementById('statusChipText');
  if (!chip || !text) return;
  chip.className = `status-chip ${kind}`;
  const labels = { saving: 'Salvando…', saved: 'Sincronizado', error: 'Erro ao salvar', readonly: 'Somente leitura' };
  text.textContent = labels[kind] || kind;
}

function enterReadOnly() {
  if (READONLY) return;
  READONLY = true;
  const banner = document.getElementById('readonlyBanner');
  if (banner) banner.hidden = false;
  setStatus('readonly');
  renderAll();
}

function stashViewState() {
  try { sessionStorage.setItem('lc_viewState', JSON.stringify({ tab: ACTIVE_TAB, open: [...OPEN_CATEGORIES] })); } catch (e) { /* ignore */ }
}
function restoreViewState() {
  try {
    const raw = sessionStorage.getItem('lc_viewState');
    if (raw) {
      const v = JSON.parse(raw);
      if (v.tab) ACTIVE_TAB = v.tab;
      if (Array.isArray(v.open)) v.open.forEach((id) => OPEN_CATEGORIES.add(id));
      sessionStorage.removeItem('lc_viewState');
    }
  } catch (e) { /* ignore */ }
}

async function doSave() {
  const ns = await ARTIFACT_NS_PROMISE;
  if (!ns) { enterReadOnly(); return; }
  try {
    stashViewState();
    await ns.publish(buildFullDocument(STATE));
    // sucesso: a própria plataforma recarrega esta visão para a nova versão.
  } catch (e) {
    if (e && (e.code === 'not_writer' || e.code === 'not_granted')) {
      enterReadOnly();
    } else if (e && e.code === 'conflict') {
      // outra edição venceu; a visão já está sendo recarregada para ela.
    } else {
      setStatus('error');
      toast('Não foi possível salvar agora. Tentando novamente…', true);
      saveTimer = setTimeout(doSave, 4000);
    }
  }
}

function afterMutation() {
  STATE.updatedAt = new Date().toISOString();
  VIEW = recompute(STATE);
  renderAll();
  if (READONLY) return;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, SAVE_DEBOUNCE_MS);
}

/* ==========================================================================
   Mutadores de estado (equivalentes às rotas do backend original)
   ========================================================================== */
function updateMeta(patch) { Object.assign(STATE.meta, patch); afterMutation(); }
function updateParametros(patch) { Object.assign(STATE.parametros, patch); afterMutation(); }

function updateCategoria(id, patch) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  if (patch.nome !== undefined) cat.nome = patch.nome;
  if (patch.valorOrcado !== undefined) cat.valorOrcado = Number(patch.valorOrcado);
  if (patch.observacao !== undefined) cat.observacao = patch.observacao;
  if (patch.percAvancoManual !== undefined) {
    cat.percAvancoManual = patch.percAvancoManual === null ? null : Number(patch.percAvancoManual);
    cat.dataUltimoAvanco = new Date().toISOString().slice(0, 10);
  }
  afterMutation();
}

function lancarAvanco(id, { perc, data, obs }) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  const percAvancoAnterior = cat.percAvancoManual;
  cat.percAvancoManual = Number(perc);
  cat.dataUltimoAvanco = data || new Date().toISOString().slice(0, 10);
  if (obs !== undefined) cat.observacao = obs;
  STATE.historicoAvancos.unshift({
    id: newId('avanco'), categoriaId: cat.id, categoriaNome: cat.nome,
    percAvancoAnterior, percAvancoNovo: cat.percAvancoManual,
    data: cat.dataUltimoAvanco, obs: obs || '', timestamp: new Date().toISOString(),
  });
  afterMutation();
}

function limparAvancoManual(id) {
  const cat = STATE.categorias.find((c) => c.id === id); if (!cat) return;
  cat.percAvancoManual = null;
  afterMutation();
}

function addItem(catId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  cat.itens.push({
    id: newId('item'), descricao: patch.descricao || 'Novo item', unidade: patch.unidade || '',
    valorOrcado: Number(patch.valorOrcado) || 0, valorRealizado: Number(patch.valorRealizado) || 0,
    dataPagamento: patch.dataPagamento || null, formaPagamento: patch.formaPagamento || '',
  });
  afterMutation();
}

function updateItem(catId, itemId, patch) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  const item = cat.itens.find((i) => i.id === itemId); if (!item) return;
  if (patch.descricao !== undefined) item.descricao = patch.descricao;
  if (patch.unidade !== undefined) item.unidade = patch.unidade;
  if (patch.valorOrcado !== undefined) item.valorOrcado = Number(patch.valorOrcado);
  if (patch.valorRealizado !== undefined) item.valorRealizado = Number(patch.valorRealizado);
  if (patch.dataPagamento !== undefined) item.dataPagamento = patch.dataPagamento;
  if (patch.formaPagamento !== undefined) item.formaPagamento = patch.formaPagamento;
  afterMutation();
}

function deleteItem(catId, itemId) {
  const cat = STATE.categorias.find((c) => c.id === catId); if (!cat) return;
  cat.itens = cat.itens.filter((i) => i.id !== itemId);
  afterMutation();
}

function updateLiberacaoPCI(etapaNum, patch) {
  const etapa = STATE.liberacaoPCI.find((e) => e.etapa === etapaNum); if (!etapa) return;
  if (patch.descricao !== undefined) etapa.descricao = patch.descricao;
  if (patch.valor !== undefined) etapa.valor = Number(patch.valor);
  if (patch.percLimiteAcumulado !== undefined) etapa.percLimiteAcumulado = Number(patch.percLimiteAcumulado);
  if (patch.mesProgramado !== undefined) etapa.mesProgramado = Number(patch.mesProgramado);
  if (patch.liberadoManual !== undefined) etapa.liberadoManual = patch.liberadoManual === null ? null : Number(patch.liberadoManual);
  afterMutation();
}

function addParcela(patch) {
  STATE.parcelas.push({
    id: newId('parcela'), label: patch.label || 'NOVA PARCELA',
    totalEmpreiteiroPix: Number(patch.totalEmpreiteiroPix) || 0, totalAdmPix: Number(patch.totalAdmPix) || 0,
    gastoCartao: Number(patch.gastoCartao) || 0, totalATransferir: Number(patch.totalATransferir) || 0,
    parcelaEvolucaoCaixa: Number(patch.parcelaEvolucaoCaixa) || 0, custoTotal: Number(patch.custoTotal) || 0,
    vencimento: patch.vencimento || null, vencPlanejado: patch.vencPlanejado || null,
    status: patch.status || 'PLANEJADO', obs: patch.obs || '', overrides: {},
  });
  afterMutation();
}

function updateParcela(id, patch) {
  const p = STATE.parcelas.find((x) => x.id === id); if (!p) return;
  const fields = ['label', 'totalEmpreiteiroPix', 'totalAdmPix', 'gastoCartao', 'parcelaEvolucaoCaixa', 'vencimento', 'vencPlanejado', 'status', 'obs'];
  for (const f of fields) if (patch[f] !== undefined) p[f] = patch[f];
  if (patch.totalATransferir !== undefined) { p.totalATransferir = Number(patch.totalATransferir); p.overrides.totalATransferir = true; }
  if (patch.custoTotal !== undefined) { p.custoTotal = Number(patch.custoTotal); p.overrides.custoTotal = true; }
  afterMutation();
}

function deleteParcela(id) { STATE.parcelas = STATE.parcelas.filter((p) => p.id !== id); afterMutation(); }

function addAjuste(patch) {
  STATE.fluxoCaixaAjustes.push({
    id: newId('ajuste'), data: patch.data || new Date().toISOString().slice(0, 10),
    tipo: patch.tipo === 'entrada' ? 'entrada' : 'saida', valor: Number(patch.valor) || 0, descricao: patch.descricao || '',
  });
  afterMutation();
}
function deleteAjuste(id) { STATE.fluxoCaixaAjustes = STATE.fluxoCaixaAjustes.filter((a) => a.id !== id); afterMutation(); }

function resetToSeed() {
  const fresh = JSON.parse(JSON.stringify(ORIGINAL_SEED));
  Object.keys(STATE).forEach((k) => delete STATE[k]);
  Object.assign(STATE, fresh);
  afterMutation();
}

/* ==========================================================================
   Navegação por abas
   ========================================================================== */
function setupTabs() {
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    ACTIVE_TAB = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-panel').forEach((p) => { p.hidden = p.id !== `tab-${ACTIVE_TAB}`; });
  });
}

function renderAll() {
  document.getElementById('obraNome').textContent = VIEW.meta?.obra || 'Obra';
  const metaEl = document.getElementById('obraMeta');
  metaEl.innerHTML = [
    VIEW.meta?.endereco ? `<span>${esc(VIEW.meta.endereco)}</span>` : '',
    VIEW.meta?.proprietario ? `<span><strong>Proprietário:</strong> ${esc(VIEW.meta.proprietario)}</span>` : '',
    VIEW.meta?.responsavelTecnico ? `<span><strong>Resp. técnico:</strong> ${esc(VIEW.meta.responsavelTecnico)}</span>` : '',
    VIEW.meta?.areaM2 ? `<span><strong>Área:</strong> ${VIEW.meta.areaM2} m²</span>` : '',
  ].filter(Boolean).join('');

  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === ACTIVE_TAB));
  document.querySelectorAll('.tab-panel').forEach((p) => { p.hidden = p.id !== `tab-${ACTIVE_TAB}`; });

  renderDashboard();
  renderAvancos();
  renderDetalhamento();
  renderFluxo();
  renderPCI();
  renderParametros();

  if (READONLY) {
    document.querySelectorAll('#app input, #app select, #app textarea, #app button').forEach((el) => { el.disabled = true; });
  }
}

/* ==========================================================================
   Helpers de célula editável
   ========================================================================== */
function numberInput({ value, onSave, manual = false, step = '0.01', wide = false, min }) {
  const input = document.createElement('input');
  input.type = 'number';
  input.step = step;
  if (min !== undefined) input.min = min;
  input.value = value ?? 0;
  input.className = `cell-input${manual ? ' manual' : ''}${wide ? ' wide' : ''}`;
  const commit = () => { const v = input.value === '' ? 0 : Number(input.value); if (v !== value) onSave(v); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

function textInput({ value, onSave, wide = false }) {
  const input = document.createElement('input');
  input.type = 'text';
  input.value = value ?? '';
  input.className = `cell-input${wide ? ' wide' : ''}`;
  const commit = () => { if (input.value !== value) onSave(input.value); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  return input;
}

function dateInput({ value, onSave }) {
  const input = document.createElement('input');
  input.type = 'date';
  input.value = value ? String(value).slice(0, 10) : '';
  input.className = 'cell-input';
  const commit = () => { if (input.value !== value) onSave(input.value || null); };
  input.addEventListener('change', commit);
  return input;
}

function selectInput({ value, options, onSave }) {
  const select = document.createElement('select');
  select.className = 'cell-input';
  for (const opt of options) {
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt;
    if (opt === value) o.selected = true;
    select.appendChild(o);
  }
  select.addEventListener('change', () => onSave(select.value));
  return select;
}

function td(el) {
  const cell = document.createElement('td');
  if (el instanceof Node) cell.appendChild(el); else cell.innerHTML = el;
  return cell;
}

/* ==========================================================================
   TAB 1 — Dashboard "Contas a Pagar" (visão do cliente)
   ========================================================================== */
function renderDashboard() {
  const root = document.getElementById('tab-dashboard');
  const r = VIEW.resumo;
  root.innerHTML = '';

  const cards = document.createElement('div');
  cards.className = 'cards-grid';
  cards.innerHTML = `
    <div class="card accent">
      <div class="card-label">Contrato total empreiteiro</div>
      <div class="card-value">${money(r.contratoTotalEmpreiteiro)}</div>
      <div class="card-sub">Executado (medido): ${money(r.totalMedido)} · ${pct(r.percObraGeral)}</div>
    </div>
    <div class="card good">
      <div class="card-label">Pago ao empreiteiro (realizado)</div>
      <div class="card-value">${money(r.totalEmpreiteiroPago)}</div>
      <div class="card-sub">${pct(r.percValorTotalPago)} do contrato · Saldo a pagar: ${money(r.saldoAPagarEmpreiteiro)}</div>
    </div>
    <div class="card accent">
      <div class="card-label">Crédito Caixa (PCI) liberado</div>
      <div class="card-value">${money(r.caixaLiberadaAcumulada)}</div>
      <div class="card-sub">${pct(r.percCaixaLiberada)} de ${money(r.creditoCaixaTotalPCI)}</div>
    </div>
    <div class="card ${r.saldoRecursoDisponivel < 0 ? 'warn' : 'good'}">
      <div class="card-label">Saldo de recurso disponível</div>
      <div class="card-value">${money(r.saldoRecursoDisponivel)}</div>
      <div class="card-sub">Recurso próprio + caixa liberado − gasto acumulado</div>
    </div>
    <div class="card">
      <div class="card-label">Total administração (RS Engenharia)</div>
      <div class="card-value">${money(r.totalAdmPago)}</div>
      <div class="card-sub">Taxa: ${pct(VIEW.parametros.taxaAdministracaoPercent)}</div>
    </div>
    <div class="card">
      <div class="card-label">Gasto no cartão (realizado)</div>
      <div class="card-value">${money(r.totalCartaoPago)}</div>
      <div class="card-sub">Total gasto acumulado: ${money(r.totalGastoAcumulado)}</div>
    </div>
  `;
  root.appendChild(cards);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Contas a Pagar — parcelas quinzenais (documento enviado ao cliente)</h2>
        <div class="muted">Editável em qualquer campo. "Total a transferir" e "Custo total" são calculados automaticamente, mas podem ser sobrescritos quando o valor real vier diferente do planejado.</div>
      </div>
      <button class="btn primary" id="btnNovaParcela">+ Nova parcela</button>
    </div>
    <div class="table-scroll"><table class="data" id="tblParcelas">
      <thead><tr>
        <th>Parcela</th><th class="num">Empreiteiro (PIX)</th><th class="num">ADM (PIX)</th>
        <th class="num">Cartão</th><th class="num">Total a transferir</th><th class="num">Evolução Caixa</th>
        <th class="num">Custo total</th><th>Venc. planejado</th><th>Venc. real</th><th>Status</th><th class="wrap">Obs.</th><th></th>
      </tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table></div>
  `;
  root.appendChild(panel);

  const tbody = panel.querySelector('tbody');
  for (const p of VIEW.parcelas) {
    const tr = document.createElement('tr');
    tr.appendChild(td(textInput({ value: p.label, onSave: (v) => updateParcela(p.id, { label: v }) })));
    tr.appendChild(td(numberInput({ value: p.totalEmpreiteiroPix, onSave: (v) => updateParcela(p.id, { totalEmpreiteiroPix: v }) })));
    tr.appendChild(td(numberInput({ value: p.totalAdmPix, onSave: (v) => updateParcela(p.id, { totalAdmPix: v }) })));
    tr.appendChild(td(numberInput({ value: p.gastoCartao, onSave: (v) => updateParcela(p.id, { gastoCartao: v }) })));
    tr.appendChild(td(numberInput({ value: p.totalATransferir, manual: !!p.overrides?.totalATransferir, onSave: (v) => updateParcela(p.id, { totalATransferir: v }) })));
    tr.appendChild(td(numberInput({ value: p.parcelaEvolucaoCaixa, onSave: (v) => updateParcela(p.id, { parcelaEvolucaoCaixa: v }) })));
    tr.appendChild(td(numberInput({ value: p.custoTotal, manual: !!p.overrides?.custoTotal, onSave: (v) => updateParcela(p.id, { custoTotal: v }) })));
    tr.appendChild(td(dateInput({ value: p.vencPlanejado, onSave: (v) => updateParcela(p.id, { vencPlanejado: v }) })));
    tr.appendChild(td(dateInput({ value: p.vencimento, onSave: (v) => updateParcela(p.id, { vencimento: v }) })));
    tr.appendChild(td(selectInput({ value: p.status, options: ['PLANEJADO', 'REALIZADO'], onSave: (v) => updateParcela(p.id, { status: v }) })));
    tr.appendChild(td(textInput({ value: p.obs, wide: true, onSave: (v) => updateParcela(p.id, { obs: v }) })));
    const delTd = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
    delBtn.onclick = () => { if (confirm(`Remover parcela "${p.label}"?`)) deleteParcela(p.id); };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  }

  const tfoot = panel.querySelector('tfoot');
  const sumF = (f) => VIEW.parcelas.reduce((a, p) => a + (Number(p[f]) || 0), 0);
  tfoot.innerHTML = `<tr>
    <td>TOTAL</td>
    <td class="num">${money(sumF('totalEmpreiteiroPix'))}</td>
    <td class="num">${money(sumF('totalAdmPix'))}</td>
    <td class="num">${money(sumF('gastoCartao'))}</td>
    <td class="num">${money(sumF('totalATransferir'))}</td>
    <td class="num">${money(sumF('parcelaEvolucaoCaixa'))}</td>
    <td class="num">${money(sumF('custoTotal'))}</td>
    <td colspan="5"></td>
  </tr>`;

  document.getElementById('btnNovaParcela').onclick = () => openNovaParcelaModal();
}

function openNovaParcelaModal() {
  const r = VIEW.resumo;
  openModal('Nova parcela (Contas a Pagar)', (body, close) => {
    const form = document.createElement('form');
    form.className = 'form-grid';
    form.innerHTML = `
      <label>Rótulo (ex.: SETEMBRO/3º PARCELA)
        <input name="label" value="NOVA PARCELA" required />
      </label>
      <label>Total empreiteiro (PIX)
        <input name="totalEmpreiteiroPix" type="number" step="0.01" value="${r.sugestaoProximaParcelaEmpreiteiro}" />
      </label>
      <label>Total ADM (PIX)
        <input name="totalAdmPix" type="number" step="0.01" value="${r.sugestaoProximaParcelaAdm}" />
      </label>
      <label>Gasto cartão
        <input name="gastoCartao" type="number" step="0.01" value="0" />
      </label>
      <label>Parcela evolução caixa
        <input name="parcelaEvolucaoCaixa" type="number" step="0.01" value="0" />
      </label>
      <label>Vencimento planejado
        <input name="vencPlanejado" type="date" />
      </label>
      <label>Vencimento real
        <input name="vencimento" type="date" />
      </label>
      <label>Status
        <select name="status"><option>PLANEJADO</option><option>REALIZADO</option></select>
      </label>
      <label style="grid-column: 1 / -1">Observação
        <textarea name="obs"></textarea>
      </label>
      <div style="grid-column: 1 / -1; display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Criar parcela</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      addParcela(payload);
      close();
      toast('Parcela criada.');
    });
    const hint = document.createElement('div');
    hint.className = 'muted';
    hint.textContent = `Sugestão automática = medido até agora (${money(r.totalMedido)}) − já pago (${money(r.totalEmpreiteiroPago)}).`;
    body.appendChild(hint);
    body.appendChild(form);
  });
}

/* ==========================================================================
   TAB 2 — Lançar Avanços
   ========================================================================== */
function renderAvancos() {
  const root = document.getElementById('tab-avancos');
  root.innerHTML = '';

  const info = document.createElement('div');
  info.className = 'panel';
  info.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Lançar avanços da obra</h2>
        <div class="muted">Informe o % de avanço físico/financeiro de cada categoria. O sistema recalcula automaticamente a liberação de caixa (PCI), o valor a pagar ao empreiteiro e o saldo disponível.</div>
      </div>
      <div class="legend">
        <span><span class="dot manual"></span>% lançado manualmente</span>
        <span><span class="dot auto"></span>% calculado pela soma dos itens (Detalhamento FC)</span>
      </div>
    </div>
    <div class="table-scroll"><table class="data">
      <thead><tr>
        <th>Nº</th><th class="wrap">Categoria</th><th class="num">Valor orçado</th>
        <th class="num">% itens (FC)</th><th class="num">% avanço efetivo</th><th>Progresso</th>
        <th class="num">Valor medido</th><th class="num">Saldo do contrato</th><th></th>
      </tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table></div>
  `;
  root.appendChild(info);
  const tbody = info.querySelector('tbody');

  for (const c of VIEW.categorias) {
    const tr = document.createElement('tr');
    tr.appendChild(td(`${c.numero}`));
    tr.appendChild(td(`<span class="wrap">${esc(c.nome)}</span>`));
    tr.appendChild(td(`<span class="num">${money(c.valorOrcado)}</span>`));
    tr.appendChild(td(`<span class="num">${pct(c.percAvancoItens)}</span>`));

    const percCell = document.createElement('td');
    const percInputEl = numberInput({
      value: Math.round(c.percAvancoEfetivo * 1000) / 10,
      manual: c.origemPercAvanco === 'manual',
      step: '0.1', min: 0,
      onSave: (v) => lancarAvanco(c.id, { perc: v / 100 }),
    });
    percInputEl.title = '% de avanço (0-100). Define manualmente e desacopla da soma dos itens.';
    percCell.appendChild(percInputEl);
    tr.appendChild(percCell);

    const barTd = document.createElement('td');
    barTd.innerHTML = `<div class="progress-bar small"><span style="width:${Math.min(100, c.percAvancoEfetivo * 100)}%"></span></div>`;
    tr.appendChild(barTd);

    tr.appendChild(td(`<span class="num">${money(c.valorMedido)}</span>`));
    tr.appendChild(td(`<span class="num">${money(c.saldoContratoCategoria)}</span>`));

    const actionTd = document.createElement('td');
    if (c.origemPercAvanco === 'manual') {
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.textContent = 'usar % dos itens';
      btn.onclick = () => limparAvancoManual(c.id);
      actionTd.appendChild(btn);
    }
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  }

  const tfoot = info.querySelector('tfoot');
  const totalOrc = VIEW.resumo.totalOrcadoCategorias;
  const totalMedido = VIEW.resumo.totalMedido;
  tfoot.innerHTML = `<tr>
    <td colspan="2">TOTAL / % GERAL DA OBRA</td>
    <td class="num">${money(totalOrc)}</td>
    <td></td>
    <td class="num">${pct(VIEW.resumo.percObraGeral)}</td>
    <td></td>
    <td class="num">${money(totalMedido)}</td>
    <td class="num">${money(totalOrc - totalMedido)}</td>
    <td></td>
  </tr>`;

  const hist = document.createElement('div');
  hist.className = 'panel';
  hist.innerHTML = `<div class="panel-header"><h2>Histórico de avanços lançados</h2></div>`;
  const histTable = document.createElement('div');
  histTable.className = 'table-scroll';
  if (!VIEW.historicoAvancos.length) {
    histTable.innerHTML = '<div class="muted">Nenhum avanço lançado ainda.</div>';
  } else {
    histTable.innerHTML = `<table class="data"><thead><tr>
      <th>Data</th><th class="wrap">Categoria</th><th class="num">% anterior</th><th class="num">% novo</th><th class="wrap">Observação</th>
    </tr></thead><tbody>${VIEW.historicoAvancos.map((h) => `
      <tr>
        <td>${dateBR(h.data)}</td>
        <td class="wrap">${esc(h.categoriaNome)}</td>
        <td class="num">${h.percAvancoAnterior == null ? '—' : pct(h.percAvancoAnterior)}</td>
        <td class="num">${pct(h.percAvancoNovo)}</td>
        <td class="wrap">${esc(h.obs)}</td>
      </tr>`).join('')}</tbody></table>`;
  }
  hist.appendChild(histTable);
  root.appendChild(hist);
}

/* ==========================================================================
   TAB 3 — Detalhamento FC (itens por categoria)
   ========================================================================== */
function renderDetalhamento() {
  const root = document.getElementById('tab-detalhamento');
  root.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'panel';
  header.innerHTML = `<div class="panel-header">
    <div>
      <h2>Detalhamento FC — orçado x realizado por item</h2>
      <div class="muted">Cada categoria soma seus itens automaticamente. Edite valores realizados, orçados, datas e forma de pagamento; adicione ou remova itens conforme o lançamento real.</div>
    </div>
  </div>`;
  root.appendChild(header);

  for (const c of VIEW.categorias) {
    const block = document.createElement('div');
    block.className = `category-block${OPEN_CATEGORIES.has(c.id) ? ' open' : ''}`;

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `
      <span class="name">${c.numero}. ${esc(c.nome)}</span>
      <span class="stats">
        <span>Orçado: <strong>${money(c.valorOrcado)}</strong></span>
        <span>Realizado: <strong>${money(c.valorRealizadoItens)}</strong></span>
        <span class="badge ${c.percAvancoItens >= 1 ? 'green' : c.percAvancoItens > 0 ? 'accent' : 'gray'}">${pct(c.percAvancoItens)}</span>
      </span>
    `;
    head.onclick = () => {
      if (OPEN_CATEGORIES.has(c.id)) OPEN_CATEGORIES.delete(c.id); else OPEN_CATEGORIES.add(c.id);
      renderDetalhamento();
    };
    block.appendChild(head);

    const body = document.createElement('div');
    body.className = 'category-body';
    const tableWrap = document.createElement('div');
    tableWrap.className = 'table-scroll';
    tableWrap.innerHTML = `<table class="data"><thead><tr>
      <th class="wrap">Descrição</th><th>Unid.</th><th class="num">Orçado (R$)</th><th class="num">Realizado (R$)</th>
      <th>Data pagto.</th><th>Forma pgto.</th><th></th>
    </tr></thead><tbody></tbody></table>`;
    const tbody = tableWrap.querySelector('tbody');

    for (const it of c.itens) {
      const tr = document.createElement('tr');
      tr.appendChild(td(textInput({ value: it.descricao, wide: true, onSave: (v) => updateItem(c.id, it.id, { descricao: v }) })));
      tr.appendChild(td(textInput({ value: it.unidade, onSave: (v) => updateItem(c.id, it.id, { unidade: v }) })));
      tr.appendChild(td(numberInput({ value: it.valorOrcado, onSave: (v) => updateItem(c.id, it.id, { valorOrcado: v }) })));
      tr.appendChild(td(numberInput({ value: it.valorRealizado, manual: true, onSave: (v) => updateItem(c.id, it.id, { valorRealizado: v }) })));
      tr.appendChild(td(dateInput({ value: it.dataPagamento, onSave: (v) => updateItem(c.id, it.id, { dataPagamento: v }) })));
      tr.appendChild(td(selectInput({ value: it.formaPagamento || 'PIX', options: ['PIX', 'CARTÃO', 'DINHEIRO', 'TRANSFERÊNCIA', 'OUTRO'], onSave: (v) => updateItem(c.id, it.id, { formaPagamento: v }) })));
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '🗑';
      delBtn.onclick = () => { if (confirm('Remover este item?')) deleteItem(c.id, it.id); };
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    }
    body.appendChild(tableWrap);

    const addBtn = document.createElement('button');
    addBtn.className = 'btn small';
    addBtn.style.marginTop = '10px';
    addBtn.textContent = '+ Adicionar item';
    addBtn.onclick = () => { OPEN_CATEGORIES.add(c.id); addItem(c.id, { descricao: 'Novo item', unidade: '', valorOrcado: 0, valorRealizado: 0 }); };
    body.appendChild(addBtn);

    block.appendChild(body);
    root.appendChild(block);
  }
}

/* ==========================================================================
   TAB 4 — Fluxo de Caixa (mensal)
   ========================================================================== */
function renderFluxo() {
  const root = document.getElementById('tab-fluxo');
  root.innerHTML = '';

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Fluxo de caixa mensal</h2>
        <div class="muted">Agregado a partir de todas as parcelas lançadas em "Contas a Pagar" (planejadas e realizadas) mais ajustes manuais. A liberação de caixa (PCI) aparece no mês originalmente programado de cada etapa. Para o saldo já efetivamente realizado, veja os cards do Dashboard.</div>
      </div>
      <button class="btn primary" id="btnNovoAjuste">+ Ajuste manual</button>
    </div>
    <div class="table-scroll"><table class="data"><thead><tr>
      <th>Mês</th><th class="num">Entrada recurso próprio</th><th class="num">Entrada caixa (PCI)</th><th class="num">Entrada ajuste</th><th class="num">Entrada total</th>
      <th class="num">Saída empreiteiro (PIX)</th><th class="num">Saída ADM (PIX)</th>
      <th class="num">Saída cartão</th><th class="num">Saída ajuste</th><th class="num">Saída total</th><th class="num">Saldo acumulado</th>
    </tr></thead><tbody></tbody></table></div>
  `;
  root.appendChild(panel);
  const tbody = panel.querySelector('tbody');
  for (const m of VIEW.fluxoCaixaMensal) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(m.label)}</td>
      <td class="num">${money(m.entradaRecursoProprio)}</td>
      <td class="num">${money(m.entradaCaixaPCI)}</td>
      <td class="num">${money(m.entradaAjusteManual)}</td>
      <td class="num" style="font-weight:700">${money(m.entradaTotal)}</td>
      <td class="num">${money(m.saidaEmpreiteiroPix)}</td>
      <td class="num">${money(m.saidaAdmPix)}</td>
      <td class="num">${money(m.saidaCartao)}</td>
      <td class="num">${money(m.saidaAjusteManual)}</td>
      <td class="num" style="font-weight:700">${money(m.saidaTotal)}</td>
      <td class="num" style="font-weight:700; color:${m.saldoAcumuladoMes < 0 ? 'var(--danger)' : 'var(--good)'}">${money(m.saldoAcumuladoMes)}</td>
    `;
    tbody.appendChild(tr);
  }
  if (!VIEW.fluxoCaixaMensal.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="muted">Nenhuma parcela lançada ainda.</td></tr>';
  }

  const ajustesPanel = document.createElement('div');
  ajustesPanel.className = 'panel';
  ajustesPanel.innerHTML = `<div class="panel-header"><h2>Ajustes manuais lançados</h2></div>`;
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  if (!VIEW.fluxoCaixaAjustes.length) {
    wrap.innerHTML = '<div class="muted">Nenhum ajuste manual lançado.</div>';
  } else {
    wrap.innerHTML = `<table class="data"><thead><tr><th>Data</th><th>Tipo</th><th class="num">Valor</th><th class="wrap">Descrição</th><th></th></tr></thead>
      <tbody>${VIEW.fluxoCaixaAjustes.map((a) => `
        <tr>
          <td>${dateBR(a.data)}</td>
          <td><span class="badge ${a.tipo === 'entrada' ? 'green' : 'red'}">${a.tipo}</span></td>
          <td class="num">${money(a.valor)}</td>
          <td class="wrap">${esc(a.descricao)}</td>
          <td><button class="icon-btn" data-del="${a.id}">🗑</button></td>
        </tr>`).join('')}</tbody></table>`;
  }
  ajustesPanel.appendChild(wrap);
  ajustesPanel.querySelectorAll('[data-del]').forEach((btn) => {
    btn.onclick = () => deleteAjuste(btn.dataset.del);
  });
  root.appendChild(ajustesPanel);

  document.getElementById('btnNovoAjuste').onclick = () => openNovoAjusteModal();
}

function openNovoAjusteModal() {
  openModal('Novo ajuste manual no fluxo de caixa', (body, close) => {
    const form = document.createElement('form');
    form.className = 'form-grid';
    form.innerHTML = `
      <label>Data<input name="data" type="date" required /></label>
      <label>Tipo
        <select name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
      </label>
      <label>Valor<input name="valor" type="number" step="0.01" required /></label>
      <label style="grid-column: 1 / -1">Descrição<textarea name="descricao"></textarea></label>
      <div style="grid-column: 1 / -1; display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Adicionar</button>
      </div>
    `;
    form.querySelector('#cancelBtn').onclick = close;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      addAjuste(payload);
      close();
    });
    body.appendChild(form);
  });
}

  root.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <h2>Liberação PCI — cronograma de liberação do financiamento CAIXA</h2>
        <div class="muted">Liberação automática segue o % geral de obra (aba Lançar Avanços) dentro da faixa de cada etapa. Use "liberado manual" quando o banco liberar valor diferente do calculado.</div>
      </div>
    </div>
    <div class="table-scroll"><table class="data"><thead><tr>
      <th>Etapa</th><th class="wrap">Descrição</th><th class="num">% limite acumulado</th><th class="num">Valor da etapa</th>
      <th class="num">Mês programado</th><th class="num">% liberado</th><th class="num">Valor liberado</th><th class="num">Liberado manual (opcional)</th>
    </tr></thead><tbody></tbody>
    <tfoot></tfoot></table></div>
  `;
  root.appendChild(panel);
  const tbody = panel.querySelector('tbody');
  for (const e of VIEW.liberacaoPCI) {
    const tr = document.createElement('tr');
    tr.appendChild(td(`${e.etapa}`));
    tr.appendChild(td(textInput({ value: e.descricao, wide: true, onSave: (v) => updateLiberacaoPCI(e.etapa, { descricao: v }) })));
    tr.appendChild(td(numberInput({ value: Math.round(e.percLimiteAcumulado * 1000) / 10, step: '0.1', onSave: (v) => updateLiberacaoPCI(e.etapa, { percLimiteAcumulado: v / 100 }) })));
    tr.appendChild(td(numberInput({ value: e.valor, onSave: (v) => updateLiberacaoPCI(e.etapa, { valor: v }) })));
    tr.appendChild(td(numberInput({ value: e.mesProgramado, step: '1', onSave: (v) => updateLiberacaoPCI(e.etapa, { mesProgramado: v }) })));
    tr.appendChild(td(`<span class="num">${pct(e.percLiberado)}</span>`));
    tr.appendChild(td(`<span class="num" style="font-weight:700">${money(e.valorLiberado)}</span> <span class="badge ${e.origemLiberado === 'manual' ? 'accent' : 'gray'}">${e.origemLiberado}</span>`));
    const manualTd = document.createElement('td');
    const manualInput = numberInput({
      value: e.liberadoManual == null ? '' : e.liberadoManual,
      manual: e.liberadoManual != null,
      onSave: (v) => updateLiberacaoPCI(e.etapa, { liberadoManual: v }),
    });
    manualInput.placeholder = 'automático';
    manualTd.appendChild(manualInput);
    if (e.liberadoManual != null) {
      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn small'; clearBtn.style.marginLeft = '6px'; clearBtn.textContent = 'auto';
      clearBtn.onclick = () => updateLiberacaoPCI(e.etapa, { liberadoManual: null });
      manualTd.appendChild(clearBtn);
    }
    tr.appendChild(manualTd);
    tbody.appendChild(tr);
  }
  const tfoot = panel.querySelector('tfoot');
  tfoot.innerHTML = `<tr>
    <td colspan="3">TOTAL</td>
    <td class="num">${money(VIEW.resumo.creditoCaixaTotalPCI)}</td>
    <td></td><td></td>
    <td class="num">${money(VIEW.resumo.caixaLiberadaAcumulada)}</td>
    <td></td>
  </tr>`;
}

/* ==========================================================================
   TAB 6 — Parâmetros
   ========================================================================== */
function renderParametros() {
  const root = document.getElementById('tab-parametros');
  root.innerHTML = '';

  const obraPanel = document.createElement('div');
  obraPanel.className = 'panel';
  obraPanel.innerHTML = `<div class="panel-header"><h2>Dados da obra</h2></div>`;
  const obraForm = document.createElement('div');
  obraForm.className = 'form-grid';
  const metaFields = [
    ['obra', 'Nome da obra'], ['endereco', 'Endereço'], ['proprietario', 'Proprietário'],
    ['responsavelTecnico', 'Responsável técnico'], ['areaM2', 'Área (m²)'],
    ['dataInicio', 'Data de início'], ['previsaoTermino', 'Previsão de término'],
  ];
  for (const [key, label] of metaFields) {
    const wrap = document.createElement('label');
    wrap.textContent = label;
    const isDate = key.startsWith('data') || key.startsWith('previsao');
    const input = document.createElement('input');
    input.type = isDate ? 'date' : (key === 'areaM2' ? 'number' : 'text');
    input.value = VIEW.meta[key] ?? '';
    input.addEventListener('blur', () => updateMeta({ [key]: isDate ? (input.value || null) : (key === 'areaM2' ? Number(input.value) : input.value) }));
    wrap.appendChild(input);
    obraForm.appendChild(wrap);
  }
  obraPanel.appendChild(obraForm);
  root.appendChild(obraPanel);

  const paramPanel = document.createElement('div');
  paramPanel.className = 'panel';
  paramPanel.innerHTML = `<div class="panel-header"><h2>Parâmetros financeiros</h2><div class="muted">Base para os cálculos de liberação de caixa e saldo disponível.</div></div>`;
  const paramForm = document.createElement('div');
  paramForm.className = 'form-grid';
  const paramFields = [
    ['recursoProprioPlanejado', 'Recurso próprio planejado (R$)'],
    ['financiamentoObraCaixa', 'Financiamento obra — CAIXA (R$)'],
    ['financiamentoLoteCaixa', 'Financiamento lote — CAIXA (R$)'],
    ['contratoTotalEmpreiteiro', 'Contrato total empreiteiro (R$)'],
    ['taxaAdministracaoPercent', 'Taxa de administração (%) — RS Engenharia'],
    ['taxaJurosAnualCEF', 'Taxa de juros anual CEF (%)'],
  ];
  for (const [key, label] of paramFields) {
    const wrap = document.createElement('label');
    wrap.textContent = label;
    const isPercent = key.toLowerCase().includes('percent') || key.toLowerCase().includes('taxa');
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.01';
    input.value = isPercent ? Math.round((VIEW.parametros[key] || 0) * 10000) / 100 : VIEW.parametros[key];
    input.addEventListener('blur', () => updateParametros({ [key]: isPercent ? Number(input.value) / 100 : Number(input.value) }));
    wrap.appendChild(input);
    paramForm.appendChild(wrap);
  }
  paramPanel.appendChild(paramForm);
  root.appendChild(paramPanel);

  const dangerPanel = document.createElement('div');
  dangerPanel.className = 'panel';
  dangerPanel.innerHTML = `<div class="panel-header"><h2>Dados</h2></div>
    <div class="muted" style="margin-bottom:8px">Restaura todos os dados para os valores originais extraídos da planilha (Casa Newton — Toscana). Isso apaga edições feitas no app.</div>`;
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn danger';
  resetBtn.textContent = 'Restaurar dados originais da planilha';
  resetBtn.onclick = () => {
    if (confirm('Tem certeza? Todas as edições feitas no app serão perdidas.')) {
      resetToSeed();
      toast('Dados restaurados.');
    }
  };
  dangerPanel.appendChild(resetBtn);
  root.appendChild(dangerPanel);
}

/* ==========================================================================
   Modal genérico
   ========================================================================== */
function openModal(title, buildBody) {
  const tpl = document.getElementById('tpl-modal');
  const node = tpl.content.cloneNode(true);
  const backdrop = node.querySelector('.modal-backdrop');
  node.querySelector('h3').textContent = title;
  const body = node.querySelector('.modal-body');
  const close = () => backdrop.remove();
  node.querySelector('.modal-close').onclick = close;
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  buildBody(body, close);
  document.body.appendChild(node);
}

/* ==========================================================================
   Init
   ========================================================================== */
restoreViewState();
setupTabs();
renderAll();
ARTIFACT_NS_PROMISE.then((ns) => { if (!ns) enterReadOnly(); });
